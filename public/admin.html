<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة تحكم المشرف</title>
</head>
<body>
<h1>لوحة تحكم المشرف</h1>
<div id="pending-teachers">
<h2>المعلمون المعلقون</h2>
</div>
<div>
<h2>إدارة المستخدمين</h2>
<button onclick="deleteAll('teacher')">حذف جميع المعلمين</button>
<button onclick="deleteAll('student')">حذف جميع الطلاب</button>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.0/firebase-app.js";
import { getFirestore, collection, query, where, getDocs, updateDoc, doc, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyDTst5UKgNJ6ThVOAVHOG3JoWfEvUp1asw",
  authDomain: "manarat-alnutq.firebaseapp.com",
  databaseURL: "https://manarat-alnutq-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "manarat-alnutq",
  storageBucket: "manarat-alnutq.firebasestorage.app",
  messagingSenderId: "543101731444",
  appId: "1:543101731444:web:35a8daf145603c66978721",
  measurementId: "G-ZFKWLDT384"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
async function approveTeacher(teacherId) {
const teacherRef = doc(db, "users", teacherId);
await updateDoc(teacherRef, { status: "approved" });
alert("تم اعتماد المعلم بنجاح!");
getPendingTeachers();
}
async function deleteDocument(collectionName, docId) {
if (confirm("هل أنت متأكد؟")) {
await deleteDoc(doc(db, collectionName, docId));
alert("تم الحذف بنجاح!");
getPendingTeachers();
}
}
async function deleteAll(role) {
if (confirm(هل أنت متأكد من حذف جميع مستخدمي دور ${role}؟)) {
const q = query(collection(db, "users"), where("role", "==", role));
const querySnapshot = await getDocs(q);
const batch = writeBatch(db);
querySnapshot.forEach((doc) => {
batch.delete(doc.ref);
});
await batch.commit();
alert("تم الحذف بنجاح!");
getPendingTeachers();
}
}
window.approveTeacher = approveTeacher;
window.deleteDocument = deleteDocument;
window.deleteAll = deleteAll;
async function getPendingTeachers() {
const container = document.getElementById("pending-teachers");
container.innerHTML = "<h2>المعلمون المعلقون</h2>";
const q = query(collection(db, "users"), where("role", "==", "teacher"), where("status", "==", "pending"));
const querySnapshot = await getDocs(q);
if (querySnapshot.empty) {
container.innerHTML += "<p>لا يوجد معلمون بانتظار الاعتماد.</p>";
return;
}
querySnapshot.forEach((doc) => {
const teacher = doc.data();
const div = document.createElement("div");
div.innerHTML = <p>البريد: ${teacher.email}  <button id="btn-${doc.id}">اعتماد</button> <button onclick="deleteDocument('users', '${doc.id}')">حذف المعلم</button></p>;
container.appendChild(div);
document.getElementById(btn-${doc.id}).onclick = () => approveTeacher(doc.id);
});
}
getPendingTeachers();
</script>
</body>
</html>
