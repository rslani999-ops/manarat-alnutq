    // ============================================================

      authMode: 'login', // 'login' | 'signup'
      currentView: 'dashboard', // 'dashboard' | 'diag' | 'iep' | 'sessions'
      students: [],
      selectedStudent: null,
      diagEval: {}, // تقييم الحروف الحالية
      sessions: [],
      toastMessage: '',
      recordingState: { isRecording: false, targetLetter: null },

    };

    function showToast(msg) {
      state.toastMessage = msg;
      render();
      setTimeout(() => {
        state.toastMessage = '';
        render();
      }, 3000);
    }

    // ============================================================
    // المعالجة الصوتية والخوارزميات (Levenshtein)
    // ============================================================
    function levenshteinDistance(a, b) {
      const matrix = [];
      for (let i = 0; i <= b.length; i++) matrix[i] = [i];
      for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
      for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
          if (b[i-1] === a[j-1]) matrix[i][j] = matrix[i-1][j-1];
          else matrix[i][j] = Math.min(matrix[i-1][j-1] + 1, matrix[i][j-1] + 1, matrix[i-1][j] + 1);
        }
      }
      return matrix[b.length][a.length];
    }

    function similarity(s1, s2) {
      const dist = levenshteinDistance(s1, s2);
      const maxLen = Math.max(s1.length, s2.length);
      return maxLen === 0 ? 1.0 : 1 - dist / maxLen;
    }

    function recordVoice(targetText, letter) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        showToast('⚠️ متصفحك لا يدعم التعرف الصوتي. يفضل استخدام Google Chrome.');
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.lang = 'ar-SA';
      
      state.recordingState = { isRecording: true, targetLetter: letter };
      render();

      recognition.onresult = (e) => {
        const text = e.results[0][0].transcript.trim();
        const sim = similarity(targetText, text);
        
        let status = 'passed';
        if (sim < 0.5) status = 'unclear';
        else if (sim < 0.8) status = 'need';

        state.diagEval[letter] = {
          status: status,
          similarity: Math.round(sim * 100),
          spokenText: text,
          disorderType: status === 'passed' ? 'طبيعي' : 'إبدال/تشويه'
        };

        state.recordingState = { isRecording: false, targetLetter: null };
        showToast(`تم النطق: "${text}" (نسبة الدقة ${Math.round(sim*100)}%)`);
        render();
      };

      recognition.onerror = () => {
        state.recordingState = { isRecording: false, targetLetter: null };
        showToast('❌ لم يتم التقاط الصوت بوضوح.');
        render();
      };

      recognition.start();
    }

    // ============================================================
    // إدارة البيانات (Firebase Firestore Integrations)
    // ============================================================
    async function loadTeacherData() {
      if (!state.user) return;
      try {
        const q = query(collection(db, "students"), where("teacherId", "==", state.user.uid));
        const snap = await getDocs(q);
        state.students = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        render();
      } catch (e) {
        console.error(e);
      }
    }

    async function loadStudentSessions(studentId) {
      try {
        const q = query(collection(db, "sessions"), where("studentId", "==", studentId));
        const snap = await getDocs(q);
        state.sessions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        render();
      } catch (e) {
        console.error(e);
      }
    }

    // ============================================================
    // توليد الخطة الفردية (IEP Generator)
    // ============================================================
    function buildIEPData() {
      const student = state.selectedStudent;
      const diag = state.diagEval || {};
      
      const passed = [], need = [], unclear = [], trained = [];
      Object.keys(diag).forEach(l => {
        const st = diag[l].status;
        if (st === 'passed') passed.push(l);
        if (st === 'trained') trained.push(l);
        if (st === 'need') need.push(l);
        if (st === 'unclear') unclear.push(l);
      });

      const name = student ? (student.fullName || student.email) : 'الطالب';
      
      return {
        studentName: name,
        passed, trained, need, unclear,
        date: new Date().toLocaleDateString('ar-SA'),
        goalsShort: need.map(l => `أن ينطق الطالب حرف (${l}) بشكل صحيح في بداية ووسط الكلمة بمساعدة المرآة.`),
        goalsLong: `تمكين الطالب من نطق الحروف التي بها صعوبات (${[...need, ...unclear].join('، ')}) في الجمل التلقائية بنسبة إتقان 80%.`
      };
    }

    // ============================================================
    // الواجهات التفاعلية (HTML Templates)
    // ============================================================
    function renderTopbar() {
      if (!state.user) return '';
      return `
        <div class="topbar">
          <div class="brand" onclick="window.location.reload()">
            <div class="mark">م</div>
            <div>
              <h1>منارة النطق</h1>
              <span>مساعدك الذكي للتخاطب</span>
            </div>
          </div>
          <div class="nav-btns">
            <button class="btn-nav ${state.currentView === 'dashboard' ? 'active':''}" id="nav-dash">لوحة التحكم</button>
            ${state.selectedStudent ? `
              <button class="btn-nav ${state.currentView === 'diag' ? 'active':''}" id="nav-diag">التشخيص</button>
              <button class="btn-nav ${state.currentView === 'sessions' ? 'active':''}" id="nav-sess">الجلسات</button>
              <button class="btn-nav ${state.currentView === 'iep' ? 'active':''}" id="nav-iep">الخطة الفردية (IEP)</button>
            ` : ''}
            <button class="btn-nav" id="btn-logout" style="color:var(--coral)">خروج</button>
          </div>
        </div>
      `;
    }

    function renderAuthView() {
      return `
        <div class="auth-form">
          <h2>منارة النطق</h2>
          <p class="muted" style="text-align:center; margin-bottom:15px;">منصة التشخيص والتأهيل اللغوي للطلاب</p>
          <input type="email" id="auth-email" placeholder="البريد الإلكتروني" />
          <input type="password" id="auth-pass" placeholder="كلمة المرور" />
          ${state.authMode === 'signup' ? `
            <input type="text" id="auth-name" placeholder="الاسم الكامل" />
            <select id="auth-role">
              <option value="teacher">معلم / أخصائي</option>
              <option value="parent">ولي أمر</option>
            </select>
          ` : ''}
          <button class="btn btn-primary btn-block" id="btn-auth-submit">
            ${state.authMode === 'login' ? 'دخول' : 'إنشاء حساب جديد'}
          </button>
          <div class="auth-toggle">
            ${state.authMode === 'login' ? 
              'ليس لديك حساب؟ <span id="toggle-auth">سجل الآن</span>' : 
              'لديك حساب بالفعل؟ <span id="toggle-auth">تسجيل الدخول</span>'}
          </div>
        </div>
      `;
    }

    function renderDashboardView() {
      return `
        <div class="card">
          <h3>قائمة الطلاب المضافين</h3>
          <p class="muted">اختر طالبًا لمتابعة التقييم والجلسات، أو أضف طالبًا جديدًا.</p>
          <div style="margin-top:15px; display:flex; gap:10px;">
            <input type="text" id="new-student-name" placeholder="اسم الطالب الجديد..." style="margin-bottom:0;" />
            <button class="btn btn-primary" id="btn-add-student">إضافة</button>
          </div>
        </div>
        <div class="card">
          ${state.students.length === 0 ? '<p class="muted">لا يوجد طلاب مضافون حاليًا.</p>' : ''}
          ${state.students.map(s => `
            <div class="student-row">
              <div>
                <strong>${s.fullName || 'طالب'}</strong>
                <div class="muted" style="font-size:12px;">مُضاف بتاريخ: ${s.createdAt ? new Date(s.createdAt).toLocaleDateString('ar-SA') : 'جديد'}</div>
              </div>
              <button class="btn btn-soft btn-sm btn-select-student" data-id="${s.id}">اختر الطالب للعمل عليه ←</button>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderDiagnosticView() {
      const letters = Object.keys(REFERENCE.letters);
      return `
        <div class="card">
          <h3>التشخيص الشامل لمخارج الحروف (${state.selectedStudent?.fullName || ''})</h3>
          <p class="muted">اضغط على زر التسجيل واطلب من الطالب نطق الحرف لتقييمه تلقائيًا عبر الذكاء الاصطناعي.</p>
        </div>
        <div class="diag-grid">
          ${letters.map(l => {
            const evalData = state.diagEval[l] || { status: 'none' };
            const isRec = state.recordingState.isRecording && state.recordingState.targetLetter === l;
            return `
              <div class="letter-card">
                <div class="letter-circle">${l}</div>
                <div style="font-size:12px; color:#555;">المخرج: ${REFERENCE.letters[l].makhraj}</div>
                <div style="margin: 8px 0;">
                  <button class="btn-record ${isRec ? 'recording':''}" data-letter="${l}">
                    ${isRec ? '🎤 جاري الاستماع...' : '🎙️ تسجيل النطق'}
                  </button>
                </div>
                ${evalData.similarity ? `<div style="font-size:11px; color:var(--mint-deep); font-weight:bold;">الدقة: ${evalData.similarity}%</div>`:''}
                <div class="eval-btns">
                  <button class="eval-btn passed ${evalData.status === 'passed' ? 'active':''}" data-l="${l}" data-st="passed">متقن</button>
                  <button class="eval-btn trained ${evalData.status === 'trained' ? 'active':''}" data-l="${l}" data-st="trained">مكتسب</button>
                  <button class="eval-btn need ${evalData.status === 'need' ? 'active':''}" data-l="${l}" data-st="need">تدريب</button>
                  <button class="eval-btn unclear ${evalData.status === 'unclear' ? 'active':''}" data-l="${l}" data-st="unclear">غير واضح</button>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderSessionsView() {
      return `
        <div class="card">
          <h3>سجل الجلسات التأهيلية (${state.selectedStudent?.fullName})</h3>
          <div style="margin-top:15px;">
            <textarea id="session-notes" placeholder="اكتب ملاحظات وتطورات الجلسة هنا..." rows="3"></textarea>
            <button class="btn btn-primary" id="btn-save-session">حفظ الجلسة</button>
          </div>
        </div>
        <div class="card">
          <h3>الجلسات السابقة</h3>
          ${state.sessions.length === 0 ? '<p class="muted">لا توجد جلسات مسجلة بعد.</p>' : ''}
          <table class="sessions-table">
            <thead>
              <tr>
                <th>التاريخ</th>
                <th>الملاحظات</th>
              </tr>
            </thead>
            <tbody>
              ${state.sessions.map(s => `
                <tr>
                  <td>${new Date(s.date).toLocaleDateString('ar-SA')}</td>
                  <td>${s.notes}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderIEPView() {
      const iep = buildIEPData();
      return `
        <div class="card no-print">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>الخطة التربوية الفردية (IEP)</h3>
            <div style="display:flex; gap:8px;">
              <button class="btn btn-soft" id="btn-print-iep">🖨️ طباعة</button>
              <button class="btn btn-primary" id="btn-pdf-iep">📄 تنزيل PDF</button>
            </div>
          </div>
        </div>

        <div class="card" id="iep-pdf-content">
          <div style="text-align:center; border-bottom:2px solid var(--mint-deep); padding-bottom:12px; margin-bottom:15px;">
            <h2>برنامج الخطة التربوية الفردية للتخاطب</h2>
            <p style="font-size:14px; color:#666;">مدرسة قتيبة بن مسلم الابتدائية - حفر الباطن</p>
          </div>
          <p><strong>اسم الطالب:</strong> ${iep.studentName}</p>
          <p><strong>تاريخ التقييم:</strong> ${iep.date}</p>
          
          <h4 style="margin-top:15px; color:var(--mint-deep);">1. ملخص التقييم وتشخيص الحروف:</h4>
          <p><strong>✅ الحروف المتقنة:</strong> ${iep.passed.join('، ') || 'لا يوجد'}</p>
          <p><strong>⚠️ بحاجة إلى تدريب:</strong> ${iep.need.join('، ') || 'لا يوجد'}</p>
          <p><strong>❌ غير واضحة:</strong> ${iep.unclear.join('، ') || 'لا يوجد'}</p>

          <h4 style="margin-top:15px; color:var(--mint-deep);">2. الهدف العام طويل المدى:</h4>
          <p>${iep.goalsLong}</p>

          <h4 style="margin-top:15px; color:var(--mint-deep);">3. الأهداف قصيرة المدى:</h4>
          <ul>
            ${iep.goalsShort.map(g => `<li style="margin-right:20px; margin-bottom:5px;">${g}</li>`).join('')}
          </ul>
        </div>
      `;
    }

    // ============================================================
    // دالة الرندر الشاملة (Render Engine)
    // ============================================================
    function render() {
      const appDiv = document.getElementById('app');
      if (!appDiv) return;

      let html = renderTopbar();

      if (state.toastMessage) {
        html += `<div class="toast">${state.toastMessage}</div>`;
      }

      if (!state.user) {
        html += renderAuthView();
      } else {
        if (state.currentView === 'dashboard') html += renderDashboardView();
        else if (state.currentView === 'diag') html += renderDiagnosticView();
        else if (state.currentView === 'sessions') html += renderSessionsView();
        else if (state.currentView === 'iep') html += renderIEPView();
      }

      appDiv.innerHTML = html;
      attachEvents();
    }

    // ============================================================
    // ربط الأحداث المباشرة (Event Listeners)
    // ============================================================
    function attachEvents() {
      // المصادقة والتسجيل
      const toggleAuth = document.getElementById('toggle-auth');
      if (toggleAuth) {
        toggleAuth.onclick = () => {
          state.authMode = state.authMode === 'login' ? 'signup' : 'login';
          render();
        };
      }

      const btnAuthSubmit = document.getElementById('btn-auth-submit');
      if (btnAuthSubmit) {
        btnAuthSubmit.onclick = async () => {
          const email = document.getElementById('auth-email').value;
          const pass = document.getElementById('auth-pass').value;
          if (!email || !pass) return showToast('يرجى كتابة البريد وكلمة المرور');

          try {
            if (state.authMode === 'login') {
              await signInWithEmailAndPassword(auth, email, pass);
              showToast('تم تسجيل الدخول بنجاح');
            } else {
              const res = await createUserWithEmailAndPassword(auth, email, pass);
              const name = document.getElementById('auth-name').value;
              const role = document.getElementById('auth-role').value;
              await setDoc(doc(db, "users", res.user.uid), { fullName: name, role: role });
              showToast('تم إنشاء الحساب');
            }
          } catch (e) {
            showToast('خطأ: ' + e.message);
          }
        };
      }

      const btnLogout = document.getElementById('btn-logout');
      if (btnLogout) btnLogout.onclick = () => signOut(auth);

      // أزرار التنقل
      const navDash = document.getElementById('nav-dash');
      if (navDash) navDash.onclick = () => { state.currentView = 'dashboard'; render(); };
      const navDiag = document.getElementById('nav-diag');
      if (navDiag) navDiag.onclick = () => { state.currentView = 'diag'; render(); };
      const navSess = document.getElementById('nav-sess');
      if (navSess) navSess.onclick = () => { state.currentView = 'sessions'; render(); };
      const navIep = document.getElementById('nav-iep');
      if (navIep) navIep.onclick = () => { state.currentView = 'iep'; render(); };

      // إضافة طالب جديد
      const btnAddStudent = document.getElementById('btn-add-student');
      if (btnAddStudent) {
        btnAddStudent.onclick = async () => {
          const input = document.getElementById('new-student-name');
          if (!input.value.trim()) return showToast('اكتب اسم الطالب أولاً');
          try {
            await addDoc(collection(db, "students"), {
              fullName: input.value.trim(),
              teacherId: state.user.uid,
              createdAt: new Date().toISOString()
            });
            input.value = '';
            showToast('تمت إضافة الطالب بنجاح');
            loadTeacherData();
          } catch (e) {
            showToast('خطأ أثناء الإضافة');
          }
        };
      }

      // اختيار طالب
      document.querySelectorAll('.btn-select-student').forEach(b => {
        b.onclick = async () => {
          const id = b.getAttribute('data-id');
          state.selectedStudent = state.students.find(s => s.id === id);
          state.currentView = 'diag';
          showToast(`تم اختيار الطالب ${state.selectedStudent.fullName}`);
          await loadStudentSessions(id);
          render();
        };
      });

      // تسجيل الصوت وتحديث التقييم
      document.querySelectorAll('.btn-record').forEach(b => {
        b.onclick = () => {
          const letter = b.getAttribute('data-letter');
          recordVoice(letter, letter);
        };
      });

      document.querySelectorAll('.eval-btn').forEach(b => {
        b.onclick = () => {
          const l = b.getAttribute('data-l');
          const st = b.getAttribute('data-st');
          if (!state.diagEval[l]) state.diagEval[l] = {};
          state.diagEval[l].status = st;
          render();
        };
      });

      // حفظ الجلسة
      const btnSaveSession = document.getElementById('btn-save-session');
      if (btnSaveSession) {
        btnSaveSession.onclick = async () => {
          const notes = document.getElementById('session-notes').value;
          if (!notes) return showToast('اكتب ملاحظات الجلسة أولاً');
          try {
            await addDoc(collection(db, "sessions"), {
              studentId: state.selectedStudent.id,
              notes: notes,
              date: new Date().toISOString()
            });
            showToast('تم حفظ الجلسة');
            loadStudentSessions(state.selectedStudent.id);
          } catch(e) {
            showToast('حدث خطأ أثناء الحفظ');
          }
        };
      }

      // الطباعة وتصدير PDF
      const btnPrint = document.getElementById('btn-print-iep');
      if (btnPrint) btnPrint.onclick = () => window.print();

      const btnPdf = document.getElementById('btn-pdf-iep');
      if (btnPdf) {
        btnPdf.onclick = () => {
          const element = document.getElementById('iep-pdf-content');
          const opt = {
            margin:       10,
            filename:     `خطة_${state.selectedStudent?.fullName || 'الطالب'}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
          };
          html2pdf().set(opt).from(element).save();
        };
      }
    }

    // ============================================================
    // المراقبة عند بدء التشغيل (Firebase Auth Observer)
    // ============================================================
    onAuthStateChanged(auth, async (u) => {
      state.user = u;
      if (u) {
        await loadTeacherData();
      } else {
        state.students = [];
        state.selectedStudent = null;
      }
      render();
    });

  </script>
</body>
</html>
