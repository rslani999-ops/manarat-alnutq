<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة منارة النطق - لوحة المعلم والتشخيص</title>
    <style>
        :root {
            --primary: #0d9488;
            --primary-dark: #0f766e;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-radius: 12px;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: var(--border-radius);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-dark);
        }

        .btn-success { background-color: #16a34a; }
        .btn-danger { background-color: #dc2626; }
        .btn-outline { background: transparent; color: var(--primary); border: 2px solid var(--primary); }

        /* شبكة الحروف للتشخيص */
        .letters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }

        .letter-card {
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            background: #fff;
        }

        .letter-card.selected {
            border-color: var(--primary);
            background-color: #f0fdf4;
        }

        .letter-display {
            font-size: 32px;
            font-weight: bold;
            color: var(--primary);
        }

        /* تنسيق خطوات الجلسة */
        .session-box {
            border-right: 4px solid var(--primary);
            padding-right: 15px;
            margin-bottom: 15px;
        }

        .words-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 10px 0;
        }

        .word-card {
            background: #f1f5f9;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            background: #e2e8f0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>منصة منارة النطق - تشخيص وخطة IEP</h2>
        <div id="userInfo"></div>
    </div>

    <!-- منطقة عرض المحتوى الديناميكي -->
    <div id="mainContent"></div>
</div>

<script>
// 1. قاعدة بيانات الحروف والأمثلة الشاملة
const ALPHABET_DATA = {
    "أ": {
        img: "https://via.placeholder.com/150?text=أ",
        audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
        vowels: { fatha: "أَ", damma: "أُ", kasra: "إِ", sukun: "أْ" },
        words: {
            start: ["أسد", "أرنب", "إبرة"],
            middle: ["سأل", "رأس", "فأس"],
            end: ["قرأ", "بدأ", "ملأ"]
        },
        sentences: ["قرأ أحمدُ الكتابَ بانتظام.", "رأسُ الأرنبِ أبيضُ."]
    },
    "ب": {
        img: "https://via.placeholder.com/150?text=ب",
        audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
        vowels: { fatha: "بَ", damma: "بُ", kasra: "بِ", sukun: "بْ" },
        words: {
            start: ["باب", "بيت", "برتقال"],
            middle: ["جبل", "حبل", "خبز"],
            end: ["عنب", "كلب", "ذهب"]
        },
        sentences: ["فتح باسمٌ بابَ البيتِ.", "أكلَ الطفلُ العنبَ اللذيذَ."]
    }
    // ملاحظة: يمكن توسيع باقي الـ 28 حرفاً بنفس هذا النمط
};

// إنشاء قائمة باقي الحروف تلقائياً للتبسيط إذا لم تكن معرفة
const ALL_LETTERS = ["أ","ب","ت","ث","ج","ح","خ","د","ذ","ر","ز","س","ش","ص","ض","ط","ظ","ع","غ","ف","ق","ك","ل","م","ن","هـ","و","ي"];

ALL_LETTERS.forEach(l => {
    if (!ALPHABET_DATA[l]) {
        ALPHABET_DATA[l] = {
            img: `https://via.placeholder.com/150?text=${l}`,
            audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
            vowels: { fatha: `${l}َ`, damma: `${l}ُ`, kasra: `${l}ِ`, sukun: `${l}ْ` },
            words: {
                start: [`${l}ـ كلمة 1`, `${l}ـ كلمة 2`, `${l}ـ كلمة 3`],
                middle: [`كلمة ـ${l}ـ 1`, `كلمة ـ${l}ـ 2`, `كلمة ـ${l}ـ 3`],
                end: [`كلمة ـ${l} 1`, `كلمة ـ${l} 2`, `كلمة ـ${l} 3`]
            },
            sentences: [`جملة تدريبية تشمل حرف (${l}) بشكل واضح.`, `جملة ثانية مفيدة للحرف.`]
        };
    }
});

// حالة التطبيق المؤقتة (Local State)
let currentStudent = {
    id: "std_101",
    name: "عبدالله محمد",
    diagnosticResults: {},
    therapyPlan: []
};

// تشغيل الشاشة الأولى عند التحميل
window.onload = function() {
    renderStudentDashboard();
};

// 2. عرض لوحة المعلم والطالب
function renderStudentDashboard() {
    const content = document.getElementById("mainContent");
    content.innerHTML = `
        <div class="card">
            <h3>لوحة تشخيص الطالب: ${currentStudent.name}</h3>
            <p>اختر الإجراء المطلوب لبدء التشخيص أو متابعة الجلسات الأسبوعية:</p>
            <button class="btn" onclick="startDiagnostic()">بدء التقييم التشخيصي (28 حرف)</button>
            <button class="btn btn-outline" onclick="renderTherapyPlan()">عرض خطة الجلسات الأسبوعية (IEP)</button>
        </div>
    `;
}

// 3. شاشة التقييم التشخيصي (28 حرف)
function startDiagnostic() {
    const content = document.getElementById("mainContent");
    let gridHTML = ALL_LETTERS.map(letter => `
        <div class="letter-card" id="card-${letter}" onclick="evaluateLetter('${letter}')">
            <div class="letter-display">${letter}</div>
            <div style="font-size:11px; margin-top:5px;" id="status-${letter}">غير مشخصص</div>
        </div>
    `).join('');

    content.innerHTML = `
        <div class="card">
            <h3>التشخيص الشامل للحروف (28 حرف)</h3>
            <p>انقر على الحرف لسماع الصوتي وعرض الصورة ثم تحديد حالة النطق لدى الطالب:</p>
            <div class="letters-grid">${gridHTML}</div>
            <br>
            <button class="btn btn-success" onclick="generateTherapyPlan()">حفظ التشخيص وإنشاء الخطة العلاجية</button>
        </div>
        <div id="diagnosticModal"></div>
    `;
}

// 4. فحص واختبار حرف محدد أثناء التشخيص
function evaluateLetter(letter) {
    const data = ALPHABET_DATA[letter];
    const modal = document.getElementById("diagnosticModal");
    
    // تشغيل صوت الحرف تلقائياً
    let audio = new Audio(data.audio);
    audio.play().catch(e => console.log("تنبيه: تشغيل الصوت ينبغي أن يتم بعد تفاعل المستخدم"));

    modal.innerHTML = `
        <div class="card" style="border: 2px solid var(--primary); margin-top:15px;">
            <h4>تقييم حرف: (${letter})</h4>
            <div style="display:flex; gap:20px; align-items:center;">
                <img src="${data.img}" width="100" style="border-radius:8px;">
                <div>
                    <button class="btn btn-outline" onclick="new Audio('${data.audio}').play()">إعادة تشغيل الصوت 🔊</button>
                </div>
            </div>
            <div style="margin-top:15px; display:flex; gap:10px;">
                <button class="btn btn-success" onclick="recordDiagnosticResult('${letter}', 'passed')">نطق سليم</button>
                <button class="btn btn-danger" onclick="recordDiagnosticResult('${letter}', 'needs_practice')">يحتاج تدريب</button>
            </div>
        </div>
    `;
}

// تسجيل حالة الحرف في التشخيص
function recordDiagnosticResult(letter, status) {
    currentStudent.diagnosticResults[letter] = status;
    const statusDiv = document.getElementById(`status-${letter}`);
    const card = document.getElementById(`card-${letter}`);
    
    if (status === 'passed') {
        statusDiv.innerText = "سليم ✓";
        statusDiv.style.color = "green";
        card.style.background = "#f0fdf4";
    } else {
        statusDiv.innerText = "تدريب ✕";
        statusDiv.style.color = "red";
        card.style.background = "#fef2f2";
    }
}

// 5. توليد الخطة العلاجية (جلستان أسبوعياً لكل حرف 4 جلسات)
function generateTherapyPlan() {
    const needsTraining = Object.keys(currentStudent.diagnosticResults).filter(
        l => currentStudent.diagnosticResults[l] === 'needs_practice'
    );

    if (needsTraining.length === 0) {
        alert("لم يتم تحديد أي حروف تحتاج إلى تدريب، أو جميع الحروف سليمة!");
        return;
    }

    let sessions = [];
    let weekCounter = 1;
    let sessionInWeek = 1;

    needsTraining.forEach(letter => {
        // إنشاء 4 جلسات متدرجة لكل حرف
        for (let step = 1; step <= 4; step++) {
            sessions.push({
                id: `sess_${letter}_${step}`,
                letter: letter,
                step: step,
                week: weekCounter,
                sessionNumber: sessionInWeek,
                completed: false,
                passed: null
            });

            // ضمان جلستان فقط في الأسبوع
            sessionInWeek++;
            if (sessionInWeek > 2) {
                sessionInWeek = 1;
                weekCounter++;
            }
        }
    });

    currentStudent.therapyPlan = sessions;
    alert(`تم بناء الخطة العلاجية بنجاح! إجمالي الحروف المستهدفة: ${needsTraining.length} (عدد الجلسات: ${sessions.length})`);
    renderTherapyPlan();
}

// 6. عرض الخطة العلاجية والجلسات الأسبوعية
function renderTherapyPlan() {
    const content = document.getElementById("mainContent");

    if (!currentStudent.therapyPlan || currentStudent.therapyPlan.length === 0) {
        content.innerHTML = `
            <div class="card">
                <h3>لا توجد خطة علاجية نشطة</h3>
                <p>يرجى إجراء التقييم التشخيصي أولاً لتوليد الجلسات.</p>
                <button class="btn" onclick="startDiagnostic()">بدء التقييم التشخيصي</button>
            </div>
        `;
        return;
    }

    let planHTML = currentStudent.therapyPlan.map((sess, idx) => `
        <div class="card session-box">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div>
                    <span class="badge">الأسبوع ${sess.week} - الجلسة ${sess.sessionNumber}</span>
                    <h4>حرف (${sess.letter}) - الجلسة ${sess.step}: ${getStepTitle(sess.step)}</h4>
                </div>
                <div>
                    ${sess.completed ? 
                        `<span style="color:${sess.passed ? 'green':'red'}">${sess.passed ? 'تم اجتياز الحرف ✓' : 'لم يتم الاجتياز ✕'}</span>` : 
                        `<button class="btn" onclick="runSession(${idx})">بدء الجلسة الان</button>`
                    }
                </div>
            </div>
        </div>
    `).join('');

    content.innerHTML = `
        <div class="card">
            <h3>جدول الجلسات الأسبوعية (IEP)</h3>
            <button class="btn btn-outline" onclick="renderStudentDashboard()">عودة للوحة الرئيسية</button>
        </div>
        ${planHTML}
    `;
}

function getStepTitle(step) {
    switch(step) {
        case 1: return "نطق الحرف مجرداً";
        case 2: return "نطق الحرف بالحركات (فتح، ضم، كسر، سكون)";
        case 3: return "أمثلة الكلمات (بداية، وسط، نهاية)";
        case 4: return "الجمل الكاملة والتقييم النهائي";
    }
}

// 7. تنفيذ تشغيل الجلسات الأربع وتطبيق التقييم النهائي
function runSession(index) {
    const sess = currentStudent.therapyPlan[index];
    const data = ALPHABET_DATA[sess.letter];
    const content = document.getElementById("mainContent");

    let stepContent = "";

    // الجلسة 1: مجرد
    if (sess.step === 1) {
        stepContent = `
            <h4>الجلسة الأولى: نطق حرف (${sess.letter}) مجرداً</h4>
            <div style="text-align:center;">
                <div style="font-size:72px; color:var(--primary);">${sess.letter}</div>
                <img src="${data.img}" width="150" style="border-radius:12px;"><br><br>
                <button class="btn" onclick="new Audio('${data.audio}').play()">استمع لصوت الحرف 🔊</button>
            </div>
        `;
    } 
    // الجلسة 2: حركات
    else if (sess.step === 2) {
        stepContent = `
            <h4>الجلسة الثانية: نطق حرف (${sess.letter}) بالحركات</h4>
            <div class="words-grid">
                <div class="word-card"><div style="font-size:32px;">${data.vowels.fatha}</div>الفتحة</div>
                <div class="word-card"><div style="font-size:32px;">${data.vowels.damma}</div>الضمة</div>
                <div class="word-card"><div style="font-size:32px;">${data.vowels.kasra}</div>الكسرة</div>
            </div>
            <div class="word-card" style="margin-top:10px;"><div style="font-size:32px;">${data.vowels.sukun}</div>السكون</div>
        `;
    } 
    // الجلسة 3: كلمات
    else if (sess.step === 3) {
        stepContent = `
            <h4>الجلسة الثالثة: أمثلة الكلمات لحرف (${sess.letter})</h4>
            <h5>أول الكلمة:</h5>
            <div class="words-grid">${data.words.start.map(w => `<div class="word-card">${w}</div>`).join('')}</div>
            <h5>وسط الكلمة:</h5>
            <div class="words-grid">${data.words.middle.map(w => `<div class="word-card">${w}</div>`).join('')}</div>
            <h5>آخر الكلمة:</h5>
            <div class="words-grid">${data.words.end.map(w => `<div class="word-card">${w}</div>`).join('')}</div>
        `;
    } 
    // الجلسة 4: جمل وتقييم نهائي
    else if (sess.step === 4) {
        stepContent = `
            <h4>الجلسة الرابعة: التدريب على الجمل والتقييم النهائي للحرف (${sess.letter})</h4>
            <div style="background:#f8fafc; padding:15px; border-radius:8px; margin-bottom:15px;">
                ${data.sentences.map(s => `<p style="font-size:18px;">• ${s}</p>`).join('')}
            </div>
            
            <div style="border-top:2px solid #e2e8f0; padding-top:15px; text-align:center;">
                <h4>التقييم النهائي للحرف:</h4>
                <p>هل استطاع الطالب نطق الحرف وسياقاته بنجاح؟</p>
                <button class="btn btn-success" onclick="completeSession(${index}, true)">اجتاز الحرف بنجاح</button>
                <button class="btn btn-danger" onclick="completeSession(${index}, false)">لم يجتز الحرف</button>
            </div>
        `;
    }

    content.innerHTML = `
        <div class="card">
            ${stepContent}
            ${sess.step < 4 ? `<br><br><button class="btn btn-success" onclick="completeSession(${index}, true)">إكمال الجلسة والتالي</button>` : ''}
            <button class="btn btn-outline" onclick="renderTherapyPlan()">إلغاء</button>
        </div>
    `;
}

// إنهاء الجلسة وتسجيل النتيجة
function completeSession(index, isPassed) {
    currentStudent.therapyPlan[index].completed = true;
    currentStudent.therapyPlan[index].passed = isPassed;

    if (currentStudent.therapyPlan[index].step === 4) {
        alert(isPassed ? "رائع! تم تقييم الطالب بـ (اجتاز الحرف)." : "تم تسجيل (لم يجتز الحرف) لتعديل الخطة لاحقاً.");
    } else {
        alert("تم إكمال الجلسة بنجاح!");
    }

    renderTherapyPlan();
}
</script>
</body>
</html>
