<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة تقييم النطق</title>
    <style>
        :root {
            --primary-color: #4a6fa5;
            --secondary-color: #169bca;
            --text-color: #333;
            --bg-color: #f4f6f8;
            --white: #ffffff;
            --border-color: #ddd;
        }
        body {
            font-family: 'Cairo', sans-serif, Tahoma, Arial;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            direction: rtl;
            text-align: right;
        }
        header {
            background-color: var(--primary-color);
            color: var(--white);
            padding: 1.5rem;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 2rem auto;
            background: var(--white);
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        input, textarea, select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
        }
        button {
            background-color: var(--secondary-color);
            color: var(--white);
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            font-family: inherit;
            margin-top: 1rem;
        }
        button:hover {
            opacity: 0.9;
        }
        .sessions-list {
            margin-top: 2rem;
        }
        .session-item {
            background: #fafafa;
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>منصة تقييم النطق</h1>
        <p>متابعة الجلسات التدريبية والتقييمات</p>
    </header>

    <div class="container">
        <section id="new-session">
            <h2>تسجيل جلسة تدريبية جديدة</h2>
            <form id="sessionForm">
                <div class="form-group">
                    <label for="studentName">اسم الطالب:</label>
                    <input type="text" id="studentName" required placeholder="أدخل اسم الطالب">
                </div>
                <div class="form-group">
                    <label for="sessionDate">تاريخ الجلسة:</label>
                    <input type="date" id="sessionDate" required>
                </div>
                <div class="form-group">
                    <label for="notes">ملاحظات التقييم:</label>
                    <textarea id="notes" rows="4" required placeholder="أدخل تقييم وملاحظات الجلسة"></textarea>
                </div>
                <button type="submit">حفظ الجلسة</button>
            </form>
        </section>

        <section class="sessions-list">
            <h2>سجلات الجلسات السابقة</h2>
            <div id="sessionsContainer">
                <!-- سيتم إدراج الجلسات المحفوظة هنا ديناميكياً -->
            </div>
        </section>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sessionForm = document.getElementById('sessionForm');
            const sessionsContainer = document.getElementById('sessionsContainer');

            // دالة لعرض الجلسات المخزنة محلياً
            function loadSessions() {
                const sessions = JSON.parse(localStorage.getItem('speechSessions')) || [];
                sessionsContainer.innerHTML = '';

                if (sessions.length === 0) {
                    sessionsContainer.innerHTML = '<p>لا توجد جلسات مسجلة حتى الآن.</p>';
                    return;
                }

                sessions.forEach((session, index) => {
                    const div = document.createElement('div');
                    div.className = 'session-item';
                    div.innerHTML = `
                        <strong>الطالب:</strong> ${session.studentName} <br>
                        <strong>التاريخ:</strong> ${session.sessionDate} <br>
                        <strong>الملاحظات:</strong> ${session.notes}
                    `;
                    sessionsContainer.appendChild(div);
                });
            }

            // حفظ جلسة جديدة في التخزين المحلي
            sessionForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const studentName = document.getElementById('studentName').value;
                const sessionDate = document.getElementById('sessionDate').value;
                const notes = document.getElementById('notes').value;

                const newSession = { studentName, sessionDate, notes };
                const sessions = JSON.parse(localStorage.getItem('speechSessions')) || [];
                
                sessions.push(newSession);
                localStorage.setItem('speechSessions', JSON.stringify(sessions));

                sessionForm.reset();
                loadSessions();
            });

            // تحميل الجلسات عند فتح الصفحة
            loadSessions();
        });
    </script>
</body>
</html>
