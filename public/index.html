<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة تقييم النطق</title>
    <!-- استدعاء مكتبات Firebase (الإصدار الأساسي للويب) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --primary-color: #4a6fa5;
            --secondary-color: #169bca;
            --text-color: #333;
            --bg-color: #f4f6f8;
            --white: #ffffff;
            --border-color: #ddd;
        }
        body {
            font-family: 'Cairo', sans-serif, Tahoma, Arial;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            direction: rtl;
            text-align: right;
        }
        header {
            background-color: var(--primary-color);
            color: var(--white);
            padding: 1.5rem;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 2rem auto;
            background: var(--white);
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        input, textarea, select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
        }
        button {
            background-color: var(--secondary-color);
            color: var(--white);
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            font-family: inherit;
            margin-top: 1rem;
        }
        button:hover {
            opacity: 0.9;
        }
        .sessions-list {
            margin-top: 2rem;
        }
        .session-item {
            background: #fafafa;
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>منصة تقييم النطق</h1>
        <p>متابعة الجلسات التدريبية والتقييمات السحابية</p>
    </header>

    <div class="container">
        <section id="new-session">
            <h2>تسجيل جلسة تدريبية جديدة</h2>
            <form id="sessionForm">
                <div class="form-group">
                    <label for="studentName">اسم الطالب:</label>
                    <input type="text" id="studentName" required placeholder="أدخل اسم الطالب">
                </div>
                <div class="form-group">
                    <label for="sessionDate">تاريخ الجلسة:</label>
                    <input type="date" id="sessionDate" required>
                </div>
                <div class="form-group">
                    <label for="notes">ملاحظات التقييم:</label>
                    <textarea id="notes" rows="4" required placeholder="أدخل تقييم وملاحظات الجلسة"></textarea>
                </div>
                <button type="submit">حفظ الجلسة في السحابة</button>
            </form>
        </section>

        <section class="sessions-list">
            <h2>سجلات الجلسات السحابية</h2>
            <div id="sessionsContainer">
                <p>جاري تحميل البيانات...</p>
            </div>
        </section>
    </div>

    <script>
        // إعدادات مشروع Firebase الخاص بك
        const firebaseConfig = {
            apiKey: "AIzaSyDTst5UKgNJ6ThVOAVHOG3JoWfEvUp1asw",
            authDomain: "manarat-alnutq.firebaseapp.com",
            databaseURL: "https://manarat-alnutq-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "manarat-alnutq",
            storageBucket: "manarat-alnutq.firebasestorage.app",
            messagingSenderId: "543101731444",
            appId: "1:543101731444:web:35a8daf145603c66978721",
            measurementId: "G-ZFKWLDT384"
        };

        // تهيئة Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        document.addEventListener('DOMContentLoaded', () => {
            const sessionForm = document.getElementById('sessionForm');
            const sessionsContainer = document.getElementById('sessionsContainer');

            // جلب وعرض الجلسات من Firestore السحابي مباشرة
            function loadSessions() {
                db.collection("sessions").orderBy("sessionDate", "desc").get()
                    .then((querySnapshot) => {
                        sessionsContainer.innerHTML = '';
                        if (querySnapshot.empty) {
                            sessionsContainer.innerHTML = '<p>لا توجد جلسات مسجلة حتى الآن.</p>';
                            return;
                        }

                        querySnapshot.forEach((doc) => {
                            const session = doc.data();
                            const div = document.createElement('div');
                            div.className = 'session-item';
                            div.innerHTML = `
                                <strong>الطالب:</strong> ${session.studentName} <br>
                                <strong>التاريخ:</strong> ${session.sessionDate} <br>
                                <strong>الملاحظات:</strong> ${session.notes}
                            `;
                            sessionsContainer.appendChild(div);
                        });
                    })
                    .catch((error) => {
                        console.error("خطأ في جلب البيانات: ", error);
                        sessionsContainer.innerHTML = '<p>حدث خطأ أثناء تحميل البيانات من السحابة.</p>';
                    });
            }

            // حفظ جلسة جديدة مباشرة إلى قاعدة بيانات Firebase Firestore السحابية
            sessionForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const studentName = document.getElementById('studentName').value;
                const sessionDate = document.getElementById('sessionDate').value;
                const notes = document.getElementById('notes').value;

                db.collection("sessions").add({
                    studentName: studentName,
                    sessionDate: sessionDate,
                    notes: notes,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                })
                .then(() => {
                    sessionForm.reset();
                    loadSessions();
                })
                .catch((error) => {
                    console.error("خطأ في حفظ البيانات: ", error);
                    alert("فشل حفظ الجلسة، تحقق من الاتصال أو إعدادات القواعد.");
                });
            });

            // تحميل الجلسات عند فتح الصفحة
            loadSessions();
        });
    </script>
</body>
</html>
