<style>
  :root{
    --ink:#1E2A47;
    --paper:#EFF5FB;
    --mint:#4FB6A8;
    --mint-deep:#357E74;
    --sun:#F4B740;
    --coral:#EF6F5B;
    --lilac:#9C82C4;
    --white:#FFFFFF;
    --line: rgba(30,42,71,0.10);
    --blue-trained: #0288D1;
    --green-bg: #E8F5E9;
    --green-text: #2E7D32;
    --red-bg: #FFEBEE;
    --red-text: #C62828;
    --gray-bg: #F5F5F5;
    --gray-text: #616161;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100vh;display:flex;flex-direction:column;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Tajawal', sans-serif;
    background-image:
      radial-gradient(circle at 8% 12%, rgba(79,182,168,0.10) 0, transparent 40%),
      radial-gradient(circle at 92% 85%, rgba(239,111,91,0.08) 0, transparent 40%);
  }
  h1,h2,h3,h4,.display{font-family:'Baloo Bhaijaan 2', sans-serif;}
  .num,.data{font-family:'IBM Plex Sans Arabic', sans-serif;}
  #app{max-width:1000px;margin:0 auto;padding:20px 16px 40px;flex:1;width:100%;}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 4px 24px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:10px;cursor:pointer;}
  .brand .mark{
    width:40px;height:40px;border-radius:12px;
    background:linear-gradient(135deg,var(--mint),var(--mint-deep));
    display:flex;align-items:center;justify-content:center;
    font-size:20px;color:white;box-shadow:0 4px 10px rgba(79,182,168,0.35);
  }
  .brand h1{font-size:20px;margin:0;font-weight:700;}
  .brand span{display:block;font-size:11px;color:#6B7A99;font-family:'Tajawal';margin-top:-2px;}
  
  .nav-btns{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .btn-nav{
    border:none;background:white;color:var(--ink);padding:8px 14px;border-radius:10px;
    font-family:'Tajawal';font-weight:700;cursor:pointer;border:1px solid var(--line);
    display:flex;align-items:center;gap:6px;font-size:13px;
  }
  .btn-nav:hover{background:#F5F8FC;}

  .card{background:white;border-radius:18px;border:1px solid var(--line);padding:20px;margin-bottom:16px;}
  .card h3{margin:0 0 12px 0;font-size:17px;}
  .card h4{margin:8px 0 6px 0;font-size:15px;color:var(--mint-deep);}
  .muted{color:#6B7A99;font-size:13px;}
  .flex-wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}

  .btn{
    border:none;border-radius:12px;padding:10px 18px;font-family:'Tajawal';font-weight:700;
    cursor:pointer;font-size:14px;transition:filter .15s, transform .15s;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--mint-deep);color:white;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-soft{background:#EAF6F4;color:var(--mint-deep);}
  .btn-soft:hover{background:#DDF0ED;}
  .btn-success{background:#10B981;color:white;}
  .btn-danger{background:var(--coral);color:white;}
  .btn-info{background:#0288D1;color:white;}
  .btn-block{width:100%;}
  .btn-sm{padding:6px 12px;font-size:12px;border-radius:8px;}

  /* --- بطاقات التشخيص الشامل (النقر) --- */
  .diag-option-group {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 6px;
    margin-bottom: 12px;
  }
  .diag-option {
    padding: 6px 16px;
    border-radius: 30px;
    border: 2px solid #ddd;
    background: #f9f9f9;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s;
    color: #555;
    user-select: none;
    font-family: 'Tajawal', sans-serif;
  }
  .diag-option:hover { transform: scale(1.02); }
  .diag-option.selected-green { background: var(--green-bg); border-color: var(--green-text); color: var(--green-text); }
  .diag-option.selected-red { background: var(--red-bg); border-color: var(--red-text); color: var(--red-text); }
  .diag-option.selected-gray { background: var(--gray-bg); border-color: #aaa; color: var(--gray-text); }
  .diag-option.danger-selected { background: var(--red-bg); border-color: var(--red-text); color: var(--red-text); }

  .diag-section-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    margin-top: 6px;
    margin-bottom: 2px;
    display: block;
  }

  .input-sm {
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    font-family: 'Tajawal', sans-serif;
    font-size: 14px;
    width: 100%;
    max-width: 300px;
    margin-top: 4px;
  }
  .input-sm:focus { outline: none; border-color: var(--mint); }

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:white;padding:12px 22px;border-radius:12px;
    font-family:'Tajawal';font-weight:700;font-size:14px;z-index:100;
    box-shadow:0 10px 24px rgba(0,0,0,0.2);
  }

  .auth-form{max-width:400px;margin:20px auto;background:white;padding:30px;border-radius:20px;border:1px solid var(--line);}
  .auth-form h2{text-align:center;margin-bottom:20px;}
  .auth-toggle{text-align:center;margin-top:15px;font-size:13px;color:#5B6A88;}
  .auth-toggle span{color:var(--mint-deep);cursor:pointer;font-weight:700;text-decoration:underline;}

  .student-row{padding:12px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;}
  .badge{padding:4px 10px; border-radius:6px; font-size:12px; font-weight:bold; display:inline-block; margin:2px;}
  .badge-assigned{background:#E1F5FE; color:#0288D1;}
  .badge-free{background:#E8F5E9; color:#388E3C;}
  .badge-passed{background:#E8F5E9; color:#2E7D32;}
  .badge-trained{background:#E0F2FE; color:#0288D1; border:1px solid #0288D1;}
  .badge-need{background:#FFF8E1; color:#F57F17;}
  .badge-unclear{background:#FFEBEE; color:#C62828;}

  /* تسميات مجموعات الحروف */
  .group-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--mint-deep);
    margin: 20px 0 10px 0;
    padding: 8px 16px;
    background: #EAF6F4;
    border-radius: 30px;
    display: inline-block;
    border-right: 4px solid var(--mint-deep);
  }
  .diag-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-top:15px; }
  .letter-card { background:#F8FAFC; border:1px solid var(--line); border-radius:14px; padding:12px; text-align:center; }
  .letter-card .letter-circle {
    width:64px; height:64px; border-radius:50%; 
    background: linear-gradient(135deg, #4FB6A8, #357E74); 
    display: flex; align-items: center; justify-content: center; 
    margin: 0 auto 4px auto;
    font-size: 30px; font-weight: bold; color: white;
    box-shadow: 0 4px 10px rgba(79,182,168,0.3);
    border: 2px solid white;
  }
  .letter-title { font-size: 13px; font-weight: bold; color: var(--mint-deep); margin-bottom: 4px; display: block; }
  .audio-btn { background:var(--mint); color:white; border:none; border-radius:50%; width:32px; height:32px; cursor:pointer; margin-bottom:6px; font-size:14px; }
  
  .eval-btns { display:flex; gap:4px; justify-content:center; margin-top:6px; flex-wrap:wrap; }
  .eval-btn { font-size:10px; padding:4px 8px; border-radius:6px; border:none; cursor:pointer; font-weight:bold; }
  .eval-btn.passed { background:#E8F5E9; color:#2E7D32; }
  .eval-btn.trained { background:#E0F2FE; color:#0288D1; }
  .eval-btn.need { background:#FFF8E1; color:#F57F17; }
  .eval-btn.unclear { background:#FFEBEE; color:#C62828; }
  .eval-btn.active { outline:2px solid var(--ink); box-shadow:0 0 4px rgba(0,0,0,0.3); }

  .session-card { background:#FAFDFC; border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px; }
  .vowel-box { background:#F4F9F8; padding:10px; border-radius:8px; text-align:center; font-size:18px; font-weight:bold; cursor:pointer; border: 1px solid var(--line); }
  .session-type-badge { 
    display:inline-block; padding:2px 12px; border-radius:20px; font-size:11px; font-weight:bold; 
    background:#E3F2FD; color:#0D47A1; margin-right:6px;
  }
  .session-type-badge.type1 { background:#E8F5E9; color:#1B5E20; }
  .session-type-badge.type2 { background:#FFF3E0; color:#E65100; }
  .session-type-badge.type3 { background:#FCE4EC; color:#880E4F; }
  .session-type-badge.type4 { background:#E8EAF6; color:#283593; }

  footer {
    background: white;
    border-top: 1px solid var(--line);
    text-align: center;
    padding: 16px;
    font-size: 13px;
    color: #6B7A99;
    margin-top: auto;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 20px;
  }
  footer a { color: var(--mint-deep); text-decoration: none; font-weight: 700; }
  footer a:hover { text-decoration: underline; }

  #iep-print-area { display: none; }

  @media print {
    body { background: white; color: black; }
    .topbar, .btn, .nav-btns, footer, #iep-print-area { display: none !important; }
    #app { max-width: 100%; padding: 0; }
    .card { border: 1px solid #ccc; box-shadow: none; margin-bottom: 10px; }
    #iep-print-area {
      display: block !important;
      position: absolute;
      top: 0;
      right: 0;
      width: 100%;
      background: white;
      padding: 20px;
    }
  }
</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDTst5UKgNJ6ThVOAVHOG3JoWfEvUp1asw",
  authDomain: "manarat-alnutq.firebaseapp.com",

  messagingSenderId: "543101731444",
  appId: "1:543101731444:web:35a8daf145603c66978721",
  measurementId: "G-ZFKWLDT384"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// ========== البيانات الأساسية ==========
const LETTER_GROUPS = [
  { name: 'حروف شفوية', letters: ['ب','م','و','ف'] },
  { name: 'حروف أسنانية لثوية', letters: ['ت','ث','د','ذ','ر','ز','س','ش','ص','ض','ط','ظ','ل','ن'] },
  { name: 'حروف لهوية', letters: ['ج','ك','ق','ي'] },
  { name: 'حروف حلقية', letters: ['أ','هـ','ع','ح','خ','غ'] }
];
const ALL_LETTERS = LETTER_GROUPS.flatMap(g => g.letters);

const FOOD_ITEMS = ['تفاحة','موزة','برتقالة','عنب','تمر','خبز','حليب','ماء'];

const alphabetData = [
  { letter: 'أ', title: 'أسد' }, { letter: 'ب', title: 'بطة' }, { letter: 'ت', title: 'تاج' }, { letter: 'ث', title: 'ثوب' },
  { letter: 'ج', title: 'جمل' }, { letter: 'ح', title: 'حصان' }, { letter: 'خ', title: 'خروف' }, { letter: 'د', title: 'دجاجة' },
  { letter: 'ذ', title: 'ذيل' }, { letter: 'ر', title: 'رمان' }, { letter: 'ز', title: 'زرافة' }, { letter: 'س', title: 'سمكة' },
  { letter: 'ش', title: 'شمس' }, { letter: 'ص', title: 'صقر' }, { letter: 'ض', title: 'ضفدع' }, { letter: 'ط', title: 'طائرة' },
  { letter: 'ظ', title: 'ظرف' }, { letter: 'ع', title: 'عصفور' }, { letter: 'غ', title: 'غزالة' }, { letter: 'ف', title: 'فيل' },
  { letter: 'ق', title: 'قطة' }, { letter: 'ك', title: 'كتاب' }, { letter: 'ل', title: 'ليمون' }, { letter: 'م', title: 'موز' },
  { letter: 'ن', title: 'نحلة' }, { letter: 'هـ', title: 'هاتف' }, { letter: 'و', title: 'وردة' }, { letter: 'ي', title: 'يد' }
];
const letterTitleMap = {};
alphabetData.forEach(item => { letterTitleMap[item.letter] = item.title; });

let iepPrintArea = null;

function speakText(text) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'ar-SA';
    utterance.rate = 0.8;
    window.speechSynthesis.speak(utterance);
  }
}
window.speakText = speakText;

// ========== قاعدة بيانات الحروف ==========
const LETTER_DATABASE = {
  'ر': {
    place: 'طرف اللسان مع اللثة العليا',
    vowels: { fatha: 'رَ', damma: 'رُ', kasra: 'رِ', sukoon: 'رْ' },
    words: { 
      start: ['رَسَمَ','رَجُل','رِمَال'], 
      middle: ['شَجَرَة','مَرْكَب','جَرَس'], 
      end: ['قَمَر','بَحْر','مَطَر'] 
    },
    sentences: ['رَسَمَ رَامِي رُمَّاناً.', 'يَسِيرُ المَرْكَبُ فِي البَحْرِ.', 'قَرَأَ طَارِقٌ عَنِ القَمَرِ.']
  },
  'ب': {
    place: 'انطباق الشفتين',
    vowels: { fatha: 'بَ', damma: 'بُ', kasra: 'بِ', sukoon: 'بْ' },
    words: { 
      start: ['بَاب','بَيْت','بَقَرَة'], 
      middle: ['جَبَل','حَبْل','مَكْتَب'], 
      end: ['عِنَب','كَلْب','حَلِيب'] 
    },
    sentences: ['بَنَى بَاسِمٌ بَيْتاً.', 'أَكَلَ بَدْرٌ العِنَبَ.', 'الكَلْبُ عِنْدَ البَابِ.']
  }
};

// ========== أنواع الجلسات الأربع ==========
const SESSION_TYPES = [
  { id: 1, name: 'الجلسة الأولى: تدريب الحرف مجرداً', icon: '🔊' },
  { id: 2, name: 'الجلسة الثانية: تدريب الحرف مع الحركات', icon: '📖' },
  { id: 3, name: 'الجلسة الثالثة: تدريب الحرف في كلمات', icon: '📝' },
  { id: 4, name: 'الجلسة الرابعة: تدريب الحرف في جمل', icon: '✍️' }
];

function getDefaultGoal(letter, type){
  const names = {
    1: `نطق حرف (${letter}) بشكل مجرد`,
    2: `نطق حرف (${letter}) مع الحركات (فتحة، ضمة، كسرة، سكون)`,
    3: `نطق حرف (${letter}) في مواقع مختلفة من الكلمة`,
    4: `نطق حرف (${letter}) في جمل بسيطة`
  };
  return names[type] || `تدريب حرف (${letter})`;
}

// ========== الحالة العامة ==========
let state = {
  view:'home', user:null, role:null, myStudents:[], freeStudents:[], 
  currentStudent:null, diagEval:{}, selectedLetter:null, currentSession:null,
  sessions:[], iepData:null,
  comprehensive: {
    hearing: 'normal', hearingAid: 'none', vision: 'normal', movement: 'none',
    attention: 'stable', comprehension: 'normal', physical: 'normal',
    psychological: 'stable', scans: 'none', surgeries: 'none',
    scanDetails: '', surgeryDetails: ''
  }
};

let toastTimer = null;
function showToast(msg){
  const t=document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.remove(), 2500);
}

onAuthStateChanged(auth, async (u) => {
  if (u) {
    state.user = u;
    await fetchUserData(u.uid);
  } else {
    state.user = null; state.role = null;
    if (state.view !== 'auth' && state.view !== 'register' && state.view !== 'reset-password') {
      state.view = 'home';
      render();
    }
  }
});

// ========== شريط الأعلى ==========
function renderTopbar(appContainer, title, sub, onBack){
  const bar = document.createElement('div');
  bar.className='topbar';
  let userStatus = state.user ? `<span style="font-size:12px; color:var(--mint-deep);">(${state.role === 'teacher' ? 'معلم' : state.role === 'admin' ? 'مدير' : 'طالب'})</span>` : '';

  bar.innerHTML = `
    <div class="brand" id="brandHome">
      <div class="mark">🎙️</div>
      <div><h1>${title || 'منارة النطق'} ${userStatus}</h1><span>${sub || 'المنصة التدريبية المباشرة'}</span></div>
    </div>
    <div class="nav-btns" id="navActions"></div>
  `;

  bar.querySelector('#brandHome').onclick = () => { state.view = 'home'; render(); };
  const actions = bar.querySelector('#navActions');

  if(onBack){
    const btnBack = document.createElement('button');
    btnBack.className = 'btn-nav';
    btnBack.innerHTML = 'رجوع ←';
    btnBack.onclick = onBack;
    actions.appendChild(btnBack);
  }

  if(state.user){
    const btnDashboard = document.createElement('button');
    btnDashboard.className = 'btn-nav';
    btnDashboard.textContent = state.role === 'teacher' || state.role === 'admin' ? 'لوحتي' : 'صفحتي الجلسات';
    btnDashboard.onclick = () => { state.view = state.role === 'teacher' || state.role === 'admin' ? 'teacher-dashboard' : 'student-menu'; render(); };
    actions.appendChild(btnDashboard);

    if (state.role === 'admin') {
      const btnAdmin = document.createElement('button');
      btnAdmin.className = 'btn-nav';
      btnAdmin.textContent = 'لوحة المدير';
      btnAdmin.onclick = () => { window.location.href = 'admin.html'; };
      actions.appendChild(btnAdmin);
    }

    const btnLogout = document.createElement('button');
    btnLogout.className = 'btn-nav';
    btnLogout.style.color = 'var(--coral)';
    btnLogout.textContent = 'خروج';
    btnLogout.onclick = async () => {
      try {
        if (iepPrintArea) { iepPrintArea.remove(); iepPrintArea = null; }
        await signOut(auth);
        state.user = null; state.role = null; state.currentStudent = null; state.myStudents = []; state.freeStudents = [];
        state.view = 'home';
        showToast('تم تسجيل الخروج بنجاح');
        render();
      } catch(e) { showToast('خطأ أثناء خروج الحساب'); }
    };
    actions.appendChild(btnLogout);
  }

  appContainer.appendChild(bar);
}

// ========== دوال العرض الأساسية ==========
function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  if(state.view === 'home') return renderHome(app);
  if(state.view === 'auth') return renderAuth(app);
  if(state.view === 'register') return renderRegister(app);
  if(state.view === 'reset-password') return renderResetPassword(app);
  if(state.view === 'teacher-dashboard') return renderTeacherDashboard(app);
  if(state.view === 'diagnostic-session') return renderDiagnosticSession(app);
  if(state.view === 'student-profile') return renderStudentProfile(app);
  if(state.view === 'letter-training') return renderLetterTraining(app);
  if (state.view === 'letter-display') return renderLetterDisplay(app);
  if(state.view === 'student-menu') return renderStudentMenu(app);
  if(state.view === 'speech-sessions') return renderSpeechSessions(app);
  if(state.view === 'single-session') return renderSingleSession(app);
  if(state.view === 'iep-session') return renderIEPSession(app);
  if(state.view === 'food-menu') return renderFoodMenu(app);
}

// ========== الصفحة الرئيسية ==========
function renderHome(app){
  renderTopbar(app, 'منارة النطق', 'المنصة التدريبية المباشرة');
  const banner = document.createElement('div');
  banner.className = 'card';
  banner.style.background = 'linear-gradient(135deg, #357E74, #4FB6A8)';

  card.className = 'auth-form';

async function fetchUserData(uid){
  try {
    const uDoc = await getDoc(doc(db, "users", uid));
    if(uDoc.exists()){
      const uData = uDoc.data();
      state.role = uData.role;
      if(uData.comprehensive) state.comprehensive = uData.comprehensive;
      if (state.role === 'teacher' || state.role === 'admin') {
        state.view = 'teacher-dashboard';
        await fetchTeacherStudents();
      } else {
        state.currentStudent = { id: uid, ...uData };
        state.view = 'student-menu';
        render();
      }
    }
  } catch(e) { showToast('خطأ في جلب بيانات المستخدم'); }
}

async function fetchTeacherStudents(){
  if(!state.user) return;
  try {
    const qStudents = query(collection(db, "users"), where("role", "==", "student"));
    const snap = await getDocs(qStudents);
    state.myStudents = []; state.freeStudents = [];
    snap.forEach(d => {
      const data = d.data();
      const studentObj = { id: d.id, ...data };
      if (data.teacherId === state.user.uid) state.myStudents.push(studentObj);
      else if (!data.teacherId) state.freeStudents.push(studentObj);
    });
    render();
  } catch(e) { showToast('خطأ في تحميل بيانات الطلاب'); }
}

    state.view = 'speech-sessions'; render(); 
  };
  actCard.querySelector('#btnIEP').onclick = () => { 
    if(!state.currentStudent && state.myStudents.length > 0) state.currentStudent = state.myStudents[0];
    state.view = 'iep-session'; render(); 
  };

  const myCard = document.createElement('div');
  myCard.className = 'card';
  myCard.innerHTML = '<h3>قائمة طلابك المضافين</h3>';
  if(state.myStudents.length === 0){
    myCard.innerHTML += '<p class="muted">لا يوجد طلاب مضافون حالياً لقائمتك الخاصة.</p>';
  } else {
    state.myStudents.forEach(st => {
      const row = document.createElement('div');
      row.className = 'student-row';
      row.innerHTML = `
        <div>
          <strong>${st.fullName || st.email}</strong> <span style="font-size:12px; color:#6B7A99;">(${st.email})</span>

        </div>
        <div style="display:flex; gap:6px; flex-wrap:wrap;">
          <button class="btn btn-primary btn-sm" id="diag_${st.id}">التشخيص (28 حرف)</button>
          <button class="btn btn-soft btn-sm" id="prof_${st.id}">الجلسات والخطة IEP</button>
          <button class="btn btn-danger btn-sm" id="rem_${st.id}">إزالة</button>
        </div>
      `;
      myCard.appendChild(row);
      setTimeout(() => {
        const btnD = document.getElementById(`diag_${st.id}`);
        if(btnD) btnD.onclick = () => {
          state.currentStudent = st;
          state.diagEval = st.diagnostic || {};
          if(st.comprehensive) state.comprehensive = st.comprehensive;
          state.view = 'diagnostic-session'; render();
        };
        const btnP = document.getElementById(`prof_${st.id}`);
        if(btnP) btnP.onclick = () => { state.currentStudent = st; state.view = 'speech-sessions'; render(); };
        const btnR = document.getElementById(`rem_${st.id}`);
        if(btnR) btnR.onclick = () => window.removeStudent(st.id);
      }, 0);
    });
  }
  app.appendChild(myCard);

  const freeCard = document.createElement('div');
  freeCard.className = 'card';
  freeCard.innerHTML = '<h3>الطلاب المتاحون للإضافة (بدون معلم)</h3>';
  if(state.freeStudents.length === 0){
    freeCard.innerHTML += '<p class="muted">لا يوجد طلاب مستجدون في الانتظار حالياً.</p>';
  } else {
    state.freeStudents.forEach(st => {
      const row = document.createElement('div');
      row.className = 'student-row';
      row.innerHTML = `
        <div>
          <strong>${st.fullName || st.email}</strong> (${st.email})
          <br><span class="badge badge-free">متاح للإضافة</span>
        </div>
        <button class="btn btn-success btn-sm" id="claim_${st.id}">إضافة لقائمتي</button>
      `;
      freeCard.appendChild(row);
      setTimeout(() => {
        const btnC = document.getElementById(`claim_${st.id}`);
        if(btnC) btnC.onclick = () => window.claimStudent(st.id);
      }, 0);
    });
  }
  app.appendChild(freeCard);
}

window.claimStudent = async function(studentId){
  try {
    const ref = doc(db, "users", studentId);
    const snap = await getDoc(ref);
    const data = snap.data();
    if(snap.exists() && data.teacherId && data.teacherId !== state.user.uid){
      showToast('عذراً! هذا الطالب مرتبط بمعلم آخر بالفعل');
      await fetchTeacherStudents(); return;
    }
    await updateDoc(ref, { teacherId: state.user.uid });
    showToast('تمت إضافة الطالب بنجاح');
    await fetchTeacherStudents();
  } catch(e) { showToast('فشل في إضافة الطالب'); }
};

window.removeStudent = async function(studentId){
  try {
    await updateDoc(doc(db, "users", studentId), { teacherId: null });
    showToast('تم إزالة الطالب من قائمتك');
    await fetchTeacherStudents();
  } catch(e) { showToast('فشل في إزالة الطالب'); }
};

        <button class="btn btn-success btn-sm" id="saveAllDiag">💾 حفظ التشخيص الكامل</button>
      </div>
    </div>
  `;
  app.appendChild(letterCard);

  letterCard.querySelector('#resetDiag').onclick = async () => {
    if (confirm('هل أنت متأكد؟ سيتم مسح تشخيص الحروف فقط (يبقى التشخيص الشامل).')) {
      state.diagEval = {};
      try {
        await updateDoc(doc(db, "users", state.currentStudent.id), { diagnostic: {} });
        showToast('تم مسح تشخيص الحروف');
        renderDiagnosticSession(app);
      } catch(e) { showToast('خطأ في المسح'); }
    }
  };

  letterCard.querySelector('#saveAllDiag').onclick = async () => {
    try {
      const ref = doc(db, "users", state.currentStudent.id);
      await updateDoc(ref, {
        diagnostic: state.diagEval,
        comprehensive: state.comprehensive
      });
      showToast('تم حفظ التشخيص الكامل بنجاح');
    } catch(e) { showToast('خطأ في الحفظ'); console.error(e); }
  };

  // ===== حاوية الحروف (نستخدم معرفاً ثابتاً لتحديثها بدلاً من إعادة إنشائها) =====
  let container = document.getElementById('lettersContainer');
  if (!container) {
    container = document.createElement('div');
    container.style.marginTop = '15px';
    container.id = 'lettersContainer';
    app.appendChild(container);
  } else {
    container.innerHTML = ''; // إفراغ المحتوى القديم
  }

  LETTER_GROUPS.forEach(group => {
    const title = document.createElement('div');
    title.className = 'group-title';
    title.textContent = group.name;
    container.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'diag-grid';

    group.letters.forEach(letter => {
      const status = state.diagEval[letter] || 'none';
      const titleStr = letterTitleMap[letter] || '';
      const card = document.createElement('div');
      card.className = 'letter-card';

      card.innerHTML = `
        <div class="letter-circle" onclick="speakText('${letter}')">${letter}</div>
        <span class="letter-title">${titleStr}</span>
        <button class="audio-btn" onclick="speakText('${letter}')">🔊</button>
        <div class="eval-btns">
          <button class="eval-btn passed ${status==='passed'?'active':''}" data-letter="${letter}" data-value="passed">أتقن</button>
          <button class="eval-btn trained ${status==='trained'?'active':''}" data-letter="${letter}" data-value="trained">اجتاز بعد تدريب</button>
          <button class="eval-btn need ${status==='need'?'active':''}" data-letter="${letter}" data-value="need">تدريب</button>
          <button class="eval-btn unclear ${status==='unclear'?'active':''}" data-letter="${letter}" data-value="unclear">غير واضح</button>
        </div>
      `;
      grid.appendChild(card);

      // ربط الأحداث بشكل مباشر دون استدعاء renderDiagnosticSession بأكمله
      const btns = card.querySelectorAll('.eval-btn');
      btns.forEach(btn => {
        btn.onclick = () => {
          const letterVal = btn.dataset.letter;
          const value = btn.dataset.value;
          state.diagEval[letterVal] = value;
          // تحديث واجهة المستخدم دون إعادة إنشاء الصفحة بالكامل
          renderDiagnosticSession(app);
        };
      });
    });

    container.appendChild(grid);
  });
}

    { id: 'hearingGroup', key: 'hearing' },
    { id: 'hearingAidGroup', key: 'hearingAid' },
    { id: 'visionGroup', key: 'vision' },
    { id: 'movementGroup', key: 'movement' },
    { id: 'attentionGroup', key: 'attention' },
    { id: 'comprehensionGroup', key: 'comprehension' },
    { id: 'physicalGroup', key: 'physical' },
    { id: 'psychologicalGroup', key: 'psychological' },
    { id: 'scansGroup', key: 'scans' },
    { id: 'surgeriesGroup', key: 'surgeries' }
  ];

  groups.forEach(g => {
    const container = card.querySelector(`#${g.id}`);
    if(!container) return;
    const options = container.querySelectorAll('.diag-option');
    const currentVal = state.comprehensive[g.key] || 'normal';
    
    options.forEach(opt => {
      const val = opt.dataset.value;
      if(val === currentVal) {
        if(['deaf','blind','abnormal','distracted','difficult','anxious','fearful'].includes(val) || 
           (g.key === 'movement' && val !== 'none') ||
           (g.key === 'scans' && val === 'done') ||
           (g.key === 'surgeries' && val === 'done')) {
          opt.classList.add('selected-red');
        } else if (val === 'none' || val === 'normal' || val === 'stable' || val === 'wearing') {
          opt.classList.add('selected-green');
        } else {
          opt.classList.add('selected-gray');
        }
      }
      
      opt.onclick = () => {
        options.forEach(o => { o.classList.remove('selected-green', 'selected-red', 'selected-gray'); });
        state.comprehensive[g.key] = val;
        if(['deaf','blind','abnormal','distracted','difficult','anxious','fearful'].includes(val) ||
           (g.key === 'movement' && val !== 'none') ||
           (g.key === 'scans' && val === 'done') ||
           (g.key === 'surgeries' && val === 'done')) {
          opt.classList.add('selected-red');
        } else if (val === 'none' || val === 'normal' || val === 'stable' || val === 'wearing') {
          opt.classList.add('selected-green');
        } else {
          opt.classList.add('selected-gray');
        }
        
        if(g.key === 'scans') {
          const detailsContainer = card.querySelector('#scanDetailsContainer');
          if(val === 'done') { detailsContainer.style.display = 'block'; } else { detailsContainer.style.display = 'none'; }
        }
        if(g.key === 'surgeries') {
          const detailsContainer = card.querySelector('#surgeryDetailsContainer');
          if(val === 'done') { detailsContainer.style.display = 'block'; } else { detailsContainer.style.display = 'none'; }
        }
      };
    });
  });

  const scanInput = card.querySelector('#scanDetailsInput');
  if(scanInput) {
    scanInput.oninput = (e) => { state.comprehensive.scanDetails = e.target.value; };
    if(state.comprehensive.scans === 'done') { card.querySelector('#scanDetailsContainer').style.display = 'block'; }
  }
  const surgeryInput = card.querySelector('#surgeryDetailsInput');
  if(surgeryInput) {
    surgeryInput.oninput = (e) => { state.comprehensive.surgeryDetails = e.target.value; };
    if(state.comprehensive.surgeries === 'done') { card.querySelector('#surgeryDetailsContainer').style.display = 'block'; }
  }
}

        if(sess.evaluation === 'trained') evalBadge = `<span class="badge badge-trained">اجتاز بعد التدريب 🔵</span>`;
        if(sess.evaluation === 'need') evalBadge = `<span class="badge badge-need">يحتاج تدريب إضافي ⚠️</span>`;
        if(sess.evaluation === 'unclear') evalBadge = `<span class="badge badge-unclear">النطق غير واضح ❌</span>`;

        sItem.className = 'session-card';
        sItem.style.display = 'flex'; sItem.style.justifyContent = 'space-between'; sItem.style.alignItems = 'center'; sItem.style.flexWrap = 'wrap'; sItem.style.gap = '10px';

async function renderSpeechSessions(app){
  if(!state.currentStudent){
    showToast('اختر طالباً أولاً للوصول للسجل');
    state.view = 'teacher-dashboard'; return render();
  }

  renderTopbar(app, `سجل جلسات: ${state.currentStudent.fullName || state.currentStudent.email}`, 'إضافة وتدريب ورصد التقييم', () => {
    state.view = state.role === 'teacher' || state.role === 'admin' ? 'teacher-dashboard' : 'student-menu'; render();
  });

  // ===== بطاقة إضافة جلسة جديدة =====
  const addCard = document.createElement('div');
  addCard.className = 'card';
  addCard.style.borderRadius = '20px';
  addCard.innerHTML = `
    <h3 style="color:var(--mint-deep);">➕ إضافة جلسة تدريب جديدة</h3>
    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:12px;">
      <div>
        <label style="font-size:13px; font-weight:bold; display:block; margin-bottom:4px;">🔤 اختر الحرف:</label>
        <select id="sessLetter" style="width:100%; padding:10px 14px; border-radius:12px; border:1.5px solid var(--line); font-family:'Tajawal'; font-size:15px;">${ALL_LETTERS.map(l => `<option value="${l}">حرف ${l}</option>`).join('')}</select>
      </div>
      <div>
        <label style="font-size:13px; font-weight:bold; display:block; margin-bottom:4px;">📚 نوع الجلسة:</label>
        <select id="sessType" style="width:100%; padding:10px 14px; border-radius:12px; border:1.5px solid var(--line); font-family:'Tajawal'; font-size:15px;">
          ${SESSION_TYPES.map(t => `<option value="${t.id}">${t.icon} ${t.name}</option>`).join('')}
        </select>
      </div>
      <div>
        <label style="font-size:13px; font-weight:bold; display:block; margin-bottom:4px;">📅 التاريخ:</label>
        <input type="date" id="sessDate" value="${new Date().toISOString().split('T')[0]}" style="width:100%; padding:10px 14px; border-radius:12px; border:1.5px solid var(--line); font-family:'Tajawal'; font-size:15px;">
      </div>
      <div>
        <label style="font-size:13px; font-weight:bold; display:block; margin-bottom:4px;">⏱️ مدّة الجلسة:</label>
        <input type="text" id="sessDuration" value="30 دقيقة" placeholder="مثال: 30 دقيقة" style="width:100%; padding:10px 14px; border-radius:12px; border:1.5px solid var(--line); font-family:'Tajawal'; font-size:15px;">
      </div>
      <div style="grid-column: 1 / -1;">
        <label style="font-size:13px; font-weight:bold; display:block; margin-bottom:4px;">🎯 الهدف التعليمي:</label>
        <input type="text" id="sessGoal" placeholder="مثال: نطق الحرف بالفتحة" style="width:100%; padding:10px 14px; border-radius:12px; border:1.5px solid var(--line); font-family:'Tajawal'; font-size:15px;">
      </div>
    </div>
    <button class="btn btn-primary" id="createSessBtn" style="border-radius:50px; padding:10px 30px; margin-top:12px; font-weight:bold;">🚀 إنشاء الجلسة</button>
  `;
  app.appendChild(addCard);

  // زر إنشاء الجلسة
  addCard.querySelector('#createSessBtn').onclick = async () => {
    if(!state.currentStudent) { showToast('الرجاء اختيار طالب أولاً'); return; }
    if(!state.user) { showToast('يجب تسجيل الدخول أولاً'); return; }

    const letter = document.getElementById('sessLetter').value;
    const sessionType = parseInt(document.getElementById('sessType').value);
    const date = document.getElementById('sessDate').value;
    const duration = document.getElementById('sessDuration').value.trim() || '30 دقيقة';
    const goal = document.getElementById('sessGoal').value.trim() || getDefaultGoal(letter, sessionType);

    if(!letter || !date) {
      showToast('يرجى اختيار حرف وتاريخ الجلسة');
      return;
    }

    try {
      const qCount = query(collection(db, "sessions"), where("studentId", "==", state.currentStudent.id));
      const snapCount = await getDocs(qCount);
      const sessionNumber = snapCount.size + 1;

      const sessionData = {
        studentId: state.currentStudent.id,
        teacherId: state.user.uid,
        letter: letter,
        sessionType: sessionType,
        sessionNumber: sessionNumber,
        date: date,
        duration: duration,
        goal: goal,
        tools: '',
        method: '',
        evaluation: 'none',
        successRate: 0,
        notes: '',
        createdAt: new Date().toISOString()
      };

      await addDoc(collection(db, "sessions"), sessionData);
      showToast(`✅ تمت إضافة الجلسة رقم (${sessionNumber}) بنجاح!`);
      renderSpeechSessions(app);
    } catch(error) {
      console.error('تفاصيل الخطأ:', error);
      let errorMsg = 'فشل في إضافة الجلسة: ';
      if(error.code === 'permission-denied') {
        errorMsg += 'ليس لديك صلاحيات كافية. تأكد من قواعد أمان Firestore.';
      } else {
        errorMsg += error.message || 'خطأ غير معروف.';
      }
      showToast(errorMsg);
    }

  const listCard = document.createElement('div');
  listCard.className = 'card';
  listCard.style.borderRadius = '20px';
  listCard.innerHTML = '<h3 style="color:var(--mint-deep);">📋 الجلسات المسجلة للطالب</h3>';

  try {
    const qS = query(
      collection(db, "sessions"), 
      where("studentId", "==", state.currentStudent.id),

    } else {
      const sessionsByLetter = {};
      snap.forEach(d => {

        sessionsByLetter[sess.letter].push(sess);

        const letterSessions = sessionsByLetter[letter].sort((a,b) => (a.sessionNumber || 0) - (b.sessionNumber || 0));

        letterHeader.textContent = `🔤 حرف (${letter}) - ${letterTitleMap[letter] || ''}`;
        listCard.appendChild(letterHeader);

        letterSessions.forEach(sess => {
          const typeInfo = SESSION_TYPES.find(t => t.id === sess.sessionType) || SESSION_TYPES[0];
          let evalText = 'غير مقيم';

          if(sess.evaluation === 'trained') evalText = '🔄 اجتاز بعد تدريب';
          if(sess.evaluation === 'need') evalText = '⚠️ يحتاج تدريب';
          if(sess.evaluation === 'unclear') evalText = '❌ غير واضح';

          const row = document.createElement('div');
          row.className = 'session-card';
          row.style.borderRadius = '16px';

          row.innerHTML = `
            <div>
              <div>
                <span class="session-type-badge type${sess.sessionType || 1}" style="border-radius:50px; padding:2px 14px;">${typeInfo.icon} ${typeInfo.name}</span>
                <span style="font-weight:bold; margin-right:8px;">#${sess.sessionNumber || '?'}</span>
              </div>

                <span class="muted">📅 ${sess.date}</span>

          setTimeout(() => {

        <button class="btn-eval" data-value="trained" style="background:#E3F2FD; color:#0288D1; border:2px solid #0288D1; border-radius:50px; padding:8px 20px; font-weight:bold; cursor:pointer; font-size:14px; transition:all 0.2s; ${currentEval === 'trained' ? 'box-shadow:0 0 0 3px #0288D1;' : ''}">🔄 اجتاز بعد تدريب</button>
        <button class="btn-eval" data-value="need" style="background:#FFF8E1; color:#F57F17; border:2px solid #F57F17; border-radius:50px; padding:8px 20px; font-weight:bold; cursor:pointer; font-size:14px; transition:all 0.2s; ${currentEval === 'need' ? 'box-shadow:0 0 0 3px #F57F17;' : ''}">⚠️ يحتاج تدريب</button>
        <button class="btn-eval" data-value="unclear" style="background:#FFEBEE; color:#C62828; border:2px solid #C62828; border-radius:50px; padding:8px 20px; font-weight:bold; cursor:pointer; font-size:14px; transition:all 0.2s; ${currentEval === 'unclear' ? 'box-shadow:0 0 0 3px #C62828;' : ''}">❌ لم يجتاز</button>
        
        <div style="display:flex; align-items:center; gap:8px; margin-right:10px; flex-wrap:wrap;">
          <span style="font-size:13px; font-weight:bold; color:#555;">📊 نسبة النجاح:</span>
          <input type="range" id="successRange" min="0" max="100" value="${sess.successRate || 0}" style="width:120px; accent-color:var(--mint-deep);">
          <span id="successValue" style="font-size:16px; font-weight:bold; color:var(--mint-deep); min-width:40px;">${sess.successRate || 0}%</span>
          <button class="btn btn-sm btn-primary" id="saveRateBtn" style="border-radius:50px; padding:4px 14px;">حفظ النسبة</button>
        </div>
      </div>
      <div style="margin-top:10px; display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn btn-success btn-sm" id="saveEvalBtn" style="border-radius:50px; padding:8px 24px; font-weight:bold;">💾 حفظ التقييم الكامل</button>
        <button class="btn btn-soft btn-sm" id="resetEvalBtn" style="border-radius:50px; padding:8px 24px; font-weight:bold;">🔄 إعادة ضبط التقييم</button>
      </div>
    ` : `
      <div style="margin-top:12px; background:#F0F7FF; padding:12px; border-radius:16px; font-size:14px; color:#0288D1;">
        💡 <b>ملاحظة:</b> التقييم متاح للمعلم فقط. يمكنك متابعة تقدم الطالب من خلال جلسات التدريب أدناه.
      </div>
    `}
  `;

  app.appendChild(infoCard);

  // ===== ربط أحداث التقييم =====
  if(state.role === 'teacher' || state.role === 'admin'){
    document.querySelectorAll('.btn-eval').forEach(btn => {
      btn.onclick = async () => {
        const val = btn.dataset.value;
        await updateEval(val);
      };
    });

    const rangeInput = document.getElementById('successRange');
    const valueDisplay = document.getElementById('successValue');
    if(rangeInput && valueDisplay) {
      rangeInput.oninput = () => {
        valueDisplay.textContent = rangeInput.value + '%';
      };
    }

    document.getElementById('saveRateBtn').onclick = async () => {
      const rate = parseInt(document.getElementById('successRange').value);
      try {
        await updateDoc(doc(db, "sessions", sess.id), { successRate: rate });
        sess.successRate = rate;
        showToast(`✅ تم حفظ نسبة النجاح: ${rate}%`);
        renderSingleSession(app);
      } catch(e) {
        showToast('خطأ في حفظ النسبة');
      }
    };

    document.getElementById('saveEvalBtn').onclick = async () => {
      const selectedBtn = document.querySelector('.btn-eval[style*="box-shadow"]');
      const evalValue = selectedBtn ? selectedBtn.dataset.value : 'none';
      const rate = parseInt(document.getElementById('successRange').value);
      
      try {
        await updateDoc(doc(db, "sessions", sess.id), { 
          evaluation: evalValue,
          successRate: rate
        });
        sess.evaluation = evalValue;
        sess.successRate = rate;
        showToast(`✅ تم حفظ التقييم: ${evalLabels[evalValue]} - نسبة النجاح: ${rate}%`);
        renderSingleSession(app);
      } catch(e) {
        showToast('خطأ في حفظ التقييم');
      }
    };

    document.getElementById('resetEvalBtn').onclick = async () => {
      if(confirm('هل أنت متأكد من إعادة ضبط التقييم؟')) {
        try {
          await updateDoc(doc(db, "sessions", sess.id), { 
            evaluation: 'none',
            successRate: 0
          });
          sess.evaluation = 'none';
          sess.successRate = 0;
          showToast('تم إعادة ضبط التقييم');
          renderSingleSession(app);
        } catch(e) {
          showToast('خطأ في إعادة الضبط');
        }
      }
    };
  }

  // ===== محتوى التدريب حسب نوع الجلسة =====
  const trainCard = document.createElement('div');
  trainCard.className = 'card';
  trainCard.style.borderRadius = '24px';
  trainCard.style.border = '2px solid var(--line)';
  trainCard.style.background = 'linear-gradient(135deg, #F8FAFC, #ffffff)';
  
  let contentHTML = '';
  const sessionType = sess.sessionType || 1;

  switch(sessionType) {
    case 1:
      contentHTML = `
        <div style="text-align:center; padding:20px 0;">
          <div style="font-size:80px; font-weight:bold; color:var(--mint-deep); cursor:pointer; padding:20px; background:white; border-radius:30px; box-shadow:0 4px 15px rgba(0,0,0,0.08); display:inline-block;" onclick="speakText('${letter}')">
            ${letter}
          </div>
          <p style="font-size:18px; font-weight:bold; color:#555; margin-top:15px;">🔊 اضغط على الحرف للاستماع</p>
          <button class="btn btn-primary" style="border-radius:50px; padding:12px 30px; font-size:16px; margin-top:10px;" onclick="speakText('${letter}')">🔊 استمع للحرف</button>
          <p style="font-size:14px; color:#6B7A99; margin-top:10px;">تدرب على نطق الحرف بشكل مجرد قبل الانتقال للحركات</p>
        </div>
      `;
      break;

    case 2:
      contentHTML = `
        <h3 style="color:var(--mint-deep);">📖 تدريب الحرف مع الحركات</h3>
        <p style="color:#6B7A99;">تدرب على نطق الحرف مع الحركات المختلفة (الفتحة، الضمة، الكسرة، السكون)</p>
        <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap:15px; margin-top:15px;">
          <div class="vowel-box" onclick="speakText('${letterData.vowels.fatha}')" style="padding:20px; border-radius:20px; background:#E3F2FD; border:2px solid #90CAF9; text-align:center; cursor:pointer; transition:all 0.2s;">
            <div style="font-size:40px; font-weight:bold; color:#0D47A1;">${letterData.vowels.fatha}</div>
            <div style="font-size:14px; font-weight:bold; color:#0D47A1; margin-top:4px;">فتحة</div>
          </div>
          <div class="vowel-box" onclick="speakText('${letterData.vowels.damma}')" style="padding:20px; border-radius:20px; background:#FFF3E0; border:2px solid #FFB74D; text-align:center; cursor:pointer; transition:all 0.2s;">
            <div style="font-size:40px; font-weight:bold; color:#E65100;">${letterData.vowels.damma}</div>
            <div style="font-size:14px; font-weight:bold; color:#E65100; margin-top:4px;">ضمة</div>
          </div>
          <div class="vowel-box" onclick="speakText('${letterData.vowels.kasra}')" style="padding:20px; border-radius:20px; background:#E8F5E9; border:2px solid #81C784; text-align:center; cursor:pointer; transition:all 0.2s;">
            <div style="font-size:40px; font-weight:bold; color:#1B5E20;">${letterData.vowels.kasra}</div>
            <div style="font-size:14px; font-weight:bold; color:#1B5E20; margin-top:4px;">كسرة</div>
          </div>
          <div class="vowel-box" onclick="speakText('${letterData.vowels.sukoon}')" style="padding:20px; border-radius:20px; background:#FCE4EC; border:2px solid #F48FB1; text-align:center; cursor:pointer; transition:all 0.2s;">
            <div style="font-size:40px; font-weight:bold; color:#880E4F;">${letterData.vowels.sukoon}</div>
            <div style="font-size:14px; font-weight:bold; color:#880E4F; margin-top:4px;">سكون</div>
          </div>
        </div>
        <p style="font-size:14px; color:#6B7A99; margin-top:15px;">👆 اضغط على كل حركة للاستماع إلى نطقها</p>
      `;
      break;

    case 3:
      const startWords = letterData.words.start || [`${letter}َـ`];
      const middleWords = letterData.words.middle || [`ـ${letter}ـ`];
      const endWords = letterData.words.end || [`ـ${letter}`];
      
      contentHTML = `
        <h3 style="color:var(--mint-deep);">📝 تدريب الحرف في كلمات</h3>
        <p style="color:#6B7A99;">تدرب على نطق الحرف في بداية الكلمة، وسطها، ونهايتها</p>
        
        <h4 style="margin-top:15px; color:#0D47A1; font-size:16px;">📍 بداية الكلمة</h4>
        <div style="display:flex; flex-wrap:wrap; gap:10px;">
          ${startWords.map(w => `<div class="vowel-box" onclick="speakText('${w}')" style="padding:12px 20px; border-radius:20px; background:#E3F2FD; border:2px solid #90CAF9; cursor:pointer; font-size:18px; font-weight:bold;">🔊 ${w}</div>`).join('')}
        </div>

        <h4 style="margin-top:15px; color:#E65100; font-size:16px;">📍 وسط الكلمة</h4>
        <div style="display:flex; flex-wrap:wrap; gap:10px;">
          ${middleWords.map(w => `<div class="vowel-box" onclick="speakText('${w}')" style="padding:12px 20px; border-radius:20px; background:#FFF3E0; border:2px solid #FFB74D; cursor:pointer; font-size:18px; font-weight:bold;">🔊 ${w}</div>`).join('')}
        </div>

        <h4 style="margin-top:15px; color:#1B5E20; font-size:16px;">📍 نهاية الكلمة</h4>
        <div style="display:flex; flex-wrap:wrap; gap:10px;">
          ${endWords.map(w => `<div class="vowel-box" onclick="speakText('${w}')" style="padding:12px 20px; border-radius:20px; background:#E8F5E9; border:2px solid #81C784; cursor:pointer; font-size:18px; font-weight:bold;">🔊 ${w}</div>`).join('')}
        </div>
        <p style="font-size:14px; color:#6B7A99; margin-top:15px;">👆 اضغط على كل كلمة للاستماع إلى نطقها</p>
      `;
      break;

    case 4:
      const sentences = letterData.sentences || [`جملة تدريبية لحرف ${letter}.`];
      contentHTML = `
        <h3 style="color:var(--mint-deep);">✍️ تدريب الحرف في جمل</h3>
        <p style="color:#6B7A99;">تدرب على نطق الحرف في سياق جمل بسيطة</p>
        <div style="margin-top:15px;">
          ${sentences.map((s, i) => `
            <div class="vowel-box" onclick="speakText('${s}')" style="padding:16px; margin-bottom:10px; border-radius:20px; background:#F3E5F5; border:2px solid #CE93D8; cursor:pointer; text-align:right; font-size:20px; font-weight:bold;">
              ${i+1}. ${s} 🔊
            </div>
          `).join('')}
        </div>
        <p style="font-size:14px; color:#6B7A99; margin-top:15px;">👆 اضغط على كل جملة للاستماع إلى نطقها</p>
      `;
      break;

    default:
      contentHTML = `<p style="color:#6B7A99;">محتوى الجلسة غير محدد.</p>`;
  }

  trainCard.innerHTML = contentHTML;
  app.appendChild(trainCard);

  // ===== دالة مساعدة لتحديث التقييم =====
  async function updateEval(val) {
    try {
      await updateDoc(doc(db, "sessions", sess.id), { evaluation: val });
      const studentDocRef = doc(db, "users", sess.studentId);
      const stSnap = await getDoc(studentDocRef);
      if(stSnap.exists()){
        const diag = stSnap.data().diagnostic || {};
        diag[sess.letter] = val;
        await updateDoc(studentDocRef, { diagnostic: diag });
      }
      sess.evaluation = val;
      showToast(`✅ تم تحديث التقييم: ${evalLabels[val]}`);
      renderSingleSession(app);
    } catch(e) {
      showToast('خطأ أثناء حفظ التقييم');
      console.error(e);
    }
  }
}

async function renderIEPSession(app){
  if(!state.currentStudent){
    showToast('اختر طالباً أولاً للوصول للخطة');
    state.view = state.role === 'teacher' || state.role === 'admin' ? 'teacher-dashboard' : 'student-menu';
    return render();
  }

  renderTopbar(app, `الخطة الفردية (IEP): ${state.currentStudent.fullName || state.currentStudent.email}`, 'تفاصيل الخطة وتصدير PDF', () => {
    state.view = state.role === 'teacher' || state.role === 'admin' ? 'teacher-dashboard' : 'student-menu'; render();
  });

  let iep = {
    diagnosis: 'اضطراب نطق بالحروف (لدغة)',
    longGoal: 'أن ينطق الطالب الحروف المستهدفة بشكل صحيح في الكلمات والجمل.',
    shortGoals: '1. نطق الحرف بشكل مفرد صحيح.\n2. نطق الحرف في بداية الكلمة ووسطها ونهايتها.',
    notes: 'متابعة منزلية يومية لمدة 10 دقائق.'
  };

  try {
    const docRef = doc(db, "iep", state.currentStudent.id);
    const snap = await getDoc(docRef);
    if(snap.exists()) iep = snap.data();
  } catch(e){}

  let studentSessions = [];
  try {
    const qS = query(collection(db, "sessions"), where("studentId", "==", state.currentStudent.id), orderBy("date", "desc"));
    const snap = await getDocs(qS);
    snap.forEach(d => studentSessions.push({ id: d.id, ...d.data() }));
  } catch(e){}

  const formCard = document.createElement('div');
  formCard.className = 'card';
  formCard.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
      <h3>تفاصيل الخطة التربوية الفردية (IEP)</h3>
      <div>
        <button class="btn btn-primary btn-sm" id="btnPrintPDF">🖨️ تصدير وتحميل التقرير PDF</button>
        <button class="btn btn-soft btn-sm" id="btnPrint">🖨️ طباعة</button>
      </div>
    </div>
    <hr style="border:0; border-top:1px solid var(--line); margin:12px 0;">

    <label><b>تشخيص حالة الطالب:</b></label>
    <textarea id="iepDiagnosis" rows="3" style="width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);font-family:'Tajawal';font-size:15px;background:#FBFDFE;margin-bottom:12px;">${iep.diagnosis}</textarea>

    <label><b>الهدف العام:</b></label>
    <input type="text" id="iepLongGoal" value="${iep.longGoal}" style="width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);font-family:'Tajawal';font-size:15px;background:#FBFDFE;margin-bottom:12px;">

    <label><b>الأهداف التعليمية القصيرة:</b></label>
    <textarea id="iepShortGoals" rows="3" style="width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);font-family:'Tajawal';font-size:15px;background:#FBFDFE;margin-bottom:12px;">${iep.shortGoals}</textarea>

    <label><b>توصيات لولي الأمر والمعلم:</b></label>
    <textarea id="iepNotes" rows="2" style="width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);font-family:'Tajawal';font-size:15px;background:#FBFDFE;margin-bottom:12px;">${iep.notes}</textarea>

    ${state.role === 'teacher' || state.role === 'admin' ? '<button class="btn btn-success btn-sm" id="saveIEPBtn">حفظ الخطة الفردية</button>' : ''}
  `;
  app.appendChild(formCard);

  if (iepPrintArea) { iepPrintArea.remove(); iepPrintArea = null; }

  const printArea = document.createElement('div');
  iepPrintArea = printArea;
  printArea.id = 'iep-print-area';
  printArea.style.cssText = 'position:absolute; left:-9999px; top:0; width:100%; background:white; z-index:9999; padding:30px;';
  
  const teacherName = state.user?.displayName || state.user?.email || 'المعلم';
  
  const updatePrintAreaContent = (iepData) => {
    printArea.innerHTML = `
      <div style="text-align:center; margin-bottom:20px;">
        <h1 style="margin:0;">تقرير الخطة الفردية (IEP)</h1>
        <p style="color:#555;">إعداد: ${teacherName}</p>
        <p style="color:#555;">تاريخ التقرير: ${new Date().toLocaleDateString('ar-SA')}</p>
      </div>
      <div style="border:2px solid #357E74; border-radius:12px; padding:20px;">
        <h2 style="border-bottom:2px solid #357E74; padding-bottom:10px;">معلومات الطالب</h2>
        <p><strong>الاسم:</strong> ${state.currentStudent.fullName || state.currentStudent.email}</p>
        <p><strong>البريد الإلكتروني:</strong> ${state.currentStudent.email}</p>
        <hr style="border-top:1px dashed #ccc; margin:15px 0;">
        <h2 style="border-bottom:2px solid #357E74; padding-bottom:10px;">التشخيص والأهداف</h2>
        <p><strong>التشخيص:</strong> ${iepData.diagnosis}</p>
        <p><strong>الهدف العام:</strong> ${iepData.longGoal}</p>
        <p><strong>الأهداف القصيرة:</strong><br>${iepData.shortGoals.replace(/\n/g, '<br>')}</p>
        <p><strong>التوصيات:</strong><br>${iepData.notes.replace(/\n/g, '<br>')}</p>
        <hr style="border-top:1px dashed #ccc; margin:15px 0;">
        <h2 style="border-bottom:2px solid #357E74; padding-bottom:10px;">ملخص الجلسات</h2>
        ${studentSessions.length > 0 ? studentSessions.map(s => {
          const typeInfo = SESSION_TYPES.find(t => t.id === s.sessionType) || SESSION_TYPES[0];
          return `
            <div style="margin-bottom:8px; padding:8px; background:#f9f9f9; border-radius:6px;">
              <strong>${typeInfo.icon} ${typeInfo.name}</strong> - حرف ${s.letter} - تاريخ: ${s.date} - التقييم: ${s.evaluation || 'غير مقيم'} | نسبة النجاح: ${s.successRate || 0}%
            </div>
          `;
        }).join('') : '<p>لا توجد جلسات مسجلة.</p>'}
      </div>
    `;
  };

  updatePrintAreaContent(iep);
  document.body.appendChild(printArea);

  if(state.role === 'teacher' || state.role === 'admin'){
    formCard.querySelector('#saveIEPBtn').onclick = async () => {
      const updated = {
        diagnosis: document.getElementById('iepDiagnosis').value,
        longGoal: document.getElementById('iepLongGoal').value,
        shortGoals: document.getElementById('iepShortGoals').value,
        notes: document.getElementById('iepNotes').value,
        updatedAt: new Date().toISOString()
      };
      try {
        await setDoc(doc(db, "iep", state.currentStudent.id), updated);
        showToast('تم حفظ الخطة الفردية بنجاح');
        updatePrintAreaContent(updated);
      } catch(e) { showToast('خطأ في حفظ الخطة'); }
    };
  }

  formCard.querySelector('#btnPrintPDF').onclick = () => {
    const element = printArea;
    const originalPosition = element.style.position; const originalLeft = element.style.left; const originalTop = element.style.top;
    const originalZIndex = element.style.zIndex; const originalVisibility = element.style.visibility;
    element.style.position = 'fixed'; element.style.left = '0'; element.style.top = '0'; element.style.zIndex = '9999';
    element.style.visibility = 'visible'; element.style.width = '100%';
    const opt = { margin: 10, filename: `IEP_${state.currentStudent.id}.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } };
    html2pdf().set(opt).from(element).save().then(() => {
      element.style.position = originalPosition; element.style.left = originalLeft; element.style.top = originalTop;
      element.style.zIndex = originalZIndex; element.style.visibility = originalVisibility;
    }).catch(() => {
      element.style.position = originalPosition; element.style.left = originalLeft; element.style.top = originalTop;
      element.style.zIndex = originalZIndex; element.style.visibility = originalVisibility;
    });
  };

  formCard.querySelector('#btnPrint').onclick = () => { window.print(); };
}

      <div style="width:80px; height:80px; background:linear-gradient(135deg, #4FB6A8, #357E74); border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:50px; color:white; font-weight:bold; box-shadow:0 4px 10px rgba(79,182,168,0.4); margin-bottom:12px;">
        ${item.letter}
      </div>
      <span style="font-size:22px; font-weight:bold; color:#1E2A47;">${item.title}</span>

}

function renderFoodMenu(app){
  renderTopbar(app, 'قائمة الأطعمة والمسميات', 'تدريبات التسمية والتعزيز', () => {
    state.view = 'home'; render();
  });
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h3>🍎 كروت الأطعمة للتسمية والنطق</h3>
    <p class="muted">اضغط على أي عنصر لسماع النطق الصحيح وتدريب الطالب عليه.</p>
    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap:12px; margin-top:15px;">
      ${FOOD_ITEMS.map(item => `
        <div class="vowel-box" style="padding:20px 10px; display:flex; align-items:center; gap:10px; justify-content:center; border-radius:16px;" onclick="speakText('${item}')">
          <span style="font-size:32px;">🍎</span> ${item}
        </div>
      `).join('')}
    </div>
  `;
  app.appendChild(card);
}

function renderStudentProfile(app){ app.innerHTML = '<div class="card"><h3>الملف الشخصي</h3><p class="muted">قيد التطوير</p></div>'; }

render();
