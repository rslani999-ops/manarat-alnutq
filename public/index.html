<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منارة النطق لتدريبات النطق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- مكتبة html2pdf لتصدير PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
  :root{
    --ink:#1E2A47;
    --paper:#EFF5FB;
    --mint:#4FB6A8;
    --mint-deep:#357E74;
    --sun:#F4B740;
    --coral:#EF6F5B;
    --lilac:#9C82C4;
    --white:#FFFFFF;
    --line: rgba(30,42,71,0.10);
    --blue-trained: #0288D1;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100vh;display:flex;flex-direction:column;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Tajawal', sans-serif;
    background-image:
      radial-gradient(circle at 8% 12%, rgba(79,182,168,0.10) 0, transparent 40%),
      radial-gradient(circle at 92% 85%, rgba(239,111,91,0.08) 0, transparent 40%);
  }
  h1,h2,h3,h4,.display{font-family:'Baloo Bhaijaan 2', sans-serif;}
  .num,.data{font-family:'IBM Plex Sans Arabic', sans-serif;}
  #app{max-width:960px;margin:0 auto;padding:20px 16px 40px;flex:1;width:100%;}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 4px 24px;}
  .brand{display:flex;align-items:center;gap:10px;cursor:pointer;}
  .brand .mark{
    width:40px;height:40px;border-radius:12px;
    background:linear-gradient(135deg,var(--mint),var(--mint-deep));
    display:flex;align-items:center;justify-content:center;
    font-size:20px;color:white;box-shadow:0 4px 10px rgba(79,182,168,0.35);
  }
  .brand h1{font-size:20px;margin:0;font-weight:700;}
  .brand span{display:block;font-size:11px;color:#6B7A99;font-family:'Tajawal';margin-top:-2px;}
  
  .nav-btns{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .btn-nav{
    border:none;background:white;color:var(--ink);padding:8px 14px;border-radius:10px;
    font-family:'Tajawal';font-weight:700;cursor:pointer;border:1px solid var(--line);
    display:flex;align-items:center;gap:6px;font-size:13px;
  }
  .btn-nav:hover{background:#F5F8FC;}

  .card{background:white;border-radius:18px;border:1px solid var(--line);padding:20px;margin-bottom:16px;}
  .card h3{margin:0 0 8px;font-size:17px;}
  .muted{color:#6B7A99;font-size:13px;}

  .btn{
    border:none;border-radius:12px;padding:10px 18px;font-family:'Tajawal';font-weight:700;
    cursor:pointer;font-size:14px;transition:filter .15s, transform .15s;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--mint-deep);color:white;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-soft{background:#EAF6F4;color:var(--mint-deep);}
  .btn-soft:hover{background:#DDF0ED;}
  .btn-success{background:#10B981;color:white;}
  .btn-danger{background:var(--coral);color:white;}
  .btn-info{background:#0288D1;color:white;}
  .btn-block{width:100%;}
  .btn-sm{padding:6px 12px;font-size:12px;border-radius:8px;}

  input[type=text], input[type=password], input[type=email], input[type=number], input[type=date], textarea, select{
    width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);
    font-family:'Tajawal';font-size:15px;background:#FBFDFE;margin-bottom:12px;
  }
  input:focus, textarea:focus, select:focus{outline:none;border-color:var(--mint);}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:white;padding:12px 22px;border-radius:12px;
    font-family:'Tajawal';font-weight:700;font-size:14px;z-index:100;
    box-shadow:0 10px 24px rgba(0,0,0,0.2);
  }

  .auth-form{max-width:400px;margin:20px auto;background:white;padding:30px;border-radius:20px;border:1px solid var(--line);}
  .auth-form h2{text-align:center;margin-bottom:20px;}
  .auth-toggle{text-align:center;margin-top:15px;font-size:13px;color:#5B6A88;}
  .auth-toggle span{color:var(--mint-deep);cursor:pointer;font-weight:700;text-decoration:underline;}

  .student-row{padding:12px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;}
  .badge{padding:4px 10px; border-radius:6px; font-size:12px; font-weight:bold; display:inline-block; margin:2px;}
  .badge-assigned{background:#E1F5FE; color:#0288D1;}
  .badge-free{background:#E8F5E9; color:#388E3C;}
  .badge-passed{background:#E8F5E9; color:#2E7D32;}
  .badge-trained{background:#E0F2FE; color:#0288D1; border:1px solid #0288D1;} /* تمييز الحروف بعد التدريب باللون الأزرق */
  .badge-need{background:#FFF8E1; color:#F57F17;}
  .badge-unclear{background:#FFEBEE; color:#C62828;}

  .diag-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top:15px; }
  .letter-card { background:#F8FAFC; border:1px solid var(--line); border-radius:14px; padding:12px; text-align:center; }
  .letter-display { font-size:32px; font-weight:bold; color:var(--mint-deep); cursor:pointer; }
  .letter-img { width:60px; height:60px; object-fit:contain; margin:6px auto; display:block; background:#fff; border-radius:8px; border:1px solid var(--line); }
  .audio-btn { background:var(--mint); color:white; border:none; border-radius:50%; width:32px; height:32px; cursor:pointer; margin-bottom:8px; }
  
  .eval-btns { display:flex; gap:4px; justify-content:center; margin-top:6px; flex-wrap:wrap; }
  .eval-btn { font-size:11px; padding:6px 8px; border-radius:6px; border:none; cursor:pointer; font-weight:bold; }
  .eval-btn.passed { background:#E8F5E9; color:#2E7D32; }
  .eval-btn.trained { background:#E0F2FE; color:#0288D1; }
  .eval-btn.need { background:#FFF8E1; color:#F57F17; }
  .eval-btn.unclear { background:#FFEBEE; color:#C62828; }
  .eval-btn.active { outline:2px solid var(--ink); box-shadow:0 0 4px rgba(0,0,0,0.3); }

  .session-card { background:#FAFDFC; border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px; }
  .vowel-box { background:#F4F9F8; padding:10px; border-radius:8px; text-align:center; font-size:18px; font-weight:bold; cursor:pointer; border: 1px solid var(--line); }

  /* تذييل محسّن */
  footer {
    background: white;
    border-top: 1px solid var(--line);
    text-align: center;
    padding: 16px;
    font-size: 13px;
    color: #6B7A99;
    margin-top: auto;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 20px;
  }
  footer a {
    color: var(--mint-deep);
    text-decoration: none;
    font-weight: 700;
  }
  footer a:hover { text-decoration: underline; }

  /* منطقة الطباعة والتصدير */
  #iep-print-area {
    display: none; /* مخفي على الشاشة، يظهر عند الطباعة */
  }

  @media print {
    body { background: white; color: black; }
    .topbar, .btn, .nav-btns, footer, #iep-print-area { display: none !important; }
    #app { max-width: 100%; padding: 0; }
    .card { border: 1px solid #ccc; box-shadow: none; margin-bottom: 10px; }
    /* إظهار منطقة التقرير فقط */
    #iep-print-area {
      display: block !important;
      position: absolute;
      top: 0;
      right: 0;
      width: 100%;
      background: white;
      padding: 20px;
    }
  }
</style>
</head>
<body>
<div id="app"></div>

<footer>
  <span>© 2025 منارة النطق - جميع الحقوق محفوظة</span>

</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import { getFirestore, setDoc, doc, getDoc, updateDoc, collection, addDoc, getDocs, query, where, orderBy } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDTst5UKgNJ6ThVOAVHOG3JoWfEvUp1asw",
  authDomain: "manarat-alnutq.firebaseapp.com",
  databaseURL: "https://manarat-alnutq-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "manarat-alnutq",
  storageBucket: "manarat-alnutq.firebasestorage.app",
  messagingSenderId: "543101731444",
  appId: "1:543101731444:web:35a8daf145603c66978721",
  measurementId: "G-ZFKWLDT384"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const ALL_LETTERS = ['أ','ب','ت','ث','ج','ح','خ','د','ذ','ر','ز','س','ش','ص','ض','ط','ظ','ع','غ','ف','ق','ك','ل','م','ن','هـ','و','ي'];
const FOOD_ITEMS = ['تفاحة', 'موزة', 'برتقالة', 'عنب', 'تمر', 'خبز', 'حليب', 'ماء'];

// === تعديل: متغير عام لعنصر الطباعة ===
let iepPrintArea = null;

function speakText(text) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'ar-SA';
    utterance.rate = 0.8;
    window.speechSynthesis.speak(utterance);
  }
}
window.speakText = speakText;

const LETTER_DATABASE = {
  'ر': {
    place: 'طرف اللسان مع اللثة العليا',
    vowels: { fatha: 'رَ', damma: 'رُ', kasra: 'رِ', sukoon: 'رْ' },
    words: { start: ['رَسَمَ', 'رَجُل', 'رِمَال'], middle: ['شَجَرَة', 'مَرْكَب', 'جَرَس'], end: ['قَمَر', 'بَحْر', 'مَطَر'] },
    sentences: ['رَسَمَ رَامِي رُمَّاناً.', 'يَسِيرُ المَرْكَبُ فِي البَحْرِ.', 'قَرَأَ طَارِقٌ عَنِ القَمَرِ.']
  },
  'ب': {
    place: 'انطباق الشفتين',
    vowels: { fatha: 'بَ', damma: 'بُ', kasra: 'بِ', sukoon: 'بْ' },
    words: { start: ['بَاب', 'بَيْت', 'بَقَرَة'], middle: ['جَبَل', 'حَبْل', 'مَكْتَب'], end: ['عِنَب', 'كَلْب', 'حَلِيب'] },
    sentences: ['بَنَى بَاسِمٌ بَيْتاً.', 'أَكَلَ بَدْرٌ العِنَبَ.', 'الكَلْبُ عِنْدَ البَابِ.']
  }
};

let state = {
  view:'home', user:null, role:null, myStudents:[], freeStudents:[], 
  currentStudent:null, diagEval:{}, selectedLetter:null, currentSession:null,
  sessions:[], iepData:null
};

let toastTimer = null;
function showToast(msg){
  const t=document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.remove(), 2500);
}

// مراقبة حالة التسجيل تلقائياً
onAuthStateChanged(auth, async (u) => {
  if (u) {
    state.user = u;
    await fetchUserData(u.uid);
  } else {
    state.user = null;
    state.role = null;
    if (state.view !== 'auth' && state.view !== 'register' && state.view !== 'reset-password') {
      state.view = 'home';
      render();
    }
  }
});

// === تعديل: دعم دور admin في أعلى الصفحة ===
function renderTopbar(appContainer, title, sub, onBack){
  const bar = document.createElement('div');
  bar.className='topbar';
  let userStatus = state.user ? `<span style="font-size:12px; color:var(--mint-deep);">(${state.role === 'teacher' ? 'معلم' : state.role === 'admin' ? 'مدير' : 'طالب'})</span>` : '';

  bar.innerHTML = `
    <div class="brand" id="brandHome">
      <div class="mark">🎙️</div>
      <div><h1>${title || 'منارة النطق'} ${userStatus}</h1><span>${sub || 'المنصة التدريبية المباشرة'}</span></div>
    </div>
    <div class="nav-btns" id="navActions"></div>
  `;

  bar.querySelector('#brandHome').onclick = () => { state.view = 'home'; render(); };
  const actions = bar.querySelector('#navActions');

  if(onBack){
    const btnBack = document.createElement('button');
    btnBack.className = 'btn-nav';
    btnBack.innerHTML = 'رجوع ←';
    btnBack.onclick = onBack;
    actions.appendChild(btnBack);
  }

  if(state.user){
    const btnDashboard = document.createElement('button');
    btnDashboard.className = 'btn-nav';
    btnDashboard.textContent = state.role === 'teacher' || state.role === 'admin' ? 'لوحتي' : 'صفحتي الجلسات';
    btnDashboard.onclick = () => { state.view = state.role === 'teacher' || state.role === 'admin' ? 'teacher-dashboard' : 'student-menu'; render(); };
    actions.appendChild(btnDashboard);

    // === تعديل: إضافة زر لوحة المدير إذا كان admin ===
    if (state.role === 'admin') {
      const btnAdmin = document.createElement('button');
      btnAdmin.className = 'btn-nav';
      btnAdmin.textContent = 'لوحة المدير';
      btnAdmin.onclick = () => { window.location.href = 'admin.html'; };
      actions.appendChild(btnAdmin);
    }

    const btnLogout = document.createElement('button');
    btnLogout.className = 'btn-nav';
    btnLogout.style.color = 'var(--coral)';
    btnLogout.textContent = 'خروج';
    btnLogout.onclick = async () => {
      try {
        // === تعديل: تنظيف عنصر الطباعة عند الخروج ===
        if (iepPrintArea) {
          iepPrintArea.remove();
          iepPrintArea = null;
        }
        await signOut(auth);
        // إعادة تعيين الحالة بالكامل
        state.user = null;
        state.role = null;
        state.currentStudent = null;
        state.myStudents = [];
        state.freeStudents = [];
        state.view = 'home';
        showToast('تم تسجيل الخروج بنجاح');
        render();
      } catch(e) {
        showToast('خطأ أثناء خروج الحساب');
      }
    };
    actions.appendChild(btnLogout);
  } else {
    const btnLogin = document.createElement('button');
    btnLogin.className = 'btn-nav';
    btnLogin.textContent = 'تسجيل الدخول';
    btnLogin.onclick = () => { state.view = 'auth'; render(); };
    actions.appendChild(btnLogin);
  }

  appContainer.appendChild(bar);
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';

  if(state.view === 'home') return renderHome(app);
  if(state.view === 'auth') return renderAuth(app);
  if(state.view === 'register') return renderRegister(app);
  if(state.view === 'reset-password') return renderResetPassword(app);
  if(state.view === 'teacher-dashboard') return renderTeacherDashboard(app);
  if(state.view === 'diagnostic-session') return renderDiagnosticSession(app);
  if(state.view === 'student-profile') return renderStudentProfile(app);
  if(state.view === 'letter-training') return renderLetterTraining(app);
  if(state.view === 'student-menu') return renderStudentMenu(app);
  if(state.view === 'speech-sessions') return renderSpeechSessions(app);
  if(state.view === 'single-session') return renderSingleSession(app);
  if(state.view === 'iep-session') return renderIEPSession(app);
  if(state.view === 'food-menu') return renderFoodMenu(app);
}

function renderHome(app){
  renderTopbar(app, 'منارة النطق', 'المنصة التدريبية المباشرة');
  
  const banner = document.createElement('div');
  banner.className = 'card';
  banner.style.background = 'linear-gradient(135deg, #357E74, #4FB6A8)';
  banner.style.color = 'white';
  banner.innerHTML = `
    <h2 style="margin-top:0;">منصة تشخيص وتدريب النطق الشاملة</h2>
    <p>تشخيص 28 حرفاً مع الصوت والصورة وإدارة الجلسات الأسبوعية العلاجية المباشرة والخطة الفردية (IEP).</p>
    ${!state.user ? '<button class="btn btn-soft" id="btnAuthHome">تسجيل الدخول / إنشاء حساب</button>' : ''}
  `;
  app.appendChild(banner);
  if(!state.user){
    banner.querySelector('#btnAuthHome').onclick = () => { state.view = 'auth'; render(); };
  }

  const grid = document.createElement('div');
  grid.style.display = 'grid';
  grid.style.gridTemplateColumns = 'repeat(auto-fit, minmax(280px, 1fr))';
  grid.style.gap = '15px';

  grid.innerHTML = `
    <div class="card" style="cursor:pointer;" id="goFood">
      <h3>🍎 التدريب على الأطعمة</h3>
      <p class="muted">قوائم المسميات التفاعلية المناسبة لجلسات التسمية والتعزيز.</p>
      <button class="btn btn-soft btn-sm">استكشف القائمة العامة</button>
    </div>
  `;
  app.appendChild(grid);
  grid.querySelector('#goFood').onclick = () => { state.view = 'food-menu'; render(); };
}

function renderAuth(app){
  renderTopbar(app, 'تسجيل الدخول', '', () => { state.view = 'home'; render(); });

  const card = document.createElement('div');
  card.className = 'auth-form';
  card.innerHTML = `
    <h2>تسجيل الدخول</h2>
    <input type="email" id="email" placeholder="البريد الإلكتروني">
    <input type="password" id="password" placeholder="كلمة المرور">
    <button class="btn btn-primary btn-block" id="loginBtn">دخول</button>
    
    <div style="display:flex; justify-content:space-between; margin-top:15px;" class="auth-toggle">
      <span id="toRegister">إنشاء حساب جديد</span>
      <span id="toReset">نسيت كلمة المرور؟</span>
    </div>
  `;

  card.querySelector('#loginBtn').onclick = async () => {
    try {
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value;
      if(!email || !pass) return showToast('يرجى إدخال البريد وكلمة المرور');
      const res = await signInWithEmailAndPassword(auth, email, pass);
      state.user = res.user;
      await fetchUserData(res.user.uid);
    } catch (e) {
      showToast('خطأ في بيانات الدخول');
    }
  };

  card.querySelector('#toRegister').onclick = () => { state.view = 'register'; render(); };
  card.querySelector('#toReset').onclick = () => { state.view = 'reset-password'; render(); };
  app.appendChild(card);
}

function renderResetPassword(app){
  renderTopbar(app, 'استعادة كلمة المرور', '', () => { state.view = 'auth'; render(); });

  const card = document.createElement('div');
  card.className = 'auth-form';
  card.innerHTML = `
    <h2>نسيت كلمة المرور</h2>
    <p class="muted" style="text-align:center;">أدخل بريدك الإلكتروني لإرسال رابط إعادة تعيين كلمة المرور.</p>
    <input type="email" id="resetEmail" placeholder="البريد الإلكتروني">
    <button class="btn btn-primary btn-block" id="resetBtn">إرسال رابط إعادة التعيين</button>
    <div class="auth-toggle" style="margin-top:15px;"><span id="backToLogin">العودة لتسجيل الدخول</span></div>
  `;

  card.querySelector('#resetBtn').onclick = async () => {
    const email = document.getElementById('resetEmail').value.trim();
    if(!email) return showToast('يرجى كتابة البريد الإلكتروني');
    try {
      await sendPasswordResetEmail(auth, email);
      showToast('تم إرسال رابط إعادة التعيين لبريدك الإلكتروني');
      state.view = 'auth'; render();
    } catch(e) {
      showToast('تعذر الإرسال: تأكد من صحة البريد الإلكتروني');
    }
  };

  card.querySelector('#backToLogin').onclick = () => { state.view = 'auth'; render(); };
  app.appendChild(card);
}

function renderRegister(app){
  renderTopbar(app, 'إنشاء حساب', 'انضم للمنصة كمعلم أو طالب', () => { state.view = 'auth'; render(); });

  const card = document.createElement('div');
  card.className = 'auth-form';
  card.innerHTML = `
    <h2>حساب جديد</h2>
    <input type="text" id="fullName" placeholder="الاسم الكامل">
    <input type="email" id="email" placeholder="البريد الإلكتروني">
    <input type="password" id="password" placeholder="كلمة المرور">
    <select id="role">
      <option value="student">طالب</option>
      <option value="teacher">معلم</option>
    </select>
    <button class="btn btn-primary btn-block" id="regBtn">تسجيل الحساب</button>
  `;

  card.querySelector('#regBtn').onclick = async () => {
    const name = document.getElementById('fullName').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const role = document.getElementById('role').value;
    if(!email || !password) return showToast('يرجى ملء جميع الحقول المطلوبة');
    try {
      const res = await createUserWithEmailAndPassword(auth, email, password);
      await setDoc(doc(db, "users", res.user.uid), {
        fullName: name || email, email: email, role: role, teacherId: null, diagnostic: {}
      });
      state.user = res.user;
      state.role = role;
      state.view = role === 'teacher' ? 'teacher-dashboard' : 'student-menu';
      showToast('تم إنشاء الحساب بنجاح');
      if(role === 'teacher') await fetchTeacherStudents();
      else render();
    } catch (e) {
      showToast('فشل التسجيل: كلمة المرور ضعيفة أو البريد مستخدم');
    }
  };

  app.appendChild(card);
}

async function fetchUserData(uid){
  try {
    const uDoc = await getDoc(doc(db, "users", uid));
    if(uDoc.exists()){
      const uData = uDoc.data();
      state.role = uData.role;
      // === تعديل: معاملة admin كمعلم مع صلاحيات إضافية ===
      if (state.role === 'teacher' || state.role === 'admin') {
        state.view = 'teacher-dashboard';
        await fetchTeacherStudents();
      } else {
        state.currentStudent = { id: uid, ...uData };
        state.view = 'student-menu';
        render();
      }
    }
  } catch(e) {
    showToast('خطأ في جلب بيانات المستخدم');
  }
}

async function fetchTeacherStudents(){
  if(!state.user) return;
  try {
    const qStudents = query(collection(db, "users"), where("role", "==", "student"));
    const snap = await getDocs(qStudents);
    state.myStudents = [];
    state.freeStudents = [];
    snap.forEach(d => {
      const data = d.data();
      const studentObj = { id: d.id, ...data };
      if (data.teacherId === state.user.uid) state.myStudents.push(studentObj);
      else if (!data.teacherId) state.freeStudents.push(studentObj);
    });
    render();
  } catch(e) {
    showToast('خطأ في تحميل بيانات الطلاب');
  }
}

window.claimStudent = async function(studentId){
  try {
    const ref = doc(db, "users", studentId);
    const snap = await getDoc(ref);
    const data = snap.data();
    
    if(snap.exists() && data.teacherId && data.teacherId !== state.user.uid){
      showToast('عذراً! هذا الطالب مرتبط بمعلم آخر بالفعل');
      await fetchTeacherStudents();
      return;
    }
    
    await updateDoc(ref, { teacherId: state.user.uid });
    showToast('تمت إضافة الطالب بنجاح');
    await fetchTeacherStudents();
  } catch(e) {
    showToast('فشل في إضافة الطالب');
  }
};

window.removeStudent = async function(studentId){
  try {
    await updateDoc(doc(db, "users", studentId), { teacherId: null });
    showToast('تم إزالة الطالب من قائمتك');
    await fetchTeacherStudents();
  } catch(e) {
    showToast('فشل في إزالة الطالب');
  }
};

      try {
        await updateDoc(doc(db, "sessions", sess.id), { evaluation: val });
        
        // === تعديل: تحديث تشخيص الطالب دائمًا ===
        const studentDocRef = doc(db, "users", sess.studentId);
        const stSnap = await getDoc(studentDocRef);
        if(stSnap.exists()){
          const diag = stSnap.data().diagnostic || {};
          diag[sess.letter] = val;
          await updateDoc(studentDocRef, { diagnostic: diag });
        }

        sess.evaluation = val;
        showToast('تم رصد التقييم وتحديث سجل الطالب');
        renderSingleSession(app);
      } catch(e) {
        showToast('خطأ أثناء حفظ التقييم');
      }
    };

    setTimeout(() => {
      const p = document.getElementById('evalP'); if(p) p.onclick = () => updateEval('passed');
      const tr = document.getElementById('evalTR'); if(tr) tr.onclick = () => updateEval('trained');
      const n = document.getElementById('evalN'); if(n) n.onclick = () => updateEval('need');
      const u = document.getElementById('evalU'); if(u) u.onclick = () => updateEval('unclear');
    }, 0);
  }
  
  // بطاقات التشكيل والكلمات
  const trainCard = document.createElement('div');
  trainCard.className = 'card';
  trainCard.innerHTML = `
    <h3>1. التشكيل والحركات</h3>
    <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; margin-bottom:15px;">
      <div class="vowel-box" onclick="speakText('${letterData.vowels.fatha}')">${letterData.vowels.fatha}<br><small style="font-size:11px;">فتحة</small></div>
      <div class="vowel-box" onclick="speakText('${letterData.vowels.damma}')">${letterData.vowels.damma}<br><small style="font-size:11px;">ضمة</small></div>
      <div class="vowel-box" onclick="speakText('${letterData.vowels.kasra}')">${letterData.vowels.kasra}<br><small style="font-size:11px;">كسرة</small></div>
      <div class="vowel-box" onclick="speakText('${letterData.vowels.sukoon}')">${letterData.vowels.sukoon}<br><small style="font-size:11px;">سكون</small></div>
    </div>

    <h3>2. مواقع الحرف في الكلمات</h3>
    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap:10px;">
      <div style="background:#F8FAFC; padding:10px; border-radius:10px; border:1px solid var(--line);">
        <strong>بداية الكلمة:</strong>
        ${letterData.words.start.map(w => `<div style="cursor:pointer; font-size:18px;" onclick="speakText('${w}')">🔊 ${w}</div>`).join('')}
      </div>
      <div style="background:#F8FAFC; padding:10px; border-radius:10px; border:1px solid var(--line);">
        <strong>وسط الكلمة:</strong>
        ${letterData.words.middle.map(w => `<div style="cursor:pointer; font-size:18px;" onclick="speakText('${w}')">🔊 ${w}</div>`).join('')}
      </div>
      <div style="background:#F8FAFC; padding:10px; border-radius:10px; border:1px solid var(--line);">
        <strong>نهاية الكلمة:</strong>
        ${letterData.words.end.map(w => `<div style="cursor:pointer; font-size:18px;" onclick="speakText('${w}')">🔊 ${w}</div>`).join('')}
      </div>
    </div>

    <h3 style="margin-top:15px;">3. جمل سياقية</h3>
    <ul>
      ${letterData.sentences.map(s => `<li style="cursor:pointer; font-size:16px; margin-bottom:6px;" onclick="speakText('${s}')">🔊 ${s}</li>`).join('')}
    </ul>
  `;
  app.appendChild(trainCard);
}

// الخطة الفردية IEP والتقرير وتصدير PDF
async function renderIEPSession(app){
  if(!state.currentStudent){
    showToast('اختر طالباً أولاً للوصول للخطة');
    state.view = state.role === 'teacher' || state.role === 'admin' ? 'teacher-dashboard' : 'student-menu';
    return render();
  }

  renderTopbar(app, `الخطة الفردية (IEP): ${state.currentStudent.fullName || state.currentStudent.email}`, 'تفاصيل الخطة وتصدير PDF', () => {
    state.view = state.role === 'teacher' || state.role === 'admin' ? 'teacher-dashboard' : 'student-menu'; render();
  });

  // جلب أو إنشاء الخطة
  let iep = {
    diagnosis: 'اضطراب نطق بالحروف (لدغة)',
    longGoal: 'أن ينطق الطالب الحروف المستهدفة بشكل صحيح في الكلمات والجمل.',
    shortGoals: '1. نطق الحرف بشكل مفرد صحيح.\n2. نطق الحرف في بداية الكلمة ووسطها ونهايتها.',
    notes: 'متابعة منزلية يومية لمدة 10 دقائق.'
  };

  try {
    const docRef = doc(db, "iep", state.currentStudent.id);
    const snap = await getDoc(docRef);
    if(snap.exists()){
      iep = snap.data();
    }
  } catch(e){}

  // جلب الجلسات الخاصة بالطالب لعرضها في التقرير
  let studentSessions = [];
  try {
    const qS = query(collection(db, "sessions"), where("studentId", "==", state.currentStudent.id), orderBy("date", "desc"));
    const snap = await getDocs(qS);
    snap.forEach(d => studentSessions.push({ id: d.id, ...d.data() }));
  } catch(e){}

  const formCard = document.createElement('div');
  formCard.className = 'card';
  formCard.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
      <h3>تفاصيل الخطة التربوية الفردية (IEP)</h3>
      <div>
        <button class="btn btn-primary btn-sm" id="btnPrintPDF">🖨️ تصدير وتحميل التقرير PDF</button>
        <button class="btn btn-soft btn-sm" id="btnPrint">🖨️ طباعة</button>
      </div>
    </div>
    <hr style="border:0; border-top:1px solid var(--line); margin:12px 0;">

    <label><b>تشخيص حالة الطالب:</b></label>
    <input type="text" id="iepDiagnosis" value="${iep.diagnosis}">

    <label><b>الهدف العام:</b></label>
    <input type="text" id="iepLongGoal" value="${iep.longGoal}">

    <label><b>الأهداف التعليمية القصيرة:</b></label>
    <textarea id="iepShortGoals" rows="3">${iep.shortGoals}</textarea>

    <label><b>توصيات لولي الأمر والمعلم:</b></label>
    <textarea id="iepNotes" rows="2">${iep.notes}</textarea>

    ${state.role === 'teacher' || state.role === 'admin' ? '<button class="btn btn-success btn-sm" id="saveIEPBtn">حفظ الخطة الفردية</button>' : ''}
  `;
  app.appendChild(formCard);

  // === تعديل: إدارة عنصر الطباعة بشكل أفضل ===
  if (iepPrintArea) {
    iepPrintArea.remove();
    iepPrintArea = null;
  }

  const printArea = document.createElement('div');
  iepPrintArea = printArea;
  printArea.id = 'iep-print-area';
  printArea.style.cssText = 'position:absolute; left:-9999px; top:0; width:100%; background:white; z-index:9999; padding:30px;';
  
  const updatePrintAreaContent = (iepData) => {
    printArea.innerHTML = `
      <div style="text-align:center; margin-bottom:20px;">
        <h1 style="margin:0;">منارة النطق - تقرير الخطة الفردية (IEP)</h1>
        <p style="color:#555;">تاريخ التقرير: ${new Date().toLocaleDateString('ar-SA')}</p>
      </div>
      <div style="border:2px solid #357E74; border-radius:12px; padding:20px;">
        <h2 style="border-bottom:2px solid #357E74; padding-bottom:10px;">معلومات الطالب</h2>
        <p><strong>الاسم:</strong> ${state.currentStudent.fullName || state.currentStudent.email}</p>
        <p><strong>البريد الإلكتروني:</strong> ${state.currentStudent.email}</p>
        <hr style="border-top:1px dashed #ccc; margin:15px 0;">
        <h2 style="border-bottom:2px solid #357E74; padding-bottom:10px;">التشخيص والأهداف</h2>
        <p><strong>التشخيص:</strong> ${iepData.diagnosis}</p>
        <p><strong>الهدف العام:</strong> ${iepData.longGoal}</p>
        <p><strong>الأهداف القصيرة:</strong><br>${iepData.shortGoals.replace(/\n/g, '<br>')}</p>
        <p><strong>التوصيات:</strong><br>${iepData.notes.replace(/\n/g, '<br>')}</p>
        <hr style="border-top:1px dashed #ccc; margin:15px 0;">
        <h2 style="border-bottom:2px solid #357E74; padding-bottom:10px;">ملخص الجلسات</h2>
        ${studentSessions.length > 0 ? studentSessions.map(s => `
          <div style="margin-bottom:8px; padding:8px; background:#f9f9f9; border-radius:6px;">
            <strong>حرف ${s.letter}</strong> - تاريخ: ${s.date} - الهدف: ${s.goal} - التقييم: ${s.evaluation || 'غير مقيم'}
          </div>
        `).join('') : '<p>لا توجد جلسات مسجلة.</p>'}
      </div>
    `;
  };

  updatePrintAreaContent(iep);
  document.body.appendChild(printArea);

  if(state.role === 'teacher' || state.role === 'admin'){
    formCard.querySelector('#saveIEPBtn').onclick = async () => {
      const updated = {
        diagnosis: document.getElementById('iepDiagnosis').value,
        longGoal: document.getElementById('iepLongGoal').value,
        shortGoals: document.getElementById('iepShortGoals').value,
        notes: document.getElementById('iepNotes').value,
        updatedAt: new Date().toISOString()
      };

      try {
        await setDoc(doc(db, "iep", state.currentStudent.id), updated);
        showToast('تم حفظ الخطة الفردية بنجاح');
        updatePrintAreaContent(updated);
      } catch(e) {
        showToast('خطأ في حفظ الخطة');
      }
    };
  }

  // === تعديل: تصدير PDF مع إظهار العنصر مؤقتًا ===
  formCard.querySelector('#btnPrintPDF').onclick = () => {
    const element = printArea;
    const originalPosition = element.style.position;
    const originalLeft = element.style.left;
    const originalTop = element.style.top;
    const originalZIndex = element.style.zIndex;
    const originalVisibility = element.style.visibility;
    
    element.style.position = 'fixed';
    element.style.left = '0';
    element.style.top = '0';
    element.style.zIndex = '9999';
    element.style.visibility = 'visible';
    element.style.width = '100%';
    
    const opt = {
      margin: 10,
      filename: `IEP_${state.currentStudent.id}.pdf`,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2 },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };
    
    html2pdf().set(opt).from(element).save().then(() => {
      element.style.position = originalPosition;
      element.style.left = originalLeft;
      element.style.top = originalTop;
      element.style.zIndex = originalZIndex;
      element.style.visibility = originalVisibility;
    }).catch(() => {
      element.style.position = originalPosition;
      element.style.left = originalLeft;
      element.style.top = originalTop;
      element.style.zIndex = originalZIndex;
      element.style.visibility = originalVisibility;
    });
  };

  // زر الطباعة
  formCard.querySelector('#btnPrint').onclick = () => {
    window.print();
  };
}
