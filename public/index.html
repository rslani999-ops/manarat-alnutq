<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منارة النطق لتدريبات النطق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E2A47;
    --paper:#EFF5FB;
    --mint:#4FB6A8;
    --mint-deep:#357E74;
    --sun:#F4B740;
    --coral:#EF6F5B;
    --lilac:#9C82C4;
    --white:#FFFFFF;
    --line: rgba(30,42,71,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
    background-image:
      radial-gradient(circle at 8% 12%, rgba(79,182,168,0.10) 0, transparent 40%),
      radial-gradient(circle at 92% 85%, rgba(239,111,91,0.08) 0, transparent 40%);
  }
  h1,h2,h3,.display{font-family:'Baloo Bhaijaan 2', sans-serif;}
  .num,.data{font-family:'IBM Plex Sans Arabic', sans-serif;}
  #app{max-width:960px;margin:0 auto;padding:20px 16px 60px;}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 4px 24px;}
  .brand{display:flex;align-items:center;gap:10px;cursor:pointer;}
  .brand .mark{
    width:40px;height:40px;border-radius:12px;
    background:linear-gradient(135deg,var(--mint),var(--mint-deep));
    display:flex;align-items:center;justify-content:center;
    font-size:20px;color:white;box-shadow:0 4px 10px rgba(79,182,168,0.35);
  }
  .brand h1{font-size:20px;margin:0;font-weight:700;}
  .brand span{display:block;font-size:11px;color:#6B7A99;font-family:'Tajawal';margin-top:-2px;}
  
  .nav-btns{display:flex;gap:8px;align-items:center;}
  .btn-nav{
    border:none;background:white;color:var(--ink);padding:8px 14px;border-radius:10px;
    font-family:'Tajawal';font-weight:700;cursor:pointer;border:1px solid var(--line);
    display:flex;align-items:center;gap:6px;font-size:13px;
  }
  .btn-nav:hover{background:#F5F8FC;}

  .card{background:white;border-radius:18px;border:1px solid var(--line);padding:20px;margin-bottom:16px;}
  .card h3{margin:0 0 4px;font-size:17px;}
  .muted{color:#6B7A99;font-size:13px;}

  .btn{
    border:none;border-radius:12px;padding:12px 20px;font-family:'Tajawal';font-weight:700;
    cursor:pointer;font-size:15px;transition:filter .15s, transform .15s;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--mint-deep);color:white;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-soft{background:#EAF6F4;color:var(--mint-deep);}
  .btn-soft:hover{background:#DDF0ED;}
  .btn-success{background:#10B981;color:white;}
  .btn-danger{background:var(--coral);color:white;}
  .btn-block{width:100%;}
  .btn-sm{padding:6px 12px;font-size:12px;border-radius:8px;}

  input[type=text], input[type=password], input[type=email], input[type=number], input[type=date], textarea, select{
    width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);
    font-family:'Tajawal';font-size:15px;background:#FBFDFE;margin-bottom:12px;
  }
  input:focus, textarea:focus, select:focus{outline:none;border-color:var(--mint);}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:white;padding:12px 22px;border-radius:12px;
    font-family:'Tajawal';font-weight:700;font-size:14px;z-index:50;
    box-shadow:0 10px 24px rgba(0,0,0,0.2);
  }

  .auth-form{max-width:400px;margin:20px auto;background:white;padding:30px;border-radius:20px;border:1px solid var(--line);}
  .auth-form h2{text-align:center;margin-bottom:20px;}
  .auth-toggle{text-align:center;margin-top:15px;font-size:14px;color:#5B6A88;}
  .auth-toggle span{color:var(--mint-deep);cursor:pointer;font-weight:700;}

  .articulation-box {
    display: flex; gap: 15px; align-items: center; background: #F4F9F8;
    border: 1px dashed var(--mint); padding: 14px; border-radius: 14px; margin-bottom: 15px;
  }
  .articulation-img {
    width: 60px; height: 60px; background: var(--white); border-radius: 10px;
    border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
    font-size: 26px; flex-shrink: 0;
  }

  .student-row{
    padding:12px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;
  }
  .session-item {
    background: #FAFDFC; border: 1px solid var(--line); padding: 12px 16px; border-radius: 12px; margin-bottom: 10px;
  }
  .badge{padding:3px 8px; border-radius:6px; font-size:11px; font-weight:bold;}
  .badge-assigned{background:#E1F5FE; color:#0288D1;}
  .badge-free{background:#E8F5E9; color:#388E3C;}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import { getFirestore, setDoc, doc, getDoc, updateDoc, collection, addDoc, getDocs, query, where, orderBy } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDTst5UKgNJ6ThVOAVHOG3JoWfEvUp1asw",
  authDomain: "manarat-alnutq.firebaseapp.com",
  databaseURL: "https://manarat-alnutq-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "manarat-alnutq",
  storageBucket: "manarat-alnutq.firebasestorage.app",
  messagingSenderId: "543101731444",
  appId: "1:543101731444:web:35a8daf145603c66978721",
  measurementId: "G-ZFKWLDT384"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const ARABIC_LETTERS = [
  {ch:'ا', word:'أَسَد', place:'الجوف / الحلق'}, {ch:'ب', word:'بَطَّة', place:'الشفتان'}, {ch:'ت', word:'تُفَّاح', place:'أطراف اللسان مع أصول الثنايا العليا'}, 
  {ch:'ث', word:'ثَعْلَب', place:'أطراف اللسان مع أطراف الثنايا العليا'}, {ch:'ج', word:'جَمَل', place:'وسط اللسان'}, {ch:'ح', word:'حِصَان', place:'وسط الحلق'}, 
  {ch:'خ', word:'خُبْز', place:'أدنى الحلق'}, {ch:'د', word:'دُبّ', place:'أطراف اللسان مع أصول الثنايا العليا'}, {ch:'ر', word:'رُمَّان', place:'ظهر اللسان'}
];

const FOOD_ITEMS = ['تفاحة', 'موزة', 'برتقالة', 'عنب', 'تمر', 'خبز', 'حليب', 'ماء'];

let state = { view:'home', user:null, role:null, myStudents:[], freeStudents:[], sessions:[] };
let toastTimer = null;

function showToast(msg){
  const t=document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.remove(), 2200);
}

function renderTopbar(appContainer, title, sub, onBack){
  const bar = document.createElement('div');
  bar.className='topbar';
  
  let userStatus = state.user ? `<span style="font-size:12px; color:var(--mint-deep);">(${state.role === 'teacher' ? 'معلم' : 'طالب'})</span>` : '';

  bar.innerHTML = `
    <div class="brand" id="brandHome">
      <div class="mark">🎙️</div>
      <div><h1>${title || 'منارة النطق'} ${userStatus}</h1><span>${sub || 'المنصة التدريبية المباشرة'}</span></div>
    </div>
    <div class="nav-btns" id="navActions"></div>
  `;

  bar.querySelector('#brandHome').onclick = () => { state.view = 'home'; render(); };
  const actions = bar.querySelector('#navActions');

  if(onBack){
    const btnBack = document.createElement('button');
    btnBack.className = 'btn-nav';
    btnBack.innerHTML = 'رجوع ←';
    btnBack.onclick = onBack;
    actions.appendChild(btnBack);
  }

  if(state.user){
    const btnDashboard = document.createElement('button');
    btnDashboard.className = 'btn-nav';
    btnDashboard.textContent = state.role === 'teacher' ? 'لوحتي' : 'صفحتي';
    btnDashboard.onclick = () => { state.view = state.role === 'teacher' ? 'teacher-dashboard' : 'student-menu'; render(); };
    actions.appendChild(btnDashboard);

    const btnLogout = document.createElement('button');
    btnLogout.className = 'btn-nav';
    btnLogout.style.color = 'var(--coral)';
    btnLogout.textContent = 'خروج';
    btnLogout.onclick = async () => {
      await signOut(auth);
      state.user = null; state.role = null; state.view = 'home';
      showToast('تم تسجيل الخروج');
      render();
    };
    actions.appendChild(btnLogout);
  } else {
    const btnLogin = document.createElement('button');
    btnLogin.className = 'btn-nav';
    btnLogin.textContent = 'تسجيل الدخول';
    btnLogin.onclick = () => { state.view = 'auth'; render(); };
    actions.appendChild(btnLogin);
  }

  appContainer.appendChild(bar);
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';

  if(state.view === 'home') return renderHome(app);
  if(state.view === 'auth') return renderAuth(app);
  if(state.view === 'register') return renderRegister(app);
  if(state.view === 'teacher-dashboard') return renderTeacherDashboard(app);
  if(state.view === 'student-menu') return renderStudentMenu(app);
  if(state.view === 'diagnostics') return renderDiagnostics(app);
  if(state.view === 'food-menu') return renderFoodMenu(app);
  if(state.view === 'speech-sessions') return renderSpeechSessions(app);
  if(state.view === 'iep-session') return renderIEPSession(app);
}

function renderHome(app){
  renderTopbar(app, 'منارة النطق', 'تصفح عام للمحتوى التفاعلي');

  const banner = document.createElement('div');
  banner.className = 'card';
  banner.style.background = 'linear-gradient(135deg, #357E74, #4FB6A8)';
  banner.style.color = 'white';
  banner.innerHTML = `
    <h2 style="margin-top:0;">أهلاً بك في منصة منارة النطق</h2>
    <p>يمكن للجميع تصفح الأنشطة المتاحة العامة. للحصول على المتابعة الفردية، ربط المعلمين، وسجلات التقييم، يُرجى تسجيل الدخول.</p>
  `;
  app.appendChild(banner);

  const grid = document.createElement('div');
  grid.style.display = 'grid';
  grid.style.gridTemplateColumns = 'repeat(auto-fit, minmax(280px, 1fr))';
  grid.style.gap = '15px';

  grid.innerHTML = `
    <div class="card" id="goDiag" style="cursor:pointer;">
      <h3>🗣️ دليل تشخيص النطق</h3>
      <p class="muted">تصفح مخارج الحروف العربية والكلمات التوضيحية دون الحاجة لتسجيل.</p>
      <button class="btn btn-soft btn-sm">استكشف الأنشطة العامة</button>
    </div>
    <div class="card" id="goFood" style="cursor:pointer;">
      <h3>🍎 التدريب على الأطعمة</h3>
      <p class="muted">قوائم المسميات التفاعلية المناسبة لجلسات التسمية والتعزيز.</p>
      <button class="btn btn-soft btn-sm">استكشف القائمة العامة</button>
    </div>
  `;

  app.appendChild(grid);

  grid.querySelector('#goDiag').onclick = () => { state.view = 'diagnostics'; render(); };
  grid.querySelector('#goFood').onclick = () => { state.view = 'food-menu'; render(); };
}

function renderAuth(app){
  renderTopbar(app, 'تسجيل الدخول', 'ادخل لحسابك المخصص', () => { state.view = 'home'; render(); });
  
  const card = document.createElement('div');
  card.className = 'auth-form';
  card.innerHTML = `
    <h2>تسجيل الدخول</h2>
    <input type="email" id="email" placeholder="البريد الإلكتروني">
    <input type="password" id="password" placeholder="كلمة المرور">
    <button class="btn btn-primary btn-block" id="loginBtn">دخول</button>
    <div class="auth-toggle">ليس لديك حساب؟ <span id="toRegister">إنشاء حساب جديد</span></div>
  `;

  card.querySelector('#loginBtn').onclick = async () => {
    const email = card.querySelector('#email').value;
    const password = card.querySelector('#password').value;
    try {
      const res = await signInWithEmailAndPassword(auth, email, password);
      state.user = res.user;
      await fetchUserData(res.user.uid);
    } catch (e) {
      showToast('خطأ في بيانات الدخول');
    }
  };

  card.querySelector('#toRegister').onclick = () => { state.view = 'register'; render(); };
  app.appendChild(card);
}

function renderRegister(app){
  renderTopbar(app, 'إنشاء حساب', 'انضم للمنصة كمعلم أو طالب', () => { state.view = 'auth'; render(); });

  const card = document.createElement('div');
  card.className = 'auth-form';
  card.innerHTML = `
    <h2>حساب جديد</h2>
    <input type="email" id="email" placeholder="البريد الإلكتروني">
    <input type="password" id="password" placeholder="كلمة المرور">
    <select id="role">
      <option value="student">طالب</option>
      <option value="teacher">معلم</option>
    </select>
    <button class="btn btn-primary btn-block" id="regBtn">تسجيل الحساب</button>
  `;

  card.querySelector('#regBtn').onclick = async () => {
    const email = card.querySelector('#email').value;
    const password = card.querySelector('#password').value;
    const role = card.querySelector('#role').value;
    try {
      const res = await createUserWithEmailAndPassword(auth, email, password);
      await setDoc(doc(db, "users", res.user.uid), {
        email: email,
        role: role,
        teacherId: null 
      });
      state.user = res.user;
      state.role = role;
      state.view = role === 'teacher' ? 'teacher-dashboard' : 'student-menu';
      showToast('تم إنشاء الحساب بنجاح');
      if(role === 'teacher') fetchTeacherStudents();
      else render();
    } catch (e) {
      showToast('فشل التسجيل: تأكد من كلمة المرور والشروط');
    }
  };

  app.appendChild(card);
}

async function fetchUserData(uid){
  try {
    const uDoc = await getDoc(doc(db, "users", uid));
    if(uDoc.exists()){
      state.role = uDoc.data().role;
      state.view = state.role === 'teacher' ? 'teacher-dashboard' : 'student-menu';
      if(state.role === 'teacher') await fetchTeacherStudents();
      else render();
    }
  } catch(e) {
    showToast('خطأ في جلب البيانات');
  }
}

async function fetchTeacherStudents(){
  if(!state.user) return;
  try {
    const qMy = query(collection(db, "users"), where("role", "==", "student"), where("teacherId", "==", state.user.uid));
    const snapMy = await getDocs(qMy);
    state.myStudents = [];
    snapMy.forEach(d => state.myStudents.push({id: d.id, ...d.data()}));

    const qFree = query(collection(db, "users"), where("role", "==", "student"), where("teacherId", "==", null));
    const snapFree = await getDocs(qFree);
    state.freeStudents = [];
    snapFree.forEach(d => state.freeStudents.push({id: d.id, ...d.data()}));

    render();
  } catch(e) {
    showToast('خطأ في جلب قوائم الطلاب');
  }
}

function renderTeacherDashboard(app){
  renderTopbar(app, 'لوحة المعلم الخاصة', 'إدارة طلابك وحصصك المغلقة');

  const actCard = document.createElement('div');
  actCard.className = 'card';
  actCard.innerHTML = `
    <h3>جلساتي وتقييماتي المباشرة</h3>
    <p class="muted">الوصول لتقارير جلسات النطق والخطة الفردية (IEP) الخاصة بطلابك فقط.</p>
    <div style="display:flex; gap:10px; margin-top:10px;">
      <button class="btn btn-primary btn-sm" id="btnSessions">سجل الجلسات السحابي</button>
      <button class="btn btn-soft btn-sm" id="btnIEP">إدارة الخطة IEP</button>
    </div>
  `;
  app.appendChild(actCard);

  actCard.querySelector('#btnSessions').onclick = () => { state.view = 'speech-sessions'; render(); };
  actCard.querySelector('#btnIEP').onclick = () => { state.view = 'iep-session'; render(); };

  const myCard = document.createElement('div');
  myCard.className = 'card';
  let myTitle = document.createElement('h3');
  myTitle.textContent = 'الطلاب المضافون لقائمتك الخاصة';
  myCard.appendChild(myTitle);

  if(state.myStudents.length === 0){
    const p = document.createElement('p');
    p.className = 'muted';
    p.textContent = 'لم تقم بإضافة أي طالب لقائمتك الخاصة بعد.';
    myCard.appendChild(p);
  } else {
    state.myStudents.forEach(st => {
      const row = document.createElement('div');
      row.className = 'student-row';
      row.innerHTML = `
        <div>
          <strong>${st.email}</strong>
          <br><span class="badge badge-assigned">طالبك الخصيص</span>
        </div>
      `;
      const btn = document.createElement('button');
      btn.className = 'btn btn-danger btn-sm';
      btn.textContent = 'إزالة من قائمتي';
      btn.onclick = () => window.removeStudent(st.id);
      row.appendChild(btn);
      myCard.appendChild(row);
    });
  }
  app.appendChild(myCard);

  const freeCard = document.createElement('div');
  freeCard.className = 'card';
  let freeTitle = document.createElement('h3');
  freeTitle.textContent = 'الطلاب المتاحون للإضافة (بدون معلم)';
  freeCard.appendChild(freeTitle);

  if(state.freeStudents.length === 0){
    const p = document.createElement('p');
    p.className = 'muted';
    p.textContent = 'لا يوجد طلاب مستجدون في الانتظار حالياً.';
    freeCard.appendChild(p);
  } else {
    state.freeStudents.forEach(st => {
      const row = document.createElement('div');
      row.className = 'student-row';
      row.innerHTML = `
        <div>
          <strong>${st.email}</strong>
          <br><span class="badge badge-free">متاح للإضافة</span>
        </div>
      `;
      const btn = document.createElement('button');
      btn.className = 'btn btn-success btn-sm';
      btn.textContent = 'إضافة لقائمتي';
      btn.onclick = () => window.claimStudent(st.id);
      row.appendChild(btn);
      freeCard.appendChild(row);
    });
  }
  app.appendChild(freeCard);
}

window.claimStudent = async function(studentId){
  try {
    const ref = doc(db, "users", studentId);
    const snap = await getDoc(ref);
    if(snap.exists() && snap.data().teacherId !== null){
      showToast('عذراً! هذا الطالب مرتبط بمعلم آخر بالفعل');
      fetchTeacherStudents();
      return;
    }
    await updateDoc(ref, { teacherId: state.user.uid });
    showToast('تمت إضافة الطالب لقائمتك بنجاح');
    fetchTeacherStudents();
  } catch(e) {
    showToast('فشل في إضافة الطالب');
  }
};

window.removeStudent = async function(studentId){
  try {
    const ref = doc(db, "users", studentId);
    await updateDoc(ref, { teacherId: null });
    showToast('تم إزالة الطالب من قائمتك');
    fetchTeacherStudents();
  } catch(e) {
    showToast('فشل العملية');
  }
};

function renderSpeechSessions(app){
  renderTopbar(app, 'جلساتي التشخيصية الخاصة', 'مستندات الجلسات الخاصة بمعلمك/طلابك', () => {
    state.view = state.role === 'teacher' ? 'teacher-dashboard' : 'student-menu'; render();
  });

  if(state.role === 'teacher'){
    const card = document.createElement('div');
    card.className = 'card';
    
    let options = state.myStudents.map(s => `<option value="${s.email}">${s.email}</option>`).join('');
    
    card.innerHTML = `
      <h3>تسجيل جلسة تقييم جديدة</h3>
      <div style="margin-top:10px;">
        <label class="muted">اختر الطالب من قائمتك الخاصة:</label>
        ${state.myStudents.length > 0 ? 
          `<select id="stSelect">${options}</select>` : 
          `<input type="text" id="stName" placeholder="أدخل اسم الطالب (أضف طلاب أولاً)" disabled>`}

        <label class="muted">تاريخ الجلسة:</label>
        <input type="date" id="sDate">

        <label class="muted">تفاصيل الجلسة والتقييم التشخيصي:</label>
        <textarea id="sNotes" rows="3" placeholder="أدخل الملاحظات"></textarea>

        <button class="btn btn-success btn-block" id="saveSBtn" ${state.myStudents.length===0?'disabled':''}>حفظ الجلسة لسحابتك الخاصة</button>
      </div>
    `;
    app.appendChild(card);

    card.querySelector('#saveSBtn').onclick = async () => {
      const studentName = document.getElementById('stSelect').value;
      const sessionDate = document.getElementById('sDate').value;
      const notes = document.getElementById('sNotes').value;

      if(!sessionDate || !notes){ showToast('الرجاء تعبئة الحقوق المطلوبة'); return;}

      try {
        await addDoc(collection(db, "speech_sessions"), {
          teacherUid: state.user.uid,
          studentName,
          sessionDate,
          notes,
          createdAt: new Date()
        });
        showToast('تم حفظ الجلسة بسجلك الخاص');
        document.getElementById('sNotes').value = '';
        loadMySessions();
      } catch(e) {
        showToast('حدث خطأ أثناء الحفظ');
      }
    };
  }

  const listCard = document.createElement('div');
  listCard.className = 'card';
  listCard.innerHTML = `
    <h3>سجل الجلسات المحفوظة</h3>
    <div id="sessionsBox" style="margin-top:10px;"><p class="muted">جاري تحميل الجلسات...</p></div>
  `;
  app.appendChild(listCard);

  loadMySessions();
}

async function loadMySessions(){
  const box = document.getElementById('sessionsBox');
  if(!box) return;
  try {
    let q;
    if(state.role === 'teacher'){
      q = query(collection(db, "speech_sessions"), where("teacherUid", "==", state.user.uid), orderBy("createdAt", "desc"));
    } else {
      q = query(collection(db, "speech_sessions"), where("studentName", "==", state.user.email), orderBy("createdAt", "desc"));
    }

    const snap = await getDocs(q);
    box.innerHTML = '';

    if(snap.empty){
      box.innerHTML = '<p class="muted">لا توجد جلسات خاصة مسجلة حتى الآن.</p>';
      return;
    }

    snap.forEach(d => {
      const data = d.data();
      const item = document.createElement('div');
      item.className = 'session-item';
      item.innerHTML = `
        <div><strong>الطالب:</strong> ${data.studentName}</div>
        <div><strong>التاريخ:</strong> ${data.sessionDate}</div>
        <div><strong>الملاحظات:</strong> ${data.notes}</div>
      `;
      box.appendChild(item);
    });
  } catch(e) {
    box.innerHTML = '<p class="muted">خطأ في تحميل سجلات الجلسات.</p>';
  }
}

function renderIEPSession(app){
  renderTopbar(app, 'إدارة الخطة الفردية IEP', 'تتبع نتائج جلسات التدريب اليومية', () => {
    state.view = state.role === 'teacher' ? 'teacher-dashboard' : 'student-menu'; render();
  });

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h3>الهدف النشط والجلسة الحالية</h3>
    <div style="margin-top:12px;">
      <label class="muted">الهدف المباشر:</label>
      <input type="text" id="mainGoal" placeholder="مثال: نطق حرف /ر/ بوضوح">

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <div>
          <label class="muted">المستوى:</label>
          <select id="subGoal">
            <option value="isolated">صوت منفرد</option>
            <option value="words">كلمات</option>
            <option value="sentences">جمل</option>
          </select>
        </div>
        <div>
          <label class="muted">النشاط:</label>
          <select id="actType">
            <option value="naming">تسمية صور</option>
            <option value="repetition">تكرار سماعي</option>
          </select>
        </div>
      </div>

      <div style="background:#FBFDFE; padding:15px; border-radius:12px; border:1px solid var(--line); margin-top:15px;">
        <h4 style="margin-top:0;">احتساب الدقة والإتقان</h4>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
          <div><label class="muted">المحاولات:</label><input type="number" id="trials" value="10" id="trInp"></div>
          <div><label class="muted">الصحيحة:</label><input type="number" id="correct" value="0" id="coInp"></div>
        </div>
        <div style="margin-top:10px; font-weight:bold; color:var(--mint-deep);">
          نسبة الإتقان: <span id="scoreText">0%</span>
        </div>
      </div>

      <button class="btn btn-success btn-block" id="saveIepBtn" style="margin-top:15px;">حفظ التقدم</button>
    </div>
  `;
  app.appendChild(card);

  const tr = card.querySelector('#trials');
  const co = card.querySelector('#correct');
  const calcScore = () => {
    let t = tr.value;
    let c = co.value;
    if(t > 0 && c >= 0){
      let p = Math.round((c / t) * 100);
      document.getElementById('scoreText').innerText = p + '%';
    }
  };
  tr.oninput = calcScore;
  co.oninput = calcScore;

  card.querySelector('#saveIepBtn').onclick = () => showToast('تم حفظ تقدم الخطة بنجاح!');
}

function renderStudentMenu(app){
  renderTopbar(app, 'صفحة الطالب', 'مرحباً بك في أنشطتك');

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h3>مرحباً بك يا بطل!</h3>
    <p class="muted">اختر الأنشطة أو تصفح جلسات التقييم المحفوظة لك من قبَل معلمك.</p>
    <button class="btn btn-primary btn-block" id="btnStDiag" style="margin-bottom:10px;">تشخيص النطق</button>
    <button class="btn btn-soft btn-block" id="btnStFood" style="margin-bottom:10px;">أنشطة الأطعمة</button>
    <button class="btn btn-success btn-block" id="btnStSess">مراجعة تقييماتي المباشرة</button>
  `;
  app.appendChild(card);

  card.querySelector('#btnStDiag').onclick = () => { state.view = 'diagnostics'; render(); };
  card.querySelector('#btnStFood').onclick = () => { state.view = 'food-menu'; render(); };
  card.querySelector('#btnStSess').onclick = () => { state.view = 'speech-sessions'; render(); };
}

function renderDiagnostics(app){
  renderTopbar(app, 'تشخيص النطق', 'دليل مخارج الأصوات', () => {
    state.view = state.user ? (state.role==='teacher'?'teacher-dashboard':'student-menu') : 'home'; render();
  });

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h3>اختر الحرف للاطلاع على المخرج والكلمة:</h3>
    <div class="articulation-box" style="margin-top:15px;">
      <div class="articulation-img" id="charBox">🗣️</div>
      <div>
        <h4 style="margin:0;" id="charTitle">اضغط على أي حرف</h4>
        <p class="muted" style="margin:0;" id="charDesc">تظهر التفاصيل الخاصة بكل صوت هنا.</p>
      </div>
    </div>
  `;

  const grid = document.createElement('div');
  grid.style.display = 'grid'; grid.style.gridTemplateColumns = 'repeat(auto-fit, minmax(90px, 1fr))'; grid.style.gap = '8px';

  ARABIC_LETTERS.forEach(i => {
    const btn = document.createElement('button');
    btn.className = 'btn btn-soft';
    btn.textContent = i.ch;
    btn.onclick = () => {
      document.getElementById('charTitle').innerText = `حرف (${i.ch}) - مثال: ${i.word}`;
      document.getElementById('charDesc').innerText = `المخرج: ${i.place}`;
      document.getElementById('charBox').innerText = i.ch;
      showToast(`انطق: ${i.word}`);
    };
    grid.appendChild(btn);
  });

  card.appendChild(grid);
  app.appendChild(card);
}

function renderFoodMenu(app){
  renderTopbar(app, 'أصناف الطعام', 'التدريب والتسمية', () => {
    state.view = state.user ? (state.role==='teacher'?'teacher-dashboard':'student-menu') : 'home'; render();
  });

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = '<h3>قائمة المسميات:</h3>';

  FOOD_ITEMS.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'btn btn-soft btn-block';
    btn.style.marginBottom = '8px';
    btn.textContent = item;
    btn.onclick = () => showToast(`المطلوب نطق: ${item}`);
    card.appendChild(btn);
  });

  app.appendChild(card);
}

onAuthStateChanged(auth, (user) => {
  if (user) {
    state.user = user;
    fetchUserData(user.uid);
  } else {
    state.user = null; state.role = null; state.view = 'home';
    render();
  }
});

render();
</script>
</body>
</html>
