<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منارة النطق لتدريبات النطق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E2A47;
    --paper:#EFF5FB;
    --mint:#4FB6A8;
    --mint-deep:#357E74;
    --sun:#F4B740;
    --coral:#EF6F5B;
    --lilac:#9C82C4;
    --white:#FFFFFF;
    --line: rgba(30,42,71,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
    background-image:
      radial-gradient(circle at 8% 12%, rgba(79,182,168,0.10) 0, transparent 40%),
      radial-gradient(circle at 92% 85%, rgba(239,111,91,0.08) 0, transparent 40%);
  }
  h1,h2,h3,.display{font-family:'Baloo Bhaijaan 2', sans-serif;}
  .num, .data{font-family:'IBM Plex Sans Arabic', sans-serif;}
  #app{max-width:960px;margin:0 auto;padding:20px 16px 60px;}

  /* Top bar */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 4px 24px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mark{
    width:40px;height:40px;border-radius:12px;
    background:linear-gradient(135deg,var(--mint),var(--mint-deep));
    display:flex;align-items:center;justify-content:center;
    font-size:20px;color:white;box-shadow:0 4px 10px rgba(79,182,168,0.35);
  }
  .brand h1{font-size:20px;margin:0;font-weight:700;}
  .brand span{display:block;font-size:11px;color:#6B7A99;font-family:'Tajawal';margin-top:-2px;}
  .back-btn{
    border:none;background:white;color:var(--ink);padding:8px 14px;border-radius:10px;
    font-family:'Tajawal';font-weight:700;cursor:pointer;border:1px solid var(--line);
    display:flex;align-items:center;gap:6px;font-size:14px;
  }
  .back-btn:hover{background:#F5F8FC;}

  /* Home / role select */
  .hero{text-align:center;margin:10px 0 34px;}
  .hero h2{font-size:28px;margin:0 0 8px;}
  .hero p{color:#5B6A88;font-size:15px;margin:0;}
  .roles{display:grid;grid-template-columns:1fr;gap:14px;}
  @media(min-width:640px){.roles{grid-template-columns:repeat(3,1fr);}}
  .role-card{
    background:white;border-radius:20px;padding:26px 20px;text-align:center;
    border:1px solid var(--line);cursor:pointer;transition:transform .15s, box-shadow .15s;
    position:relative;overflow:hidden;
  }
  .role-card:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(30,42,71,0.10);}
  .role-card .icon{
    width:64px;height:64px;border-radius:18px;margin:0 auto 14px;
    display:flex;align-items:center;justify-content:center;font-size:30px;
  }
  .role-teacher .icon{background:#EAF6F4;}
  .role-student .icon{background:#FDF2E3;}
  .role-parent .icon{background:#F3EEFA;}
  .role-card h3{margin:0 0 6px;font-size:18px;}
  .role-card p{margin:0;font-size:13px;color:#6B7A99;}

  /* Cards / sections */
  .card{background:white;border-radius:18px;border:1px solid var(--line);padding:20px;margin-bottom:16px;}
  .card h3{margin:0 0 4px;font-size:17px;}
  .muted{color:#6B7A99;font-size:13px;}

  .btn{
    border:none;border-radius:12px;padding:12px 20px;font-family:'Tajawal';font-weight:700;
    cursor:pointer;font-size:15px;transition:filter .15s, transform .15s;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--mint-deep);color:white;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-soft{background:#EAF6F4;color:var(--mint-deep);}
  .btn-soft:hover{background:#DDF0ED;}
  .btn-block{width:100%;}
  .btn-sm{padding:8px 14px;font-size:13px;border-radius:9px;}

  input[type=text]{
    width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);
    font-family:'Tajawal';font-size:15px;background:#FBFDFE;
  }
  input[type=text]:focus{outline:none;border-color:var(--mint);}

  .student-list{display:grid;gap:10px;}
  .student-row{
    display:flex;align-items:center;justify-content:space-between;
    background:white;border:1px solid var(--line);border-radius:14px;padding:12px 16px;
  }
  .student-row .info{display:flex;align-items:center;gap:12px;}
  .avatar{
    width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:'Baloo Bhaijaan 2';font-weight:700;color:white;font-size:16px;
  }
  .student-row h4{margin:0;font-size:15px;}
  .badge{
    font-size:11px;padding:3px 9px;border-radius:20px;font-family:'IBM Plex Sans Arabic';font-weight:600;
  }
  .badge-new{background:#F3EEFA;color:var(--lilac);}
  .badge-diag{background:#FDF2E3;color:#B9791B;}
  .badge-ready{background:#EAF6F4;color:var(--mint-deep);}

  /* Diagnostic grid */
  .diag-progress{
    display:flex;align-items:center;gap:10px;margin-bottom:18px;
  }
  .diag-progress .bar{flex:1;height:8px;background:#E7ECF3;border-radius:6px;overflow:hidden;}
  .diag-progress .fill{height:100%;background:linear-gradient(90deg,var(--mint),var(--sun));border-radius:6px;transition:width .25s;}
  .diag-progress .count{font-family:'IBM Plex Sans Arabic';font-size:13px;color:#6B7A99;white-space:nowrap;}

  .letter-stage{
    background:white;border-radius:22px;border:1px solid var(--line);padding:30px 20px;text-align:center;
    margin-bottom:16px;
  }
  .letter-big{
    font-family:'Baloo Bhaijaan 2';font-size:96px;font-weight:700;color:var(--ink);line-height:1;
    margin-bottom:6px;
  }
  .letter-word{color:#6B7A99;font-size:15px;margin-bottom:22px;}
  .rate-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .rate-btn{
    border:1.5px solid var(--line);background:white;border-radius:14px;padding:14px 8px;
    cursor:pointer;font-family:'Tajawal';font-weight:700;font-size:13px;transition:.15s;
  }
  .rate-btn .em{display:block;font-size:24px;margin-bottom:6px;}
  .rate-btn.good:hover, .rate-btn.good.sel{background:#EAF6F4;border-color:var(--mint);color:var(--mint-deep);}
  .rate-btn.mid:hover, .rate-btn.mid.sel{background:#FDF2E3;border-color:var(--sun);color:#B9791B;}
  .rate-btn.bad:hover, .rate-btn.bad.sel{background:#FCEBE8;border-color:var(--coral);color:#C24735;}

  .letters-mini{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
  .mini-chip{
    width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-family:'Baloo Bhaijaan 2';font-size:14px;border:1.5px solid var(--line);color:#B7C0D1;
  }
  .mini-chip.good{background:#EAF6F4;border-color:var(--mint);color:var(--mint-deep);}
  .mini-chip.mid{background:#FDF2E3;border-color:var(--sun);color:#B9791B;}
  .mini-chip.bad{background:#FCEBE8;border-color:var(--coral);color:#C24735;}
  .mini-chip.active{border-color:var(--ink);color:var(--ink);}

  /* Results */
  .result-stat{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 0;border-bottom:1px solid var(--line);
  }
  .result-stat:last-child{border-bottom:none;}
  .result-stat .num{font-size:22px;font-weight:700;}

  .empty{text-align:center;padding:40px 20px;color:#8593AC;}
  .empty .em{font-size:40px;display:block;margin-bottom:10px;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:white;padding:12px 22px;border-radius:12px;
    font-family:'Tajawal';font-weight:700;font-size:14px;z-index:50;
    box-shadow:0 10px 24px rgba(0,0,0,0.2);
  }

  /* Practice / animation */
  @keyframes pulseZone{ 0%,100%{transform:scale(1); opacity:.85;} 50%{transform:scale(1.18); opacity:1;} }
  .pulse-zone{ transform-origin:center; transform-box:fill-box; animation:pulseZone 1.1s ease-in-out infinite; }

  .stage-tabs{display:flex; gap:8px; margin-bottom:16px;}
  .stage-tab{
    flex:1; text-align:center; padding:10px 6px; border-radius:12px; font-size:13px;
    font-family:'Tajawal'; font-weight:700; background:#E7ECF3; color:#8593AC;
  }
  .stage-tab.active{background:var(--mint-deep); color:white;}
  .stage-tab.done{background:#EAF6F4; color:var(--mint-deep);}

  .practice-word{font-family:'Baloo Bhaijaan 2'; font-size:44px; color:var(--ink); margin-bottom:6px;}
  .practice-phrase{font-family:'Baloo Bhaijaan 2'; font-size:30px; color:var(--ink); margin-bottom:6px; line-height:1.5;}

  .icon-btn{
    border:none; border-radius:50%; width:64px; height:64px; font-size:26px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:.15s;
  }
  .icon-btn.mic{background:var(--coral); color:white; box-shadow:0 6px 16px rgba(239,111,91,0.35);}
  .icon-btn.mic.listening{animation:pulseZone 0.8s ease-in-out infinite; background:#C24735;}
  .icon-btn.speak{background:var(--mint-deep); color:white; box-shadow:0 6px 16px rgba(53,126,116,0.3);}
  .icon-row{display:flex; gap:16px; justify-content:center; margin:20px 0 8px;}

  .feedback-flash{
    border-radius:16px; padding:16px; text-align:center; font-family:'Tajawal'; font-weight:700; font-size:16px;
    margin-top:14px; animation:fadeSlide .25s ease;
  }
  @keyframes fadeSlide{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .feedback-flash.ok{background:#EAF6F4; color:var(--mint-deep);}
  .feedback-flash.bad{background:#FCEBE8; color:#C24735;}
  .feedback-flash.skip{background:#F3F4F7; color:#6B7A99;}

  .practice-actions{display:flex; gap:10px; margin-top:16px;}
  .mastered-banner{
    text-align:center; padding:40px 20px; background:linear-gradient(135deg,#EAF6F4,#FDF2E3);
    border-radius:20px;
  }
  .mastered-banner .em{font-size:56px; display:block; margin-bottom:10px;}

  .site-footer{
    text-align:center; margin-top:36px; padding-top:18px; border-top:1px solid var(--line);
    font-family:'IBM Plex Sans Arabic'; font-size:12px; color:#8593AC; line-height:1.9;
  }

  /* Game */
  .stars-bar{
    display:flex; align-items:center; justify-content:space-between;
    background:white; border:1px solid var(--line); border-radius:16px; padding:12px 16px; margin-bottom:16px;
  }
  .stars-bar .stat{display:flex; align-items:center; gap:6px; font-family:'IBM Plex Sans Arabic'; font-weight:600; font-size:14px;}
  .options-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:20px;}
  .option-card{
    background:white; border:2px solid var(--line); border-radius:16px; padding:16px 8px; text-align:center;
    cursor:pointer; transition:.15s;
  }
  .option-card:hover{border-color:var(--mint);}
  .option-card .em{font-size:40px; display:block; margin-bottom:6px;}
  .option-card .lbl{font-size:12px; color:#6B7A99; font-family:'Tajawal';}
  .option-card.correct{background:#EAF6F4; border-color:var(--mint-deep);}
  .option-card.wrong{background:#FCEBE8; border-color:var(--coral);}
  @keyframes starPop{ 0%{transform:scale(0);} 60%{transform:scale(1.3);} 100%{transform:scale(1);} }
  .star-pop{ display:inline-block; animation:starPop .4s ease; }
</style>
</head>
<body>
<div id="app"></div>

<script>
const ARABIC_LETTERS = [
  {ch:'ا', word:'أَسَد'}, {ch:'ب', word:'بَطَّة'}, {ch:'ت', word:'تُفَّاح'}, {ch:'ث', word:'ثَعْلَب'},
  {ch:'ج', word:'جَمَل'}, {ch:'ح', word:'حِصَان'}, {ch:'خ', word:'خُبْز'}, {ch:'د', word:'دُبّ'},
  {ch:'ذ', word:'ذِئْب'}, {ch:'ر', word:'رُمَّان'}, {ch:'ز', word:'زَرَافَة'}, {ch:'س', word:'سَمَك'},
  {ch:'ش', word:'شَمْس'}, {ch:'ص', word:'صَقْر'}, {ch:'ض', word:'ضِفْدَع'}, {ch:'ط', word:'طَائِرَة'},
  {ch:'ظ', word:'ظَبْي'}, {ch:'ع', word:'عَصْفُور'}, {ch:'غ', word:'غَزَال'}, {ch:'ف', word:'فِيل'},
  {ch:'ق', word:'قِطَّة'}, {ch:'ك', word:'كَلْب'}, {ch:'ل', word:'لَيْمُون'}, {ch:'م', word:'مَوْز'},
  {ch:'ن', word:'نَحْلَة'}, {ch:'هـ', word:'هِلَال'}, {ch:'و', word:'وَرْدَة'}, {ch:'ي', word:'يَد'}
];
const AVATAR_COLORS = ['#4FB6A8','#F4B740','#EF6F5B','#9C82C4','#5B8DEF'];

// مخارج الحروف المبسطة (تصنيف تعليمي مبسّط لأغراض التدريب، وليس مرجعاً أكاديمياً دقيقاً)
const ARTICULATION = {
  'ا': {cat:'throat', label:'حلقي', desc:'يخرج من أقصى الحلق مع فتح الفم دون احتكاك.'},
  'ب': {cat:'lips', label:'شفوي', desc:'بإطباق الشفتين معاً ثم فتحهما فجأة مع اهتزاز الصوت.'},
  'ت': {cat:'gum', label:'لثوي', desc:'بوضع طرف اللسان خلف الثنايا العليا ملامساً اللثة.'},
  'ث': {cat:'teeth', label:'بين الأسنان', desc:'بإخراج طرف اللسان قليلاً بين الأسنان العلوية والسفلية.'},
  'ج': {cat:'palate', label:'غاري', desc:'بضم وسط اللسان إلى سقف الحنك الأعلى (الغار).'},
  'ح': {cat:'throat', label:'حلقي', desc:'من وسط الحلق مع احتكاك خفيف وهواء مستمر.'},
  'خ': {cat:'uvula', label:'لهوي', desc:'من أقصى اللسان مع اللهاة، بصوت احتكاكي خشن.'},
  'د': {cat:'gum', label:'لثوي', desc:'بإلصاق طرف اللسان باللثة العليا خلف الثنايا مع اهتزاز الصوت.'},
  'ذ': {cat:'teeth', label:'بين الأسنان', desc:'كالثاء لكن مع اهتزاز الحبال الصوتية (صوت مجهور).'},
  'ر': {cat:'gum', label:'لثوي (تكراري)', desc:'بارتعاش طرف اللسان خلف اللثة العليا بسرعة.'},
  'ز': {cat:'gum', label:'لثوي', desc:'بتقريب طرف اللسان من اللثة مع مجرى هواء ضيق مستمر.'},
  'س': {cat:'gum', label:'لثوي', desc:'كالزاي لكن بدون اهتزاز الصوت (صوت مهموس صفيري).'},
  'ش': {cat:'palate', label:'غاري', desc:'بتقريب وسط اللسان من الحنك الأعلى مع مجرى هواء منتشر.'},
  'ص': {cat:'gum', label:'لثوي مفخم', desc:'كالسين مع تفخيم (رفع أقصى اللسان نحو الحنك الأعلى).'},
  'ض': {cat:'gum', label:'لثوي مفخم', desc:'من حافة اللسان مع الأضراس العليا، بصوت مفخم مجهور.'},
  'ط': {cat:'gum', label:'لثوي مفخم', desc:'كالتاء مع تفخيم ورفع أقصى اللسان.'},
  'ظ': {cat:'teeth', label:'بين الأسنان مفخم', desc:'كالذال مع تفخيم اللسان.'},
  'ع': {cat:'throat', label:'حلقي', desc:'من وسط الحلق بانضغاط خفيف مع اهتزاز الصوت.'},
  'غ': {cat:'uvula', label:'لهوي', desc:'كالخاء لكن مع اهتزاز الحبال الصوتية.'},
  'ف': {cat:'lips', label:'شفوي أسناني', desc:'بوضع الثنايا العليا على باطن الشفة السفلى.'},
  'ق': {cat:'uvula', label:'لهوي', desc:'من أقصى اللسان مع اللهاة، بانطباق كامل ثم انفجار الصوت.'},
  'ك': {cat:'velum', label:'طبقي', desc:'من أقصى اللسان مع سقف الحنك اللين (الطبق).'},
  'ل': {cat:'gum', label:'لثوي جانبي', desc:'بإلصاق طرف اللسان باللثة وخروج الهواء من الجانبين.'},
  'م': {cat:'lips', label:'شفوي أنفي', desc:'بإطباق الشفتين مع خروج الصوت من الأنف.'},
  'ن': {cat:'gum', label:'لثوي أنفي', desc:'بإلصاق طرف اللسان باللثة مع خروج الصوت من الأنف.'},
  'هـ': {cat:'glottal', label:'حنجري', desc:'من الحنجرة مباشرة بهواء خفيف دون احتكاك قوي.'},
  'و': {cat:'lips', label:'شفوي', desc:'بتدوير الشفتين وضمهما قليلاً.'},
  'ي': {cat:'palate', label:'غاري', desc:'برفع وسط اللسان نحو الحنك الأعلى دون التصاق كامل.'}
};
const CAT_META = {
  lips:   {color:'#EF6F5B', pos:{cx:38, cy:92}},
  teeth:  {color:'#F4B740', pos:{cx:52, cy:82}},
  gum:    {color:'#4FB6A8', pos:{cx:66, cy:70}},
  palate: {color:'#9C82C4', pos:{cx:82, cy:56}},
  velum:  {color:'#5B8DEF', pos:{cx:98, cy:48}},
  uvula:  {color:'#357E74', pos:{cx:108, cy:56}},
  throat: {color:'#C24735', pos:{cx:118, cy:78}},
  glottal:{color:'#1E2A47', pos:{cx:126, cy:96}}
};
// جمل قصيرة (كلمتان فأكثر) لمرحلة التدريب الثالثة، تتضمن الكلمة الشاهدة لكل حرف
const SENTENCES = {
  'ا':'الأسد ملك الغابة', 'ب':'البطة تسبح بالماء', 'ت':'التفاح لذيذ', 'ث':'الثعلب يجري بسرعة',
  'ج':'الجمل يمشي بالصحراء', 'ح':'الحصان يجري بقوة', 'خ':'اشتريت خبزاً طازجاً', 'د':'الدب الصغير نائم',
  'ذ':'الذئب يعيش بالغابة', 'ر':'الرمان طعمه حلو', 'ز':'الزرافة رقبتها طويلة', 'س':'السمك يسبح بالبحر',
  'ش':'الشمس مشرقة اليوم', 'ص':'الصقر يطير عالياً', 'ض':'الضفدع يقفز بقوة', 'ط':'الطائرة تطير بالسماء',
  'ظ':'الظبي يجري بخفة', 'ع':'العصفور يغرد صباحاً', 'غ':'الغزال جميل وسريع', 'ف':'الفيل كبير وقوي',
  'ق':'القطة تلعب بالكرة', 'ك':'الكلب يحرس البيت', 'ل':'الليمون طعمه حامض', 'م':'الموز فاكهة مفيدة',
  'ن':'النحلة تصنع العسل', 'هـ':'الهلال يظهر بالليل', 'و':'الوردة رائحتها جميلة', 'ي':'غسلت يدي بالماء'
};
const DIACRITICS = [
  {mark:'\u064E', name:'فتحة'},
  {mark:'\u064F', name:'ضمة'},
  {mark:'\u0650', name:'كسرة'},
  {mark:'\u0652', name:'سكون'}
];
const SESSION_TYPES = [
  {key:'letter', label:'حرف مجرد', icon:'🔤'},
  {key:'diacritics', label:'حرف بالحركات', icon:'🔡'},
  {key:'words', label:'كلمات', icon:'📝'},
  {key:'phrases', label:'جمل', icon:'💬'}
];
// عناصر تقييم الأداء الوظيفي (للاسترشاد العام فقط — راجع النموذج الرسمي المعتمد بمدرستك)
const MOE_ELEMENTS = [
  'التخطيط وتنفيذ خطة التعليم','التنويع في استراتيجيات التدريس',
  'تحليل نتائج المتعلمين وتشخيص مستوياتهم','تنوع أساليب التقويم',
  'توظيف تقنيات ووسائل التعليم','تهيئة البيئة التعليمية والإدارة الصفية',
  'التفاعل مع أولياء الأمور','تحسين نتائج المتعلمين'
];
function sessionItems(type, letters){
  if(type==='letter') return letters.map(ch=>({key:ch, label:ch}));
  if(type==='diacritics') return letters.flatMap(ch=>DIACRITICS.map(d=>({key:ch+'|'+d.mark, label:ch+d.mark, sub:d.name})));
  if(type==='words') return letters.map(ch=>{const li=ARABIC_LETTERS.find(l=>l.ch===ch); return {key:ch, label: li? li.word: ch};});
  if(type==='phrases') return letters.map(ch=>({key:ch, label: SENTENCES[ch]||ch}));
  return [];
}

  if(!gameStats[studentId].letterStats) gameStats[studentId].letterStats = {};
  return gameStats[studentId];

function ensureLetterStat(gs, letter){
  if(!gs.letterStats[letter]) gs.letterStats[letter] = {correct:0, wrong:0, streak:0};
  return gs.letterStats[letter];
}
function levelFor(stars){ return Math.floor(stars/5)+1; }
function wordDifficulty(word){
  const len = normalizeAr(word).replace(/\s/g,'').length;
  if(len<=3) return 'easy';
  if(len<=5) return 'medium';
  return 'hard';
}
// يختار مجموعة كلمات مناسبة لمستوى الطالب الحالي بهذا الحرف (تكيّف تلقائي)
function adaptivePool(letter, gs){
  const all = wordsContaining(letter);
  const base = all.length ? all : WORD_BANK;
  const ls = ensureLetterStat(gs, letter);
  let allowed;
  if(ls.wrong > ls.correct){ allowed = ['easy']; }          // يتعثر: كلمات قصيرة وسهلة فقط
  else if(ls.streak>=3){ allowed = ['medium','hard']; }      // متمكن: كلمات أطول وأصعب
  else{ allowed = ['easy','medium']; }                        // مستوى متوسط افتراضي
  let pool = base.filter(w=>allowed.includes(wordDifficulty(w.word)));
  if(pool.length===0) pool = base;
  return pool;
}

function speak(text){
  try{
    if(!('speechSynthesis' in window)) { showToast('متصفحك لا يدعم النطق الصوتي'); return; }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);

    window.speechSynthesis.speak(u);
  }catch(e){}
}
function normalizeAr(s){
  return (s||'').replace(/[\u064B-\u0652]/g,'').replace(/[^\u0621-\u064A\s]/g,'').trim().replace(/\s+/g,' ');
}
let recognizer=null;
function listenAndCompare(target, onDone){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ onDone({supported:false}); return; }
  try{
    recognizer = new SR();
    recognizer.lang='ar-SA'; recognizer.maxAlternatives=3; recognizer.interimResults=false;
    let handled=false;
    recognizer.onresult = (e)=>{
      handled=true;
      const alts = Array.from(e.results[0]).map(r=>normalizeAr(r.transcript));
      const t = normalizeAr(target);
      const match = alts.some(a=> a===t || a.includes(t) || t.includes(a));
      onDone({supported:true, match, heard:alts[0]});
    };
    recognizer.onerror = ()=>{ if(!handled) onDone({supported:true, error:true}); };
    recognizer.onend = ()=>{ if(!handled) onDone({supported:true, error:true}); };
    recognizer.start();
  }catch(e){ onDone({supported:false}); }
}

function currentStudent(){

function renderDiagnostic(app){
  const stu = currentStudent();
  if(!stu){ state.view='teacher-dashboard'; render(); return; }
  topbar(app, 'تشخيص النطق', stu.name, ()=>{state.view='teacher-dashboard'; render();});

  const total = ARABIC_LETTERS.length;
  const done = Object.keys(state.diagAnswers).length;

  const progWrap=document.createElement('div');
  progWrap.className='diag-progress';
  progWrap.innerHTML=`
    <span class="data count">${done} / ${total}</span>
    <div class="bar"><div class="fill" style="width:${(done/total)*100}%"></div></div>
  `;
  app.appendChild(progWrap);

  const idx = state.diagIndex;
  const letter = ARABIC_LETTERS[idx];
  const existing = state.diagAnswers[letter.ch];

  const stage=document.createElement('div');
  stage.className='letter-stage';
  stage.innerHTML=`
    <div class="letter-big">${letter.ch}</div>
    <div class="letter-word">مثال: ${letter.word}</div>
    <p class="muted" style="margin-bottom:16px;">اطلب من الطالب نطق الحرف والكلمة، ثم سجّل التقييم:</p>
    <div class="rate-btns">
      <div class="rate-btn good ${existing==='good'?'sel':''}" data-r="good"><span class="em">✅</span>نطق سليم</div>
      <div class="rate-btn mid ${existing==='mid'?'sel':''}" data-r="mid"><span class="em">⚠️</span>يحتاج تدريب</div>
      <div class="rate-btn bad ${existing==='bad'?'sel':''}" data-r="bad"><span class="em">❌</span>غير واضح</div>
    </div>
  `;
  stage.querySelectorAll('.rate-btn').forEach(btn=>{
    btn.onclick=()=>{
      state.diagAnswers[letter.ch]=btn.dataset.r;
      if(idx < total-1){
        state.diagIndex = idx+1;
      }
      render();
    };
  });
  app.appendChild(stage);

  // mini nav of all letters
  const mini=document.createElement('div');
  mini.className='card';
  mini.innerHTML=`<h3 style="font-size:14px; margin-bottom:8px;">كل الحروف</h3>`;
  const chips=document.createElement('div');
  chips.className='letters-mini';
  ARABIC_LETTERS.forEach((l,i)=>{
    const c=document.createElement('div');
    const st = state.diagAnswers[l.ch];
    c.className='mini-chip' + (st?(' '+st):'') + (i===idx?' active':'');
    c.textContent=l.ch;
    c.onclick=()=>{ state.diagIndex=i; render(); };
    chips.appendChild(c);
  });
  mini.appendChild(chips);
  app.appendChild(mini);

  // finish button
  if(done>=total){
    const finishWrap=document.createElement('div');
    finishWrap.style.marginTop='14px';
    const btn=document.createElement('button');
    btn.className='btn btn-primary btn-block';
    btn.textContent='إنهاء التشخيص وعرض النتيجة';
    btn.onclick=async ()=>{
      const weak = Object.entries(state.diagAnswers).filter(([ch,r])=>r!=='good').map(([ch])=>ch);
      stu.diagnostic = { complete:true, answers:{...state.diagAnswers}, weakLetters:weak, date:Date.now() };
      await saveStudents();
      state.view='diag-result';
      render();
    };
    finishWrap.appendChild(btn);
    app.appendChild(finishWrap);
  }
}

function renderGame(app){
  const stu = currentStudent();
  if(!stu || !state.gameLetters){ state.view='student-menu'; render(); return; }
  const gs = ensureGameStat(stu.id);

  if(state.gameLetterIdx >= state.gameLetters.length){
    topbar(app, 'رائع!', stu.name, ()=>{state.view='student-menu'; render();});
    const banner=document.createElement('div');
    banner.className='mastered-banner';
    banner.innerHTML=`<span class="em">🌟</span><h2 style="margin:0 0 6px;">أنهيت جولة اللعبة!</h2><p class="muted">جمعت ${gs.stars} نجمة حتى الآن — المستوى ${levelFor(gs.stars)}</p>`;
    app.appendChild(banner);
    const btn=document.createElement('button');
    btn.className='btn btn-primary btn-block'; btn.style.marginTop='16px';
    btn.textContent='العودة للقائمة';
    btn.onclick=()=>{ state.view='student-menu'; render(); };
    app.appendChild(btn);
    return;
  }

  const letter = state.gameLetters[state.gameLetterIdx];
  topbar(app, 'استمع واختر', `حرف ${letter}`, ()=>{state.view='student-menu'; render();});

  const starsBar=document.createElement('div');
  starsBar.className='stars-bar';
  starsBar.innerHTML=`
    <div class="stat">⭐ ${gs.stars} نجمة</div>
    <div class="stat">🏆 المستوى ${levelFor(gs.stars)}</div>
  `;
  app.appendChild(starsBar);

  // pick target + distractors (تكيّف تلقائي حسب أداء الطالب بهذا الحرف)
  let pool = adaptivePool(letter, gs);
  let target = pool[Math.floor(Math.random()*pool.length)];
  if(state.gameLastWord && pool.length>1){
    while(target.word===state.gameLastWord) target = pool[Math.floor(Math.random()*pool.length)];
  }
  state.gameLastWord = target.word;
  const others = shuffle(WORD_BANK.filter(w=>w.word!==target.word)).slice(0,2);
  const options = shuffle([target, ...others]);

  const stage=document.createElement('div');
  stage.className='letter-stage';
  stage.innerHTML=`
    <p class="muted" style="margin-bottom:14px;">${CAT_LABELS[target.cat]} — استمع واختر الصورة الصحيحة</p>
    <div class="icon-row"><button class="icon-btn speak" id="playBtn">🔊</button></div>
    <div class="options-grid" id="optsGrid"></div>
    <div id="gameFeedback"></div>
  `;
  app.appendChild(stage);

  const playSound = ()=> speak(target.word);
  stage.querySelector('#playBtn').onclick = playSound;
  setTimeout(playSound, 300);

  const ls = ensureLetterStat(gs, letter);
  const grid = stage.querySelector('#optsGrid');
  options.forEach(opt=>{
    const card=document.createElement('div');
    card.className='option-card';
    card.innerHTML=`<span class="em">${opt.emoji}</span><span class="lbl">${opt.word}</span>`;
    card.onclick=async ()=>{
      grid.querySelectorAll('.option-card').forEach(c=>c.style.pointerEvents='none');
      const fb = stage.querySelector('#gameFeedback');
      if(opt.word===target.word){
        card.classList.add('correct');
        gs.stars += 1; gs.roundsPlayed += 1;
        ls.correct += 1; ls.streak += 1;
        await saveGameStats();
        fb.innerHTML = `<div class="feedback-flash ok"><span class="star-pop">⭐</span> أحسنت! نطق ممتاز</div>`;
        setTimeout(()=>{
          state.gameLetterIdx += 1;
          render();
        }, 1100);
      }else{
        card.classList.add('wrong');
        gs.roundsPlayed += 1;
        ls.wrong += 1; ls.streak = 0;
        await saveGameStats();
        fb.innerHTML = `<div class="feedback-flash bad">🔁 حاول مرة أخرى، استمع جيداً</div>`;
        setTimeout(()=>{ render(); }, 1300);
      }
    };
    grid.appendChild(card);
  });

  const skipBtn=document.createElement('button');
  skipBtn.className='btn btn-soft btn-block';
  skipBtn.style.marginTop='14px';
  skipBtn.textContent='⏭️ تجاوز';
  skipBtn.onclick=()=>{ state.gameLetterIdx += 1; render(); };
  app.appendChild(skipBtn);
}

function renderPractice(app){
  const stu = currentStudent();
  if(!stu || !state.practiceLetters){ state.view='student-select'; render(); return; }
  if(state.practiceIdx >= state.practiceLetters.length){
    topbar(app, 'أحسنت!', stu.name, ()=>{state.view='home'; render();});
    const banner=document.createElement('div');
    banner.className='mastered-banner';
    banner.innerHTML=`<span class="em">🏆</span><h2 style="margin:0 0 6px;">أنهيت جلسة التمرين!</h2><p class="muted">أحسنت يا ${stu.name}، استمر بالتدريب يومياً</p>`;
    app.appendChild(banner);
    const btn=document.createElement('button');
    btn.className='btn btn-primary btn-block'; btn.style.marginTop='16px';
    btn.textContent='العودة للرئيسية';
    btn.onclick=()=>{ state.view='home'; render(); };
    app.appendChild(btn);
    return;
  }

  const ch = state.practiceLetters[state.practiceIdx];
  const letterInfo = ARABIC_LETTERS.find(l=>l.ch===ch);
  const prog = ensureProgress(stu.id, ch);
  const stage = state.practiceStage;

  topbar(app, 'جلسة التمرين', `${stu.name} — حرف ${ch}`, ()=>{state.view='student-select'; render();});

  const tabs=document.createElement('div');
  tabs.className='stage-tabs';
  const stages=[['letter','الحرف'],['word','كلمة'],['phrase','جملة']];
  tabs.innerHTML = stages.map(([key,label])=>{
    let cls='stage-tab';
    if(key===stage) cls+=' active';
    else if(prog[key]==='pass') cls+=' done';
    return `<div class="${cls}">${label}</div>`;
  }).join('');
  app.appendChild(tabs);

  const stageEl=document.createElement('div');
  stageEl.className='letter-stage';

  let target='', display='';
  if(stage==='letter'){ target=ch; display=`<div class="letter-big">${ch}</div>`; }
  else if(stage==='word'){ target=letterInfo.word; display=`<div class="practice-word">${letterInfo.word}</div>`; }
  else { target=SENTENCES[ch]||letterInfo.word; display=`<div class="practice-phrase">${target}</div>`; }

  stageEl.innerHTML = `
    ${display}
    ${mouthSVG(ch, true)}
    <div class="icon-row">
      <button class="icon-btn speak" id="speakBtn" title="استمع للنطق الصحيح">🔊</button>
      ${stage!=='letter' ? '<button class="icon-btn mic" id="micBtn" title="تحدث الآن">🎙️</button>' : ''}
    </div>
    <p class="muted">${stage==='letter' ? 'استمع للنطق الصحيح، ثم اطلب من المعلم تقييم نطقك' : 'اضغط 🔊 للاستماع، ثم 🎙️ لتحاول النطق'}</p>
    <div id="feedbackBox"></div>
  `;
  app.appendChild(stageEl);

  stageEl.querySelector('#speakBtn').onclick=()=>speak(target);

  function showFeedback(kind, msg, onNext){
    const box=stageEl.querySelector('#feedbackBox');
    box.innerHTML = `<div class="feedback-flash ${kind}">${msg}</div>`;
    if(onNext) setTimeout(onNext, 1200);
  }

  async function advance(passed){
    prog[stage] = passed ? 'pass' : 'retry';
    await saveProgress();
    if(passed){
      if(stage==='letter'){ state.practiceStage='word'; }
      else if(stage==='word'){ state.practiceStage='phrase'; }
      else{
        prog.mastered=true; await saveProgress();
        state.practiceIdx += 1;
        state.practiceStage='letter';
      }
    }
    render();
  }

  const micBtn = stageEl.querySelector('#micBtn');
  if(micBtn){
    micBtn.onclick=()=>{
      micBtn.classList.add('listening');
      listenAndCompare(target, (res)=>{
        micBtn.classList.remove('listening');
        if(!res.supported){
          showFeedback('skip', 'ميكروفون التعرف الصوتي غير مدعوم بهذا المتصفح — استخدم أزرار التقييم اليدوي');
          return;
        }
        if(res.error){
          showFeedback('bad', 'لم أسمع بوضوح، حاول مرة أخرى 🎤');
          return;
        }
        if(res.match){
          showFeedback('ok', '✅ أحسنت! نطق صحيح', ()=>advance(true));
        }else{
          showFeedback('bad', '🔁 حاول مرة أخرى، أنت تقدر!');
        }
      });
    };
  }

  // Manual controls (teacher-assisted confirmation, always available)
  const manual=document.createElement('div');
  manual.className='practice-actions';
  manual.innerHTML = `
    <button class="btn btn-soft" id="manOk" style="flex:1;">✅ صحيح</button>
    <button class="btn btn-soft" id="manRetry" style="flex:1;">🔁 إعادة</button>
    <button class="btn btn-soft" id="manSkip" style="flex:1;">⏭️ تجاوز</button>
  `;
  app.appendChild(manual);
  manual.querySelector('#manOk').onclick=()=>showFeedback('ok','✅ أحسنت!',()=>advance(true));
  manual.querySelector('#manRetry').onclick=()=>showFeedback('bad','🔁 لا بأس، حاول مرة أخرى');
  manual.querySelector('#manSkip').onclick=()=>{
    if(stage==='letter'){ state.practiceStage='word'; }
    else if(stage==='word'){ state.practiceStage='phrase'; }
    else{ state.practiceIdx += 1; state.practiceStage='letter'; }
    showFeedback('skip','⏭️ تم التجاوز', ()=>render());
  };
}

function renderSessionRun(app){
  const stu = currentStudent();
  const sess = state.activeSession;
  if(!stu || !sess){ state.view='teacher-dashboard'; render(); return; }
  topbar(app, sess.typeLabel, stu.name, ()=>{state.view='session-setup'; render();});

  const total = sess.items.length;
  const done = sess.items.filter(i=>i.rating).length;
  const progWrap=document.createElement('div');
  progWrap.className='diag-progress';
  progWrap.innerHTML=`<span class="data count">${done} / ${total}</span><div class="bar"><div class="fill" style="width:${(done/total)*100}%"></div></div>`;
  app.appendChild(progWrap);

  const it = sess.items[sess.idx];
  const stage=document.createElement('div');
  stage.className='letter-stage';
  const bigStyle = sess.type==='letter' || sess.type==='diacritics' ? 'letter-big' : (sess.type==='words'?'practice-word':'practice-phrase');
  stage.innerHTML=`
    <div class="${bigStyle}">${it.label}</div>
    ${it.sub? `<div class="letter-word">${it.sub}</div>`:''}
    <div class="icon-row" style="margin-top:6px;"><button class="icon-btn speak" id="speakBtn">🔊</button></div>
    <div class="rate-btns" style="margin-top:18px;">
      <div class="rate-btn good ${it.rating==='good'?'sel':''}" data-r="good"><span class="em">✅</span>نطق سليم</div>
      <div class="rate-btn mid ${it.rating==='mid'?'sel':''}" data-r="mid"><span class="em">⚠️</span>يحتاج تدريب</div>
      <div class="rate-btn bad ${it.rating==='bad'?'sel':''}" data-r="bad"><span class="em">❌</span>غير واضح</div>
    </div>
  `;
  stage.querySelector('#speakBtn').onclick=()=>speak(it.label.replace(/[\u064B-\u0652]/g,''));
  stage.querySelectorAll('.rate-btn[data-r]').forEach(btn=>{
    btn.onclick=()=>{
      it.rating = btn.dataset.r;
      if(sess.idx < total-1) sess.idx++;
      render();
    };
  });
  app.appendChild(stage);

  const nav=document.createElement('div');
  nav.style.cssText='display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;';
  sess.items.forEach((x,i)=>{
    const c=document.createElement('div');
    c.className='mini-chip' + (x.rating?(' '+x.rating):'') + (i===sess.idx?' active':'');
    c.style.cssText='min-width:30px;cursor:pointer;';
    c.textContent = x.label.length>2? (i+1) : x.label;
    c.onclick=()=>{ sess.idx=i; render(); };
    nav.appendChild(c);
  });
  app.appendChild(nav);

  if(done>=total){
    const finishBtn=document.createElement('button');
    finishBtn.className='btn btn-primary btn-block';
    finishBtn.style.marginTop='16px';
    finishBtn.textContent='إنهاء الجلسة وتوليد التوصيات';
    finishBtn.onclick=async ()=>{
      finishBtn.disabled=true; finishBtn.textContent='...جاري المعالجة';
      let ai = {recommendation:'', evidence:''};
      try{ ai = await getSessionAISummary(stu, sess); }
      catch(e){ ai = {recommendation:'تعذّر توليد التوصية تلقائياً — يمكنك كتابتها يدوياً.', evidence:'تعذّر توليد اقتراح الشاهد تلقائياً — يمكنك كتابته يدوياً.'}; }
      const record = {
        id: sess.id, studentId: stu.id, studentName: stu.name, date: sess.date,
        type: sess.type, typeLabel: sess.typeLabel, items: sess.items,
        recommendation: ai.recommendation, evidence: ai.evidence, manualNote:''
      };
      sessionsData.push(record);
      await saveSessions();
      state.lastSessionId = record.id;
      state.view='session-summary';
      render();
    };
    app.appendChild(finishBtn);
  }
}

function ratingCounts(items){
  const c={good:0,mid:0,bad:0};
  items.forEach(i=>{ if(i.rating) c[i.rating]++; });
  return c;
}

      row.querySelector('input').onchange = async (e)=>{

        data.done[i] = e.target.checked;
        await saveHomeTraining();
        renderHomeList();
      };
      listWrap.appendChild(row);
    });
  }
  renderHomeList();

  const genBtn=document.createElement('button');
  genBtn.className='btn btn-soft btn-block';
  genBtn.style.marginTop='12px';
  genBtn.textContent = existing ? '🔄 تحديث الخطة' : '✨ توليد خطة مخصصة';
  genBtn.onclick = async ()=>{
    genBtn.disabled=true; genBtn.textContent='...جاري التوليد';
    try{
      const activities = await generateHomeTraining(stu);
      homeTrainingData[stu.id] = { activities, done: [] };
      await saveHomeTraining();
      renderHomeList();
      genBtn.textContent='🔄 تحديث الخطة';
    }catch(e){
      showToast('تعذّر توليد الخطة الآن، حاول مرة أخرى');
      genBtn.textContent='✨ توليد خطة مخصصة';
    }
    genBtn.disabled=false;
  };
  homeCard.appendChild(genBtn);
  app.appendChild(homeCard);
}

(async function init(){
  await loadStudents();
  await loadVideos();
  await loadProgress();
  await loadSessions();
  await loadGameStats();
  await loadHomeTraining();
  render();
})();
