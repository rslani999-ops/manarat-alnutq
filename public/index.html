<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منارة النطق</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Tajawal', sans-serif;
            background: #EFF5FB;
            color: #1E2A47;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #app {
            max-width: 960px;
            margin: 0 auto;
            padding: 20px 16px 40px;
            flex: 1;
            width: 100%;
        }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 4px 24px;
            flex-wrap: wrap;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        .brand .mark {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #4FB6A8, #357E74);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            box-shadow: 0 4px 10px rgba(79, 182, 168, 0.35);
        }
        .brand h1 {
            font-size: 20px;
            font-weight: 700;
        }
        .brand span {
            display: block;
            font-size: 11px;
            color: #6B7A99;
            margin-top: -2px;
        }
        .btn {
            border: none;
            border-radius: 12px;
            padding: 10px 18px;
            font-family: 'Tajawal', sans-serif;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
            transition: filter .15s, transform .15s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn-primary {
            background: #357E74;
            color: white;
        }
        .btn-primary:hover {
            filter: brightness(1.08);
        }
        .btn-soft {
            background: #EAF6F4;
            color: #357E74;
        }
        .btn-soft:hover {
            background: #DDF0ED;
        }
        .btn-block {
            width: 100%;
        }
        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 8px;
        }
        .card {
            background: white;
            border-radius: 18px;
            border: 1px solid rgba(30, 42, 71, 0.10);
            padding: 20px;
            margin-bottom: 16px;
        }
        .card h2 {
            font-family: 'Baloo Bhaijaan 2', sans-serif;
            font-size: 22px;
            margin-bottom: 8px;
        }
        .card h3 {
            font-size: 17px;
            margin: 0 0 8px;
            font-family: 'Baloo Bhaijaan 2', sans-serif;
        }
        .muted {
            color: #6B7A99;
            font-size: 13px;
        }
        .auth-form {
            max-width: 400px;
            margin: 20px auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(30, 42, 71, 0.10);
        }
        .auth-form h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .auth-form input,
        .auth-form select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1.5px solid rgba(30, 42, 71, 0.10);
            font-family: 'Tajawal', sans-serif;
            font-size: 15px;
            background: #FBFDFE;
            margin-bottom: 12px;
        }
        .auth-form input:focus,
        .auth-form select:focus {
            outline: none;
            border-color: #4FB6A8;
        }
        .auth-toggle {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            color: #5B6A88;
        }
        .auth-toggle span {
            color: #357E74;
            cursor: pointer;
            font-weight: 700;
            text-decoration: underline;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1E2A47;
            color: white;
            padding: 12px 22px;
            border-radius: 12px;
            font-family: 'Tajawal', sans-serif;
            font-weight: 700;
            font-size: 14px;
            z-index: 100;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.2);
        }
        .nav-btns {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn-nav {
            border: none;
            background: white;
            color: #1E2A47;
            padding: 8px 14px;
            border-radius: 10px;
            font-family: 'Tajawal', sans-serif;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid rgba(30, 42, 71, 0.10);
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }
        .btn-nav:hover {
            background: #F5F8FC;
        }
        footer {
            background: white;
            border-top: 1px solid rgba(30, 42, 71, 0.10);
            text-align: center;
            padding: 16px;
            font-size: 13px;
            color: #6B7A99;
            margin-top: auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px 20px;
        }
        footer a {
            color: #357E74;
            text-decoration: none;
            font-weight: 700;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <footer>
        <span>© 2025 منارة النطق - جميع الحقوق محفوظة</span>
        <span>تطوير: <a href="#">الأستاذ محمد سويد العنزي</a></span>
        <span><a href="#">سياسة الخصوصية</a> | <a href="#">اتصل بنا</a></span>
    </footer>

    <script type="module">
        // ============================================================
        //  منارة النطق - التطبيق الكامل (نسخة مستقلة)
        // ============================================================

        // ---- Firebase Import ----
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import {
            getAuth,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            onAuthStateChanged,
            signOut,
            sendPasswordResetEmail
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
        import {
            getFirestore,
            setDoc,
            doc,
            getDoc,
            updateDoc,
            collection,
            addDoc,
            getDocs,
            query,
            where,
            orderBy
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

        // ---- Firebase Config ----
        const firebaseConfig = {
            apiKey: "AIzaSyDTst5UKgNJ6ThVOAVHOG3JoWfEvUp1asw",
            authDomain: "manarat-alnutq.firebaseapp.com",
            databaseURL: "https://manarat-alnutq-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "manarat-alnutq",
            storageBucket: "manarat-alnutq.firebasestorage.app",
            messagingSenderId: "543101731444",
            appId: "1:543101731444:web:35a8daf145603c66978721",
            measurementId: "G-ZFKWLDT384"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ---- الحالة العامة ----
        let state = {
            view: 'home',
            user: null,
            role: null,
            myStudents: [],
            freeStudents: [],
            currentStudent: null,
            diagEval: {},
            currentSession: null,
            comprehensive: {
                hearing: 'normal',
                hearingAid: 'none',
                vision: 'normal',
                movement: 'none',
                attention: 'stable',
                comprehension: 'normal',
                physical: 'normal',
                psychological: 'stable',
                scans: 'none',
                surgeries: 'none',
                scanDetails: '',
                surgeryDetails: ''
            }
        };

        let toastTimer = null;

        function showToast(msg) {
            const t = document.createElement('div');
            t.className = 'toast';
            t.textContent = msg;
            document.body.appendChild(t);
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.remove(), 2500);
        }

        // ---- بيانات ثابتة ----
        const ALL_LETTERS = ['أ', 'ب', 'ت', 'ث', 'ج', 'ح', 'خ', 'د', 'ذ', 'ر', 'ز', 'س', 'ش', 'ص', 'ض', 'ط', 'ظ', 'ع', 'غ', 'ف',
            'ق', 'ك', 'ل', 'م', 'ن', 'هـ', 'و', 'ي'
        ];
        const FOOD_ITEMS = ['تفاحة', 'موزة', 'برتقالة', 'عنب', 'تمر', 'خبز', 'حليب', 'ماء'];

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ar-SA';
                utterance.rate = 0.8;
                window.speechSynthesis.speak(utterance);
            }
        }
        window.speakText = speakText;

        // ---- دوال العرض الرئيسية ----
        function render() {
            const appDiv = document.getElementById('app');
            appDiv.innerHTML = '';
            if (state.view === 'home') renderHome(appDiv);
            else if (state.view === 'auth') renderAuth(appDiv);
            else if (state.view === 'register') renderRegister(appDiv);
            else if (state.view === 'reset-password') renderResetPassword(appDiv);
            else if (state.view === 'teacher-dashboard') renderTeacherDashboard(appDiv);
            else if (state.view === 'diagnostic-session') renderDiagnosticSession(appDiv);
            else if (state.view === 'student-menu') renderStudentMenu(appDiv);
            else if (state.view === 'speech-sessions') renderSpeechSessions(appDiv);
            else if (state.view === 'single-session') renderSingleSession(appDiv);
            else if (state.view === 'iep-session') renderIEPSession(appDiv);
            else if (state.view === 'food-menu') renderFoodMenu(appDiv);
            else if (state.view === 'letter-display') renderLetterDisplay(appDiv);
            else {
                appDiv.innerHTML = `<div class="card"><h3>صفحة قيد التطوير</h3><p class="muted">عذراً، هذه الصفحة غير متاحة حالياً.</p></div>`;
            }
        }

        // ---- شريط الأعلى ----
        function renderTopbar(appContainer, title, sub, onBack) {
            const bar = document.createElement('div');
            bar.className = 'topbar';
            let userStatus = state.user ?
                `<span style="font-size:12px;color:var(--mint-deep, #357E74);">(${state.role === 'teacher' ? 'معلم' : state.role === 'admin' ? 'مدير' : 'طالب'})</span>` :
                '';

            bar.innerHTML = `
                <div class="brand" id="brandHome">
                    <div class="mark">🎙️</div>
                    <div><h1>${title || 'منارة النطق'} ${userStatus}</h1><span>${sub || 'المنصة التدريبية المباشرة'}</span></div>
                </div>
                <div class="nav-btns" id="navActions"></div>
            `;

            bar.querySelector('#brandHome').onclick = () => { state.view = 'home';
                render(); };
            const actions = bar.querySelector('#navActions');

            if (onBack) {
                const btnBack = document.createElement('button');
                btnBack.className = 'btn-nav';
                btnBack.innerHTML = 'رجوع ←';
                btnBack.onclick = onBack;
                actions.appendChild(btnBack);
            }

            if (state.user) {
                const btnDashboard = document.createElement('button');
                btnDashboard.className = 'btn-nav';
                btnDashboard.textContent = state.role === 'teacher' || state.role === 'admin' ? 'لوحتي' : 'صفحتي الجلسات';
                btnDashboard.onclick = () => {
                    state.view = state.role === 'teacher' || state.role === 'admin' ? 'teacher-dashboard' : 'student-menu';
                    render();
                };
                actions.appendChild(btnDashboard);

                const btnLogout = document.createElement('button');
                btnLogout.className = 'btn-nav';
                btnLogout.style.color = '#EF6F5B';
                btnLogout.textContent = 'خروج';
                btnLogout.onclick = async () => {
                    try {
                        await signOut(auth);
                        state.user = null;
                        state.role = null;
                        state.currentStudent = null;
                        state.myStudents = [];
                        state.freeStudents = [];
                        state.view = 'home';
                        showToast('تم تسجيل الخروج بنجاح');
                        render();
                    } catch (e) { showToast('خطأ أثناء خروج الحساب'); }
                };
                actions.appendChild(btnLogout);
            } else {
                const btnLogin = document.createElement('button');
                btnLogin.className = 'btn-nav';
                btnLogin.textContent = 'تسجيل الدخول';
                btnLogin.onclick = () => { state.view = 'auth';
                    render(); };
                actions.appendChild(btnLogin);
            }

            appContainer.appendChild(bar);
        }

        // ---- الصفحة الرئيسية ----
        function renderHome(appDiv) {
            renderTopbar(appDiv, 'منارة النطق', 'المنصة التدريبية المباشرة');

            const banner = document.createElement('div');
            banner.className = 'card';
            banner.style.background = 'linear-gradient(135deg, #357E74, #4FB6A8)';
            banner.style.color = 'white';
            banner.innerHTML = `
                <h2 style="margin-top:0;">منصة تشخيص وتدريب النطق الشاملة</h2>
                <p>تشخيص 28 حرفاً مع الصوت والصورة وإدارة الجلسات الأسبوعية العلاجية المباشرة والخطة الفردية (IEP).</p>
                ${!state.user ? '<button class="btn btn-soft" id="btnAuthHome" style="color:#357E74;">تسجيل الدخول / إنشاء حساب</button>' : ''}
            `;
            appDiv.appendChild(banner);
            if (!state.user) {
                banner.querySelector('#btnAuthHome').onclick = () => { state.view = 'auth';
                    render(); };
            }

            const grid = document.createElement('div');
            grid.className = 'grid-2';
            grid.innerHTML = `
                <div class="card" style="cursor:pointer;" id="goFood">
                    <h3>🍎 التدريب على الأطعمة</h3>
                    <p class="muted">قوائم المسميات التفاعلية المناسبة لجلسات التسمية والتعزيز.</p>
                    <button class="btn btn-soft btn-sm">استكشف القائمة العامة</button>
                </div>
                <div class="card" style="cursor:pointer;" id="goLetters">
                    <h3>🔤 الحروف الأبجدية</h3>
                    <p class="muted">عرض جميع الحروف مع الصور التوضيحية.</p>
                    <button class="btn btn-soft btn-sm">عرض الحروف</button>
                </div>
            `;
            appDiv.appendChild(grid);
            grid.querySelector('#goFood').onclick = () => { state.view = 'food-menu';
                render(); };
            grid.querySelector('#goLetters').onclick = () => { state.view = 'letter-display';
                render(); };
        }

        // ---- صفحة تسجيل الدخول ----
        function renderAuth(appDiv) {
            renderTopbar(appDiv, 'تسجيل الدخول', '', () => { state.view = 'home';
                render(); });
            const card = document.createElement('div');
            card.className = 'auth-form';
            card.innerHTML = `
                <h2>تسجيل الدخول</h2>
                <input type="email" id="email" placeholder="البريد الإلكتروني">
                <input type="password" id="password" placeholder="كلمة المرور">
                <button class="btn btn-primary btn-block" id="loginBtn">دخول</button>
                <div style="display:flex;justify-content:space-between;margin-top:15px;" class="auth-toggle">
                    <span id="toRegister">إنشاء حساب جديد</span>
                    <span id="toReset">نسيت كلمة المرور؟</span>
                </div>
            `;
            card.querySelector('#loginBtn').onclick = async () => {
                try {
                    const email = document.getElementById('email').value.trim();
                    const pass = document.getElementById('password').value;
                    if (!email || !pass) return showToast('يرجى إدخال البريد وكلمة المرور');
                    const res = await signInWithEmailAndPassword(auth, email, pass);
                    state.user = res.user;
                    await fetchUserData(res.user.uid);
                } catch (e) { showToast('خطأ في بيانات الدخول'); }
            };
            card.querySelector('#toRegister').onclick = () => { state.view = 'register';
                render(); };
            card.querySelector('#toReset').onclick = () => { state.view = 'reset-password';
                render(); };
            appDiv.appendChild(card);
        }

        // ---- صفحة التسجيل ----
        function renderRegister(appDiv) {
            renderTopbar(appDiv, 'إنشاء حساب', 'انضم للمنصة كمعلم أو طالب', () => { state.view = 'auth';
                render(); });
            const card = document.createElement('div');
            card.className = 'auth-form';
            card.innerHTML = `
                <h2>حساب جديد</h2>
                <input type="text" id="fullName" placeholder="الاسم الكامل">
                <input type="email" id="email" placeholder="البريد الإلكتروني">
                <input type="password" id="password" placeholder="كلمة المرور">
                <select id="role">
                    <option value="student">طالب</option>
                    <option value="teacher">معلم</option>
                </select>
                <button class="btn btn-primary btn-block" id="regBtn">تسجيل الحساب</button>
            `;
            card.querySelector('#regBtn').onclick = async () => {
                const name = document.getElementById('fullName').value.trim();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const role = document.getElementById('role').value;
                if (!email || !password) return showToast('يرجى ملء جميع الحقول المطلوبة');
                try {
                    const res = await createUserWithEmailAndPassword(auth, email, password);
                    await setDoc(doc(db, "users", res.user.uid), {
                        fullName: name || email,
                        email: email,
                        role: role,
                        teacherId: null,
                        diagnostic: {}
                    });
                    state.user = res.user;
                    state.role = role;
                    state.view = role === 'teacher' ? 'teacher-dashboard' : 'student-menu';
                    showToast('تم إنشاء الحساب بنجاح');
                    if (role === 'teacher') await fetchTeacherStudents();
                    else render();
                } catch (e) { showToast('فشل التسجيل: كلمة المرور ضعيفة أو البريد مستخدم'); }
            };
            appDiv.appendChild(card);
        }

        // ---- صفحة استعادة كلمة المرور ----
        function renderResetPassword(appDiv) {
            renderTopbar(appDiv, 'استعادة كلمة المرور', '', () => { state.view = 'auth';
                render(); });
            const card = document.createElement('div');
            card.className = 'auth-form';
            card.innerHTML = `
                <h2>نسيت كلمة المرور</h2>
                <p class="muted" style="text-align:center;">أدخل بريدك الإلكتروني لإرسال رابط إعادة تعيين كلمة المرور.</p>
                <input type="email" id="resetEmail" placeholder="البريد الإلكتروني">
                <button class="btn btn-primary btn-block" id="resetBtn">إرسال رابط إعادة التعيين</button>
                <div class="auth-toggle" style="margin-top:15px;"><span id="backToLogin">العودة لتسجيل الدخول</span></div>
            `;
            card.querySelector('#resetBtn').onclick = async () => {
                const email = document.getElementById('resetEmail').value.trim();
                if (!email) return showToast('يرجى كتابة البريد الإلكتروني');
                try {
                    await sendPasswordResetEmail(auth, email);
                    showToast('تم إرسال رابط إعادة التعيين لبريدك الإلكتروني');
                    state.view = 'auth';
                    render();
                } catch (e) { showToast('تعذر الإرسال: تأكد من صحة البريد الإلكتروني'); }
            };
            card.querySelector('#backToLogin').onclick = () => { state.view = 'auth';
                render(); };
            appDiv.appendChild(card);
        }

        // ---- جلب بيانات المستخدم ----
        async function fetchUserData(uid) {
            try {
                const uDoc = await getDoc(doc(db, "users", uid));
                if (uDoc.exists()) {
                    const uData = uDoc.data();
                    state.role = uData.role;
                    if (uData.comprehensive) state.comprehensive = uData.comprehensive;
                    if (state.role === 'teacher' || state.role === 'admin') {
                        state.view = 'teacher-dashboard';
                        await fetchTeacherStudents();
                    } else {
                        state.currentStudent = { id: uid, ...uData };
                        state.view = 'student-menu';
                        render();
                    }
                }
            } catch (e) { showToast('خطأ في جلب بيانات المستخدم'); }
        }

        // ---- جلب طلاب المعلم ----
        async function fetchTeacherStudents() {
            if (!state.user) return;
            try {
                const qStudents = query(collection(db, "users"), where("role", "==", "student"));
                const snap = await getDocs(qStudents);
                state.myStudents = [];
                state.freeStudents = [];
                snap.forEach(d => {
                    const data = d.data();
                    const studentObj = { id: d.id, ...data };
                    if (data.teacherId === state.user.uid) state.myStudents.push(studentObj);
                    else if (!data.teacherId) state.freeStudents.push(studentObj);
                });
                render();
            } catch (e) { showToast('خطأ في تحميل بيانات الطلاب'); }
        }

        // ---- لوحة المعلم ----
        function renderTeacherDashboard(appDiv) {
            renderTopbar(appDiv, 'لوحة المعلم الخاصة', 'إدارة الطلاب والتشخيص والجلسات');

            const actCard = document.createElement('div');
            actCard.className = 'card';
            actCard.innerHTML = `
                <h3>الجلسات والتقييم السحابي</h3>
                <p class="muted">الوصول لتقارير جلسات النطق والخطة الفردية (IEP).</p>
                <div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;">
                    <button class="btn btn-primary btn-sm" id="btnSessions">سجل الجلسات السحابي</button>
                    <button class="btn btn-soft btn-sm" id="btnIEP">إدارة الخطة IEP والتقرير الشامل</button>
                </div>
            `;
            appDiv.appendChild(actCard);

            actCard.querySelector('#btnSessions').onclick = () => {
                if (!state.currentStudent && state.myStudents.length > 0) state.currentStudent = state.myStudents[0];
                state.view = 'speech-sessions';
                render();
            };
            actCard.querySelector('#btnIEP').onclick = () => {
                if (!state.currentStudent && state.myStudents.length > 0) state.currentStudent = state.myStudents[0];
                state.view = 'iep-session';
                render();
            };

            // قائمة الطلاب
            const myCard = document.createElement('div');
            myCard.className = 'card';
            myCard.innerHTML = '<h3>قائمة طلابك المضافين</h3>';
            if (state.myStudents.length === 0) {

        window.claimStudent = async function(studentId) {
            try {
                const ref = doc(db, "users", studentId);
                const snap = await getDoc(ref);
                const data = snap.data();
                if (snap.exists() && data.teacherId && data.teacherId !== state.user.uid) {
                    showToast('عذراً! هذا الطالب مرتبط بمعلم آخر بالفعل');
                    await fetchTeacherStudents();
                    return;
                }
                await updateDoc(ref, { teacherId: state.user.uid });
                showToast('تمت إضافة الطالب بنجاح');
                await fetchTeacherStudents();
            } catch (e) { showToast('فشل في إضافة الطالب'); }
        };

            try {
                await updateDoc(doc(db, "users", studentId), { teacherId: null });

            const diag = studentData.diagnostic || {};

            const passedLetters = ALL_LETTERS.filter(l => diag[l] === 'passed');
            const needLetters = ALL_LETTERS.filter(l => diag[l] === 'need' || diag[l] === 'unclear');

            const summary = document.createElement('div');
            summary.className = 'card';
            summary.innerHTML = `
                <h3>📊 ملخص مستوى الطالب</h3>

            // جلب الجلسات
            const sessionsCard = document.createElement('div');
            sessionsCard.className = 'card';
            sessionsCard.innerHTML = '<h3>📂 سجل جلسات التدريب</h3>';
            try {
                const qS = query(collection(db, "sessions"), where("studentId", "==", state.user.uid), orderBy("date",

                if (snap.empty) {
                    sessionsCard.innerHTML += '<p class="muted">لا توجد جلسات مسجلة.</p>';
                } else {
                    snap.forEach(d => {
                        const sess = d.data();
                        const sItem = document.createElement('div');
                        sItem.className = 'session-card';
                        sItem.style.cssText =
                            'background:#FAFDFC;border:1px solid rgba(30,42,71,0.10);border-radius:14px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;';
                        sItem.innerHTML = `
                            <div>
                                <strong>جلسة حرف ${sess.letter || 'عامة'}</strong> - ${sess.date || ''}
                                <div style="font-size:12px;color:#6B7A99;">الهدف: ${sess.goal || 'تدريب نطق'}</div>
                            </div>
                            <button class="btn btn-primary btn-sm" id="openSess_${d.id}">فتح الجلسة</button>
                        `;
                        sessionsCard.appendChild(sItem);
                        setTimeout(() => {
                            document.getElementById(`openSess_${d.id}`).onclick = () => {
                                state.currentSession = { id: d.id, ...sess };
                                state.view = 'single-session';
                                render();
                            };
                        }, 0);
                    });
                }
            } catch (e) { sessionsCard.innerHTML += '<p class="muted">خطأ في تحميل الجلسات.</p>'; }
            appDiv.appendChild(sessionsCard);
        }

        // ---- صفحات الجلسات (مبسطة) ----
        function renderSpeechSessions(appDiv) {
            if (!state.currentStudent) {
                showToast('اختر طالباً أولاً');
                state.view = 'teacher-dashboard';
                return render();
            }
            renderTopbar(appDiv, `سجل جلسات: ${state.currentStudent.fullName || state.currentStudent.email}`,
                'إضافة وتدريب ورصد التقييم', () => {
                    state.view = 'teacher-dashboard';
                    render();
                });

            const addCard = document.createElement('div');
            addCard.className = 'card';
            addCard.innerHTML = `
                <h3>➕ إضافة جلسة تدريب جديدة</h3>
                <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;">
                    <select id="sessLetter">${ALL_LETTERS.map(l => `<option value="${l}">حرف ${l}</option>`).join('')}</select>
                    <input type="date" id="sessDate" value="${new Date().toISOString().split('T')[0]}">
                    <input type="text" id="sessGoal" placeholder="الهدف التعليمي">
                </div>
                <button class="btn btn-primary btn-sm" id="createSessBtn" style="margin-top:8px;">إنشاء الجلسة</button>
            `;
            appDiv.appendChild(addCard);

            addCard.querySelector('#createSessBtn').onclick = async () => {
                const letter = document.getElementById('sessLetter').value;
                const date = document.getElementById('sessDate').value;
                const goal = document.getElementById('sessGoal').value || `نطق حرف (${letter})`;
                try {
                    await addDoc(collection(db, "sessions"), {
                        studentId: state.currentStudent.id,
                        teacherId: state.user.uid,
                        letter,
                        date,
                        goal,
                        evaluation: 'none',
                        notes: '',
                        createdAt: new Date().toISOString()
                    });
                    showToast('تمت إضافة الجلسة بنجاح');
                    renderSpeechSessions(appDiv);
                } catch (e) {
                    showToast('خطأ في إضافة الجلسة: ' + e.message);
                }
            };

            // عرض الجلسات
            const listCard = document.createElement('div');
            listCard.className = 'card';
            listCard.innerHTML = '<h3>📋 الجلسات المسجلة</h3>';
            try {
                const qS = query(collection(db, "sessions"), where("studentId", "==", state.currentStudent.id), orderBy(
                    "date", "desc"));
                const snap = await getDocs(qS);
                if (snap.empty) {
                    listCard.innerHTML += '<p class="muted">لا توجد جلسات سابقة.</p>';
                } else {
                    snap.forEach(d => {
                        const sess = d.data();
                        const row = document.createElement('div');
                        row.className = 'session-card';
                        row.style.cssText =
                            'background:#FAFDFC;border:1px solid rgba(30,42,71,0.10);border-radius:14px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;';
                        row.innerHTML = `
                            <div>
                                <strong>حرف ${sess.letter}</strong> - ${sess.date}
                                <div><small>الهدف: ${sess.goal}</small></div>
                            </div>
                            <button class="btn btn-soft btn-sm" id="viewSess_${d.id}">فتح الجلسة</button>
                        `;
                        listCard.appendChild(row);
                        setTimeout(() => {
                            document.getElementById(`viewSess_${d.id}`).onclick = () => {
                                state.currentSession = { id: d.id, ...sess };
                                state.view = 'single-session';
                                render();
                            };
                        }, 0);
                    });
                }
            } catch (e) { listCard.innerHTML += '<p class="muted">خطأ في تحميل الجلسات: ' + e.message + '</p>'; }
            appDiv.appendChild(listCard);
        }

        function renderSingleSession(appDiv) {
            const sess = state.currentSession;
            if (!sess) { state.view = 'student-menu'; return render(); }
            renderTopbar(appDiv, `جلسة حرف (${sess.letter})`, `تاريخ: ${sess.date}`, () => {
                state.view = state.role === 'teacher' ? 'speech-sessions' : 'student-menu';
                render();
            });

            const infoCard = document.createElement('div');
            infoCard.className = 'card';
            infoCard.innerHTML = `
                <h3>هدف الجلسة: ${sess.goal}</h3>
                <p class="muted">التقييم: ${sess.evaluation || 'قيد التقييم'}</p>
                ${state.role === 'teacher' ? `
                    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">
                        <button class="btn btn-success btn-sm" id="evalP">✅ اجتاز</button>
                        <button class="btn btn-info btn-sm" id="evalTR">🔄 اجتاز بعد تدريب</button>
                        <button class="btn btn-soft btn-sm" id="evalN" style="color:#F57F17;">⚠️ يحتاج تدريب</button>
                        <button class="btn btn-danger btn-sm" id="evalU">❌ غير واضح</button>
                    </div>
                ` : '<p class="muted">💡 التقييم متاح للمعلم فقط.</p>'}
            `;
            appDiv.appendChild(infoCard);

            if (state.role === 'teacher') {
                const updateEval = async (val) => {
                    try {
                        await updateDoc(doc(db, "sessions", sess.id), { evaluation: val });
                        const studentRef = doc(db, "users", sess.studentId);
                        const stSnap = await getDoc(studentRef);
                        if (stSnap.exists()) {
                            const diag = stSnap.data().diagnostic || {};
                            diag[sess.letter] = val;
                            await updateDoc(studentRef, { diagnostic: diag });
                        }
                        sess.evaluation = val;
                        showToast('تم رصد التقييم');
                        renderSingleSession(appDiv);
                    } catch (e) { showToast('خطأ في حفظ التقييم'); }
                };
                setTimeout(() => {
                    document.getElementById('evalP').onclick = () => updateEval('passed');
                    document.getElementById('evalTR').onclick = () => updateEval('trained');
                    document.getElementById('evalN').onclick = () => updateEval('need');
                    document.getElementById('evalU').onclick = () => updateEval('unclear');
                }, 0);
            }

            // محتوى تدريبي بسيط
            const trainCard = document.createElement('div');
            trainCard.className = 'card';
            trainCard.innerHTML = `
                <h3>🔊 تدريب الحرف</h3>
                <div style="text-align:center;padding:20px;">
                    <div style="font-size:60px;cursor:pointer;" onclick="speakText('${sess.letter}')">${sess.letter}</div>
                    <button class="btn btn-primary" onclick="speakText('${sess.letter}')">استمع</button>
                </div>
            `;
            appDiv.appendChild(trainCard);
        }

        // ---- الخطة الفردية IEP (مبسطة) ----
        function renderIEPSession(appDiv) {
            if (!state.currentStudent) {
                showToast('اختر طالباً أولاً');
                state.view = 'teacher-dashboard';
                return render();
            }
            renderTopbar(appDiv, `الخطة الفردية (IEP): ${state.currentStudent.fullName || state.currentStudent.email}`,
                'تفاصيل الخطة', () => {
                    state.view = 'teacher-dashboard';
                    render();
                });

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <h3>📋 الخطة التربوية الفردية</h3>
                <p><strong>الطالب:</strong> ${state.currentStudent.fullName || state.currentStudent.email}</p>
                <p><strong>المعلم:</strong> ${state.user?.displayName || state.user?.email || 'المعلم'}</p>
                <hr style="border:0;border-top:1px solid rgba(30,42,71,0.10);margin:12px 0;">
                <p class="muted">سيتم إضافة تفاصيل الخطة في التحديث القادم.</p>
                <button class="btn btn-primary btn-sm" onclick="showToast('سيتم إضافة التقرير قريباً')">📄 عرض التقرير</button>
            `;
            appDiv.appendChild(card);
        }

        // ---- صفحة الأطعمة ----
        function renderFoodMenu(appDiv) {
            renderTopbar(appDiv, 'قائمة الأطعمة', 'تدريبات التسمية', () => { state.view = 'home';
                render(); });
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <h3>🍎 كروت الأطعمة</h3>
                <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:15px;">
                    ${FOOD_ITEMS.map(item => `
                        <div style="background:#F4F9F8;padding:20px 10px;border-radius:8px;text-align:center;font-size:18px;font-weight:bold;cursor:pointer;border:1px solid rgba(30,42,71,0.10);" onclick="speakText('${item}')">
                            🍎<br>${item}
                        </div>
                    `).join('')}
                </div>
            `;
            appDiv.appendChild(card);
        }

        // ---- صفحة عرض الحروف ----
        function renderLetterDisplay(appDiv) {
            const items = ['أ', 'ب', 'ت', 'ث', 'ج', 'ح', 'خ', 'د', 'ذ', 'ر', 'ز', 'س', 'ش', 'ص', 'ض', 'ط', 'ظ', 'ع', 'غ', 'ف',
                'ق', 'ك', 'ل', 'م', 'ن', 'هـ', 'و', 'ي'
            ];
            appDiv.innerHTML = `
                <div style="padding:16px;background:#F8FAFC;min-height:100vh;">
                    <h1 style="font-size:28px;font-weight:bold;text-align:center;margin-bottom:20px;color:#1E2A47;">الأحرف الأبجدية</h1>
                    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;">
                        ${items.map(letter => `
                            <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;background:white;border-radius:16px;border:4px solid #E0F2FE;cursor:pointer;" onclick="speakText('${letter}')">
                                <div style="width:80px;height:80px;background:linear-gradient(135deg,#4FB6A8,#357E74);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:50px;color:white;font-weight:bold;box-shadow:0 4px 10px rgba(79,182,168,0.4);margin-bottom:12px;">
                                    ${letter}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <div style="text-align:center;margin-top:20px;">
                        <button class="btn btn-soft" onclick="state.view='home';render();">رجوع للرئيسية</button>
                    </div>
                </div>
            `;
        }

        // ---- مراقبة حالة المصادقة ----
        onAuthStateChanged(auth, async (u) => {
            if (u) {
                state.user = u;
                await fetchUserData(u.uid);
            } else {
                state.user = null;
                state.role = null;
                if (state.view !== 'auth' && state.view !== 'register' && state.view !== 'reset-password') {
                    state.view = 'home';
                    render();
                }
            }
        });

        // ---- بدء التطبيق ----
        render();
    </script>
</body>
</html>
