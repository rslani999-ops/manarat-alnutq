<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منارة النطق لتدريبات النطق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E2A47;
    --paper:#EFF5FB;
    --mint:#4FB6A8;
    --mint-deep:#357E74;
    --sun:#F4B740;
    --coral:#EF6F5B;
    --lilac:#9C82C4;
    --white:#FFFFFF;
    --line: rgba(30,42,71,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
    background-image:
      radial-gradient(circle at 8% 12%, rgba(79,182,168,0.10) 0, transparent 40%),
      radial-gradient(circle at 92% 85%, rgba(239,111,91,0.08) 0, transparent 40%);
  }
  h1,h2,h3, .display{font-family:'Baloo Bhaijaan 2', sans-serif;}
  .num, .data{font-family:'IBM Plex Sans Arabic', sans-serif;}
  #app{max-width:960px;margin:0 auto;padding:20px 16px 60px;}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 4px 24px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mark{
    width:40px;height:40px;border-radius:12px;
    background:linear-gradient(135deg,var(--mint),var(--mint-deep));
    display:flex;align-items:center;justify-content:center;
    font-size:20px;color:white;box-shadow:0 4px 10px rgba(79,182,168,0.35);
  }
  .brand h1{font-size:20px;margin:0;font-weight:700;}
  .brand span{display:block;font-size:11px;color:#6B7A99;font-family:'Tajawal';margin-top:-2px;}
  .back-btn{
    border:none;background:white;color:var(--ink);padding:8px 14px;border-radius:10px;
    font-family:'Tajawal';font-weight:700;cursor:pointer;border:1px solid var(--line);
    display:flex;align-items:center;gap:6px;font-size:14px;
  }
  .back-btn:hover{background:#F5F8FC;}

  .card{background:white;border-radius:18px;border:1px solid var(--line);padding:20px;margin-bottom:16px;}
  .card h3{margin:0 0 4px;font-size:17px;}
  .muted{color:#6B7A99;font-size:13px;}

  .btn{
    border:none;border-radius:12px;padding:12px 20px;font-family:'Tajawal';font-weight:700;
    cursor:pointer;font-size:15px;transition:filter .15s, transform .15s;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--mint-deep);color:white;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-soft{background:#EAF6F4;color:var(--mint-deep);}
  .btn-soft:hover{background:#DDF0ED;}
  .btn-success{background:#10B981;color:white;}
  .btn-success:hover{filter:brightness(1.08);}
  .btn-block{width:100%;}
  .btn-sm{padding:8px 14px;font-size:13px;border-radius:9px;}

  input[type=text], input[type=password], input[type=email], input[type=number], select{
    width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);
    font-family:'Tajawal';font-size:15px;background:#FBFDFE;margin-bottom:12px;
  }
  input:focus, select:focus{outline:none;border-color:var(--mint);}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:white;padding:12px 22px;border-radius:12px;
    font-family:'Tajawal';font-weight:700;font-size:14px;z-index:50;
    box-shadow:0 10px 24px rgba(0,0,0,0.2);
  }

  .auth-form{max-width:400px;margin:0 auto;background:white;padding:30px;border-radius:20px;border:1px solid var(--line);}
  .auth-form h2{text-align:center;margin-bottom:20px;}
  .auth-toggle{text-align:center;margin-top:15px;font-size:14px;color:#5B6A88;}
  .auth-toggle span{color:var(--mint-deep);cursor:pointer;font-weight:700;}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-analytics.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import { getFirestore, setDoc, doc, getDoc, updateDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDTst5UKgNJ6ThVOAVHOG3JoWfEvUp1asw",
  authDomain: "manarat-alnutq.firebaseapp.com",
  projectId: "manarat-alnutq",
  storageBucket: "manarat-alnutq.firebasestorage.app",
  messagingSenderId: "543101731444",
  appId: "1:543101731444:web:fd762353bdf558ca978721",
  measurementId: "G-ZX5NYBYNRK"
};

const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const auth = getAuth(app);
const db = getFirestore(app);

const ARABIC_LETTERS = [
  {ch:'ا', word:'أَسَد'}, {ch:'ب', word:'بَطَّة'}, {ch:'ت', word:'تُفَّاح'}, {ch:'ث', word:'ثَعْلَب'},
  {ch:'ج', word:'جَمَل'}, {ch:'ح', word:'حِصَان'}, {ch:'خ', word:'خُبْز'}, {ch:'د', word:'دُبّ'},
  {ch:'ذ', word:'ذِئْب'}, {ch:'ر', word:'رُمَّان'}, {ch:'ز', word:'زَرَافَة'}, {ch:'س', word:'سَمَك'},
  {ch:'ش', word:'شَمْس'}, {ch:'ص', word:'صَقْر'}, {ch:'ض', word:'ضِفْدَع'}, {ch:'ط', word:'طَائِرَة'},
  {ch:'ظ', word:'ظَبْي'}, {ch:'ع', word:'عَصْفُور'}, {ch:'غ', word:'غَزَال'}, {ch:'ف', word:'فِيل'},
  {ch:'ق', word:'قِطَّة'}, {ch:'ك', word:'كَلْب'}, {ch:'ل', word:'لَيْمُون'}, {ch:'م', word:'مَوْز'},
  {ch:'ن', word:'نَحْلَة'}, {ch:'هـ', word:'هِلَال'}, {ch:'و', word:'وَرْدَة'}, {ch:'ي', word:'يَد'}
];

const FOOD_ITEMS = ['تفاحة', 'موزة', 'برتقالة', 'عنب', 'تمر', 'خبز', 'جبن', 'حليب', 'ماء', 'عصير'];

let state = { view:'auth', user:null, role:null, students:[], allTeachers:[] };
let toastTimer=null;

function showToast(msg){
  const t=document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.remove(), 2200);
}

function topbar(app, title, sub, onBack){
  const bar = document.createElement('div');
  bar.className='topbar';
  bar.innerHTML = `
    <div class="brand">
      <div class="mark">🎙️</div>
      <div><h1>${title}</h1><span>${sub||''}</span></div>
    </div>
  `;
  if(onBack){
    const btn=document.createElement('button');
    btn.className='back-btn';
    btn.innerHTML='رجوع ←';
    btn.onclick=onBack;
    bar.appendChild(btn);
  }
  app.appendChild(bar);
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  if(state.view==='auth') return renderAuth(app);
  if(state.view==='register') return renderRegister(app);
  if(state.view==='teacher-dashboard') return renderTeacherDashboard(app);
  if(state.view==='student-menu') return renderStudentMenu(app);
  if(state.view==='diagnostics') return renderDiagnostics(app);
  if(state.view==='food-menu') return renderFoodMenu(app);
  if(state.view==='iep-session') return renderIEPSession(app);
}

function renderAuth(app){
  const card = document.createElement('div');
  card.className = 'auth-form';
  card.innerHTML = `
    <h2>تسجيل الدخول</h2>
    <input type="email" id="email" placeholder="البريد الإلكتروني">
    <input type="password" id="password" placeholder="كلمة المرور">
    <button class="btn btn-primary btn-block" id="loginBtn">دخول</button>
    <div class="auth-toggle">ليس لديك حساب؟ <span id="toRegister">إنشاء حساب</span></div>
  `;
  
  card.querySelector('#loginBtn').onclick = async () => {
    const email = card.querySelector('#email').value;
    const password = card.querySelector('#password').value;
    try {
      const userCredential = await signInWithEmailAndPassword(auth, email, password);
      state.user = userCredential.user;
      checkUserRole(state.user.uid);
    } catch (error) {
      showToast('خطأ في البريد الإلكتروني أو كلمة المرور');
    }
  };

  card.querySelector('#toRegister').onclick = () => {
    state.view = 'register';
    render();
  };

  app.appendChild(card);
}

function renderRegister(app){
  const card = document.createElement('div');
  card.className = 'auth-form';
  card.innerHTML = `
    <h2>إنشاء حساب</h2>
    <input type="email" id="email" placeholder="البريد الإلكتروني">
    <input type="password" id="password" placeholder="كلمة المرور">
    <select id="role">
      <option value="student">طالب</option>
      <option value="teacher">معلم</option>
    </select>
    <button class="btn btn-primary btn-block" id="registerBtn">تسجيل</button>
    <div class="auth-toggle">لديك حساب بالفعل؟ <span id="toLogin">تسجيل الدخول</span></div>
  `;

  card.querySelector('#registerBtn').onclick = async () => {
    const email = card.querySelector('#email').value;
    const password = card.querySelector('#password').value;
    const role = card.querySelector('#role').value;
    try {
      const userCredential = await createUserWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;
      await setDoc(doc(db, "users", user.uid), { role: role, email: email });
      state.user = user;
      state.role = role;
      state.view = role === 'teacher' ? 'teacher-dashboard' : 'student-menu';
      render();
    } catch (error) {
      showToast('خطأ في إنشاء الحساب');
    }
  };

  card.querySelector('#toLogin').onclick = () => {
    state.view = 'auth';
    render();
  };

  app.appendChild(card);
}

async function checkUserRole(uid) {
  try {
    const userDoc = await getDoc(doc(db, "users", uid));
    if (userDoc.exists()) {
      state.role = userDoc.data().role;
      state.view = state.role === 'teacher' ? 'teacher-dashboard' : 'student-menu';
      if (state.role === 'teacher') fetchStudents();
    } else {
      showToast('لم يتم العثور على بيانات المستخدم');
    }
  } catch (error) {
    showToast('خطأ في جلب بيانات الدور');
  }
  render();
}

async function fetchStudents() {
  try {
    const q = query(collection(db, "users"), where("role", "==", "student"));
    const querySnapshot = await getDocs(q);
    state.students = [];
    querySnapshot.forEach((docSnap) => {
      state.students.push({ id: docSnap.id, ...docSnap.data() });
    });
    fetchTeachers();
  } catch (error) {
    showToast('خطأ في جلب بيانات الطلاب');
  }
}

async function fetchTeachers() {
  try {
    const q = query(collection(db, "users"), where("role", "==", "teacher"));
    const querySnapshot = await getDocs(q);
    state.allTeachers = [];
    querySnapshot.forEach((docSnap) => {
      state.allTeachers.push({ id: docSnap.id, email: docSnap.data().email });
    });
    renderTeacherDashboard(document.getElementById('app'));
  } catch (error) {
    showToast('خطأ في جلب بيانات المعلمين');
  }
}

async function assignTeacher(studentId, teacherId) {
  try {
    const studentRef = doc(db, "users", studentId);
    await updateDoc(studentRef, { teacherId: teacherId });
    showToast('تم ربط الطالب بالمعلم بنجاح');
    fetchStudents();
  } catch (error) {
    showToast('خطأ في ربط الطالب بالمعلم');
  }
}

function renderTeacherDashboard(app){
  app.innerHTML = '';
  topbar(app, 'لوحة المعلم', 'إدارة الطلاب والخطط', async () => {
    await signOut(auth);
    state.view = 'auth';
    state.user = null;
    render();
  });

  // زر الانتقال لواجهة الخطة الفردية وسجل الجلسات
  const planNavCard = document.createElement('div');
  planNavCard.className = 'card';
  planNavCard.innerHTML = `
    <h3>الخطط التدريبية وسجل الجلسات (IEP)</h3>
    <p class="muted" style="margin-bottom:12px;">إدارة أهداف الجلسة الحالية وتسجيل نسب إتقان المحاولات.</p>
    <button class="btn btn-primary" onclick="state.view='iep-session'; render();">فتح لوحة إدارة الجلسات الفردية</button>
  `;
  app.appendChild(planNavCard);

  const card = document.createElement('div');
  card.className = 'card';
  let html = '<h3>قائمة الطلاب المسجلين</h3>';
  
  if (state.students.length === 0) {
    html += '<p class="muted">لا يوجد طلاب مسجلون حالياً.</p>';
  } else {
    html += '<div style="margin-top:10px;">';
    state.students.forEach(student => {
      html += `<div style="padding:10px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center;">
        <div>
          <span><strong>${student.email || student.id}</strong></span>
          <br>
          <span class="muted">المعلم الحالي: ${student.teacherId || 'غير محدد'}</span>
        </div>
        <div>
          <select id="select-${student.id}">
            <option value="">اختر معلماً</option>
            ${state.allTeachers.map(t => `<option value="${t.id}" ${student.teacherId === t.id ? 'selected' : ''}>${t.email || t.id}</option>`).join('')}
          </select>
          <button class="btn btn-primary btn-sm" onclick="window.assignTeacher('${student.id}', document.getElementById('select-${student.id}').value)">ربط</button>
        </div>
      </div>`;
    });
    html += '</div>';
  }
  
  card.innerHTML = html;
  app.appendChild(card);
}

window.assignTeacher = assignTeacher;

// واجهة الخطة التدريبية وسجل الجلسات الفردية للمعلم
function renderIEPSession(app){
  topbar(app, 'الخطة التدريبية (IEP) وسجل الجلسات', 'إدارة الجلسة الحالية', () => {
    state.view = state.role === 'teacher' ? 'teacher-dashboard' : 'student-menu';
    render();
  });

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h3>تحديد الهدف والنشاط التدريبي</h3>
    <div style="margin-top:12px;">
      <label class="block text-sm font-medium text-slate-600 mb-1">الهدف الرئيسي للخطة:</label>
      <input type="text" id="mainGoal" placeholder="مثلاً: إتقان نطق صوت /ر/ في جميع مواقع الكلمة">

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">الهدف الفرعي:</label>
          <select id="subGoalSelect">
            <option value="isolated">نطق الصوت منفرداً</option>
            <option value="syllables">المقاطع الصوتية</option>
            <option value="words">الكلمات</option>
            <option value="sentences">الجمل البسيطة</option>
            <option value="conversation">المحادثة والتلقائي</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">النشاط المستخدم:</label>
          <select id="activitySelect">
            <option value="repetition">تكرار (Repetition)</option>
            <option value="naming">تسمية الصور (Picture Naming)</option>
            <option value="matching">مطابقة (Matching)</option>
            <option value="reading">قراءة جهرية (Reading)</option>
          </select>
        </div>
      </div>

      <div style="background:#FBFDFE; padding:15px; border-radius:12px; border:1px solid var(--line); margin-top:15px;">
        <h4 style="margin-top:0; font-size:15px;">تسجيل نتائج الجلسة اليومية</h4>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
          <div>
            <label class="muted" style="display:block; margin-bottom:5px;">إجمالي المحاولات:</label>
            <input type="number" id="totalTrials" value="20" oninput="window.calcScore()">
          </div>
          <div>
            <label class="muted" style="display:block; margin-bottom:5px;">الإجابات الصحيحة:</label>
            <input type="number" id="correctTrials" value="0" oninput="window.calcScore()">
          </div>
        </div>
        <div style="text-align:left; font-weight:bold; color:var(--mint-deep); margin-top:10px;">
          نسبة إتقان الجلسة: <span id="sessionScoreDisplay">0%</span>
        </div>
      </div>

      <button class="btn btn-success btn-block" style="margin-top:15px;" onclick="window.saveSessionLog()">
        حفظ جلسة التدريب وتحديث التقدم
      </button>
    </div>
  `;
  app.appendChild(card);
}

window.calcScore = function() {
  let total = document.getElementById('totalTrials').value;
  let correct = document.getElementById('correctTrials').value;
  if(total > 0 && correct >= 0) {
    let percentage = Math.round((correct / total) * 100);
    document.getElementById('sessionScoreDisplay').innerText = percentage + '%';
  }
}

window.saveSessionLog = function() {
  let score = document.getElementById('sessionScoreDisplay').innerText;
  let subGoal = document.getElementById('subGoalSelect').value;
  let activity = document.getElementById('activitySelect').value;
  let mainGoal = document.getElementById('mainGoal').value;
  
  let sessionData = { mainGoal, subGoal, activity, score, date: new Date().toLocaleDateString('ar-SA') };
  
  let sessions = JSON.parse(localStorage.getItem('minarat_sessions') || '[]');
  sessions.push(sessionData);
  localStorage.setItem('minarat_sessions', JSON.stringify(sessions));
  
  showToast('تم حفظ جلسة التدريب بنجاح!');
}

function renderStudentMenu(app){
  topbar(app, 'صفحة الطالب', 'اختر النشاط', async () => {
    await signOut(auth);
    state.view = 'auth';
    state.user = null;
    render();
  });

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = '<h3>أهلاً بك يا بطل</h3>';
  app.appendChild(card);

  const diagBtn = document.createElement('button');
  diagBtn.className = 'btn btn-primary btn-block';
  diagBtn.textContent = 'تشخيص النطق';
  diagBtn.onclick = () => {
    state.view = 'diagnostics';
    render();
  };
  card.appendChild(diagBtn);

  const foodBtn = document.createElement('button');
  foodBtn.className = 'btn btn-soft btn-block';
  foodBtn.style.marginTop = '10px';
  foodBtn.textContent = 'أصناف الطعام';
  foodBtn.onclick = () => {
    state.view = 'food-menu';
    render();
  };
  card.appendChild(foodBtn);
}

function renderDiagnostics(app) {
  topbar(app, 'تشخيص النطق', 'قراءة الحروف', () => {
    state.view = 'student-menu';
    render();
  });

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = '<h3>اختر حرفاً للتشخيص:</h3>';
  
  const grid = document.createElement('div');
  grid.style.display = 'grid';
  grid.style.gridTemplateColumns = 'repeat(5, 1fr)';
  grid.style.gap = '10px';
  grid.style.marginTop = '15px';

  ARABIC_LETTERS.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'btn btn-soft';
    btn.textContent = `${item.ch} - ${item.word}`;
    btn.onclick = () => showToast(`قم بنطق الكلمة: ${item.word}`);
    grid.appendChild(btn);
  });

  card.appendChild(grid);
  app.appendChild(card);
}

function renderFoodMenu(app) {
  topbar(app, 'أصناف الطعام', 'اختر طعاماً للتدريب', () => {
    state.view = 'student-menu';
    render();
  });

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = '<h3>أصناف الطعام المتاحة:</h3>';

  const list = document.createElement('div');
  list.style.marginTop = '15px';

  FOOD_ITEMS.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'btn btn-soft btn-block';
    btn.textContent = item;
    btn.style.marginBottom = '8px';
    btn.onclick = () => showToast(`قم بنطق: ${item}`);
    list.appendChild(btn);
  });

  card.appendChild(list);
  app.appendChild(card);
}

onAuthStateChanged(auth, (user) => {
  if (user) {
    state.user = user;
    checkUserRole(user.uid);
  } else {
    state.view = 'auth';
    render();
  }
});

render();
</script>
</body>
</html>
